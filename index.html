month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<ul><li><strong>Anti-join<\/strong> (\"rows in A with no match in B\"): <code>LEFT JOIN ... WHERE b.key IS NULL<\/code>, or <code>NOT EXISTS (...)<\/code>. Be careful with <code>NOT IN<\/code> when the subquery can return NULLs: it then matches nothing.<\/li><li>With a LEFT JOIN, <code>COUNT(b.col)<\/code> counts only matched rows, while <code>COUNT(*)<\/code> counts 1 even when there's no match.<\/li><li><code>COALESCE(x, 0)<\/code> turns NULL into 0.<\/li><\/ul>", "stretch": null, "problems": [{"kind": "sql", "title": "Customers with no account", "task": "<p>Return <code>customer_id, name<\/code> of customers who have no account, <strong>ordered by<\/strong> customer_id.<\/p>", "hint": "LEFT JOIN, then WHERE a.account_id IS NULL.", "solution": "SELECT c.customer_id, c.name\nFROM customers c\nLEFT JOIN accounts a ON a.customer_id = c.customer_id\nWHERE a.account_id IS NULL\nORDER BY c.customer_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Every customer's footprint", "task": "<p>For <strong>all<\/strong> customers: <code>name, num_accounts, total_balance<\/code> (0 when none), <strong>ordered by<\/strong> total_balance descending, then name.<\/p>", "hint": "COUNT(a.account_id), not COUNT(*). COALESCE the SUM.", "solution": "SELECT c.name, COUNT(a.account_id) AS num_accounts, COALESCE(SUM(a.balance), 0) AS total_balance\nFROM customers c\nLEFT JOIN accounts a ON a.customer_id = c.customer_id\nGROUP BY c.customer_id, c.name\nORDER BY total_balance DESC, c.name;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Quiet accounts in March", "task": "<p>Accounts with <strong>no<\/strong> transactions in March 2026: <code>account_id<\/code>, <strong>ordered by<\/strong> account_id.<\/p>", "hint": "NOT EXISTS with a correlated subquery on the March date range.", "solution": "SELECT a.account_id\nFROM accounts a\nWHERE NOT EXISTS (\n    SELECT 1 FROM transactions t\n    WHERE t.account_id = a.account_id\n      AND t.txn_date >= '2026-03-01' AND t.txn_date < '2026-04-01')\nORDER BY a.account_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 22, "week": 4, "track": "py", "title": "Classes & objects", "learn": "<p>A <strong>class<\/strong> is a blueprint. An <strong>object<\/strong> (or instance) is one thing built from it, with its own data.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class Account:\n    def __init__(self, owner, balance):   # runs when you create one\n        self.owner = owner                # attributes live on self\n        self.balance = balance\n\n    def is_rich(self):                    # a method: a function on the object\n        return self.balance &gt; 100000\n\na = Account(&quot;Rishitha&quot;, 250000)\na.owner        # &#x27;Rishitha&#x27;\na.is_rich()    # True<\/code><\/pre>\n<ul><li><code>self<\/code> is the object itself. Python passes it in for you automatically.<\/li><li>Every method's first parameter is <code>self<\/code>.<\/li><li>Each object has <strong>its own<\/strong> attributes. Changing <code>a.balance<\/code> doesn't affect any other Account.<\/li><\/ul>\n<div class=\"bridge\">SQL bridge: a class is like a table definition and an object is like a row, but a row that also carries behaviour (its methods).<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Rectangle", "task": "<p>Create class <code>Rectangle(width, height)<\/code> with methods <code>area()<\/code>, <code>perimeter()<\/code> and <code>is_square()<\/code>.<\/p>", "hint": "Store width and height on self in __init__, then use self.width and self.height in the methods.", "solution": "class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\n    def area(self):\n        return self.width * self.height\n\n    def perimeter(self):\n        return 2 * (self.width + self.height)\n\n    def is_square(self):\n        return self.width == self.height", "starter": "class Rectangle:\n    def __init__(self, width, height):\n        pass\n\n    def area(self):\n        pass\n\n    def perimeter(self):\n        pass\n\n    def is_square(self):\n        pass", "tests": ["Rectangle(3, 4).area()", "Rectangle(3, 4).perimeter()", "Rectangle(5, 5).is_square()", "Rectangle(2, 3).is_square()", "Rectangle(3, 4).width"], "setup": ""}, {"kind": "py", "title": "Click counter", "task": "<p>Create <code>ClickCounter<\/code> with attribute <code>count<\/code> (starts at 0), <code>click()<\/code> (adds 1 and <strong>returns<\/strong> the new count) and <code>reset()<\/code> (sets it back to 0).<\/p>", "hint": "__init__ takes only self and sets self.count = 0.", "solution": "class ClickCounter:\n    def __init__(self):\n        self.count = 0\n\n    def click(self):\n        self.count += 1\n        return self.count\n\n    def reset(self):\n        self.count = 0", "starter": "class ClickCounter:\n    pass", "tests": ["ClickCounter().count", "(lambda c: [c.click(), c.click(), c.click()])(ClickCounter())", "(lambda c: (c.click(), c.reset(), c.count)[2])(ClickCounter())"], "setup": ""}]}, {"n": 23, "week": 4, "track": "py", "title": "Objects that protect their own state", "learn": "<p>Good classes <strong>guard their data<\/strong>: a method checks the input before it changes anything.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class Wallet:\n    def __init__(self, balance=0):\n        self.balance = balance\n        self.history = []                 # each object gets its own list\n\n    def spend(self, amount):\n        if amount &lt;= 0:\n            raise ValueError(&quot;amount must be positive&quot;)\n        if amount &gt; self.balance:\n            raise ValueError(&quot;insufficient funds&quot;)\n        self.balance -= amount\n        self.history.append((&quot;spend&quot;, amount))\n        return self.balance<\/code><\/pre>\n<p>Design tip: <strong>validate first, then change state<\/strong>. Then a failed call leaves the object exactly as it was.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Bank account", "task": "<p>Create <code>BankAccount(owner, balance=0)<\/code> with:<\/p>\n<ul><li><code>deposit(amount)<\/code> → returns the new balance; raises <code>ValueError<\/code> if amount ≤ 0<\/li><li><code>withdraw(amount)<\/code> → returns the new balance; raises <code>ValueError<\/code> if amount ≤ 0 or amount &gt; balance<\/li><li><code>history<\/code>: a list of tuples like <code>(&#x27;deposit&#x27;, 500)<\/code>, one per successful operation<\/li><\/ul>", "hint": "Validate at the top of each method and <code>raise ValueError(...)<\/code>. Only after that, change balance and append to history.", "solution": "class BankAccount:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n        self.history = []\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError(\"amount must be positive\")\n        self.balance += amount\n        self.history.append((\"deposit\", amount))\n        return self.balance\n\n    def withdraw(self, amount):\n        if amount <= 0 or amount > self.balance:\n            raise ValueError(\"invalid withdrawal\")\n        self.balance -= amount\n        self.history.append((\"withdraw\", amount))\n        return self.balance", "starter": "class BankAccount:\n    def __init__(self, owner, balance=0):\n        pass", "tests": ["BankAccount('R', 100).deposit(50)", "BankAccount('R').balance", "(lambda a: (a.deposit(500), a.withdraw(200), a.history))(BankAccount('R'))", "_raises(lambda: BankAccount('R', 100).withdraw(500), ValueError)", "_raises(lambda: BankAccount('R', 100).deposit(-5), ValueError)", "(lambda a: (_raises(lambda: a.withdraw(999), ValueError), a.balance, a.history))(BankAccount('R', 100))"], "setup": ""}, {"kind": "py", "title": "Shopping cart", "task": "<p>Create <code>ShoppingCart<\/code> with:<\/p>\n<ul><li><code>add_item(name, price, qty=1)<\/code>: adding a name that's already in the cart <strong>increases its qty<\/strong><\/li><li><code>remove_item(name)<\/code>: removes that item completely<\/li><li><code>total()<\/code>: sum of price × qty<\/li><li><code>item_count()<\/code>: total quantity of all items<\/li><\/ul>", "hint": "Keep a dict name → {'price', 'qty'}. total() can use <code>sum(... for i in self.items.values())<\/code>.", "solution": "class ShoppingCart:\n    def __init__(self):\n        self.items = {}\n\n    def add_item(self, name, price, qty=1):\n        if name in self.items:\n            self.items[name][\"qty\"] += qty\n        else:\n            self.items[name] = {\"price\": price, \"qty\": qty}\n\n    def remove_item(self, name):\n        self.items.pop(name, None)\n\n    def total(self):\n        return sum(i[\"price\"] * i[\"qty\"] for i in self.items.values())\n\n    def item_count(self):\n        return sum(i[\"qty\"] for i in self.items.values())", "starter": "class ShoppingCart:\n    def __init__(self):\n        self.items = {}   # name -> {'price': .., 'qty': ..}", "tests": ["(lambda c: (c.add_item('pen', 10, 3), c.add_item('book', 250), c.total())[2])(ShoppingCart())", "(lambda c: (c.add_item('pen', 10), c.add_item('pen', 10, 2), c.item_count())[2])(ShoppingCart())", "(lambda c: (c.add_item('pen', 10), c.add_item('mug', 99), c.remove_item('pen'), c.total())[3])(ShoppingCart())", "ShoppingCart().total()"], "setup": ""}]}, {"n": 24, "week": 4, "track": "py", "title": "Class attributes, @classmethod & @staticmethod", "learn": "<pre class=\"code\" data-lang=\"python\"><code>class Loan:\n    base_rate = 0.09            # CLASS attribute: shared by all loans\n\n    def __init__(self, amount):\n        self.amount = amount    # INSTANCE attribute: one per loan\n\n    def interest(self):\n        return self.amount * self.base_rate   # instance first, then class\n\n    @classmethod\n    def from_lakhs(cls, lakhs):   # another way to construct an object\n        return cls(lakhs * 100000)\n\n    @staticmethod\n    def is_valid_amount(x):       # helper with no self or cls\n        return x &gt; 0\n\nLoan.from_lakhs(5).amount   # 500000<\/code><\/pre>\n<p>When you write <code>self.base_rate<\/code>, Python looks on the instance first and then on the class. Setting <code>obj.base_rate = 0.12<\/code> overrides it for <strong>that object only<\/strong>.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Temperature", "task": "<p>Create <code>Temperature(celsius)<\/code> with:<\/p>\n<ul><li><code>to_fahrenheit()<\/code> → <code>celsius * 9/5 + 32<\/code><\/li><li><code>@classmethod from_fahrenheit(cls, f)<\/code> → a Temperature<\/li><li><code>@staticmethod is_valid(c)<\/code> → True if <code>c &gt;= -273.15<\/code><\/li><\/ul>", "hint": "from_fahrenheit converts with (f - 32) * 5/9 and then <code>return cls(...)<\/code>.", "solution": "class Temperature:\n    def __init__(self, celsius):\n        self.celsius = celsius\n\n    def to_fahrenheit(self):\n        return self.celsius * 9 / 5 + 32\n\n    @classmethod\n    def from_fahrenheit(cls, f):\n        return cls((f - 32) * 5 / 9)\n\n    @staticmethod\n    def is_valid(c):\n        return c >= -273.15", "starter": "class Temperature:\n    pass", "tests": ["Temperature(100).to_fahrenheit()", "round(Temperature.from_fahrenheit(212).celsius, 2)", "Temperature.is_valid(-300)", "Temperature.is_valid(25)", "isinstance(Temperature.from_fahrenheit(50), Temperature)"], "setup": ""}, {"kind": "py", "title": "Employee raises", "task": "<p>Create <code>Employee(name, salary)<\/code> with a <strong>class attribute<\/strong> <code>raise_pct = 0.10<\/code> and <code>apply_raise()<\/code>, which multiplies salary by <code>(1 + self.raise_pct)<\/code>.<\/p>", "hint": "Put <code>raise_pct = 0.10<\/code> directly in the class body (not in __init__) and use <code>self.raise_pct<\/code> in the method.", "solution": "class Employee:\n    raise_pct = 0.10\n\n    def __init__(self, name, salary):\n        self.name = name\n        self.salary = salary\n\n    def apply_raise(self):\n        self.salary = self.salary * (1 + self.raise_pct)", "starter": "class Employee:\n    pass", "tests": ["Employee.raise_pct", "(lambda e: (e.apply_raise(), round(e.salary, 2))[1])(Employee('A', 1000))", "(lambda e: (setattr(e, 'raise_pct', 0.5), e.apply_raise(), round(e.salary, 2))[2])(Employee('B', 1000))"], "setup": ""}]}, {"n": 25, "week": 4, "track": "py", "title": "Inheritance & super()", "learn": "<p>A child class gets everything from its parent and can <strong>override<\/strong> or <strong>extend<\/strong> it.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class Account:\n    def __init__(self, owner, balance):\n        self.owner, self.balance = owner, balance\n    def describe(self):\n        return f&quot;{self.owner}: {self.balance}&quot;\n\nclass FixedDeposit(Account):                 # inherits from Account\n    def __init__(self, owner, balance, years):\n        super().__init__(owner, balance)     # reuse the parent&#x27;s setup\n        self.years = years\n    def describe(self):                      # override\n        return super().describe() + f&quot; for {self.years}y&quot;\n\nisinstance(FixedDeposit(&quot;R&quot;, 1, 2), Account)   # True<\/code><\/pre>\n<p>Use inheritance for real <strong>\"is-a\"<\/strong> relationships (a FixedDeposit <em>is an<\/em> Account). If you just want to reuse some code, composition is usually better (day 32).<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Animals", "task": "<p>Create <code>Animal(name)<\/code> with <code>speak()<\/code> returning <code>&quot;...&quot;<\/code> and <code>describe()<\/code> returning <code>f&quot;{name}: {speak()}&quot;<\/code>. Then <code>Dog<\/code> (speaks <code>&quot;Woof&quot;<\/code>) and <code>Cat<\/code> (speaks <code>&quot;Meow&quot;<\/code>) that **only override <code>speak<\/code>**.<\/p>", "hint": "describe() lives only in Animal and calls self.speak(). Python uses the child's version automatically.", "solution": "class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n    def describe(self):\n        return f\"{self.name}: {self.speak()}\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"Woof\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \"Meow\"", "starter": "class Animal:\n    pass\n\nclass Dog(Animal):\n    pass\n\nclass Cat(Animal):\n    pass", "tests": ["Dog('Rex').describe()", "Cat('Tom').describe()", "Animal('Generic').describe()", "isinstance(Dog('x'), Animal)"], "setup": ""}, {"kind": "py", "title": "Savings account", "task": "<p><code>Account(owner, balance)<\/code> has <code>withdraw(amount)<\/code> (raises <code>ValueError<\/code> if amount &gt; balance; returns the new balance).<\/p>\n<p><code>SavingsAccount(owner, balance, rate)<\/code> inherits from it and adds:<\/p>\n<ul><li><code>add_interest()<\/code> → balance becomes <code>round(balance * (1 + rate), 2)<\/code> and is returned<\/li><li>a minimum balance of <strong>1000<\/strong>: withdraw raises <code>ValueError<\/code> if it would leave less than 1000<\/li><\/ul>", "hint": "Call <code>super().__init__(owner, balance)<\/code> and then store rate. In withdraw, check the minimum first and then <code>return super().withdraw(amount)<\/code>.", "solution": "class Account:\n    def __init__(self, owner, balance):\n        self.owner = owner\n        self.balance = balance\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n        return self.balance\n\nclass SavingsAccount(Account):\n    MIN_BALANCE = 1000\n\n    def __init__(self, owner, balance, rate):\n        super().__init__(owner, balance)\n        self.rate = rate\n\n    def add_interest(self):\n        self.balance = round(self.balance * (1 + self.rate), 2)\n        return self.balance\n\n    def withdraw(self, amount):\n        if self.balance - amount < self.MIN_BALANCE:\n            raise ValueError(\"minimum balance is 1000\")\n        return super().withdraw(amount)", "starter": "class Account:\n    def __init__(self, owner, balance):\n        self.owner = owner\n        self.balance = balance\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            raise ValueError(\"insufficient funds\")\n        self.balance -= amount\n        return self.balance\n\nclass SavingsAccount(Account):\n    pass", "tests": ["SavingsAccount('R', 5000, 0.04).add_interest()", "SavingsAccount('R', 5000, 0.04).withdraw(3000)", "_raises(lambda: SavingsAccount('R', 5000, 0.04).withdraw(4500), ValueError)", "Account('R', 5000).withdraw(4500)", "isinstance(SavingsAccount('R', 1, 0.1), Account)"], "setup": ""}]}, {"n": 26, "week": 4, "track": "py", "title": "Polymorphism & duck typing", "learn": "<p><strong>Polymorphism<\/strong> means different classes offer the same method name, so the calling code doesn't need to care which class it has.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class UPI:\n    def pay(self, amt): return f&quot;UPI paid {amt}&quot;\nclass Card:\n    def pay(self, amt): return f&quot;Card paid {amt}&quot;\n\nfor method in [UPI(), Card()]:\n    print(method.pay(100))     # each one does its own thing<\/code><\/pre>\n<p>Python uses <strong>duck typing<\/strong>: \"if it walks like a duck and quacks like a duck…\". <code>method<\/code> doesn't need a shared parent class. It only needs a <code>.pay()<\/code> method.<\/p>\n<p>This is why you see code like <code>len(x)<\/code> working on lists, strings and dicts alike.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Total area of shapes", "task": "<p>Create <code>Circle(r)<\/code>, <code>Square(side)<\/code> and <code>Triangle(base, height)<\/code>, each with an <code>area()<\/code> method (use <code>math.pi<\/code> for the circle). Then write <code>total_area(shapes)<\/code> returning the sum of areas rounded to 2 decimals.<\/p>", "hint": "total_area doesn't care about the type. It just calls <code>s.area()<\/code> on each shape and sums the results.", "solution": "import math\n\nclass Circle:\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return math.pi * self.r ** 2\n\nclass Square:\n    def __init__(self, side):\n        self.side = side\n    def area(self):\n        return self.side ** 2\n\nclass Triangle:\n    def __init__(self, base, height):\n        self.base, self.height = base, height\n    def area(self):\n        return 0.5 * self.base * self.height\n\ndef total_area(shapes):\n    return round(sum(s.area() for s in shapes), 2)", "starter": "import math\n\nclass Circle:\n    pass\n\nclass Square:\n    pass\n\nclass Triangle:\n    pass\n\ndef total_area(shapes):\n    pass", "tests": ["total_area([Circle(1), Square(2), Triangle(3, 4)])", "total_area([])", "round(Circle(2).area(), 2)", "Triangle(10, 5).area()"], "setup": ""}, {"kind": "py", "title": "Notifiers", "task": "<p>Create <code>EmailNotifier(address)<\/code> whose <code>send(msg)<\/code> returns <code>&quot;Email to &lt;address&gt;: &lt;msg&gt;&quot;<\/code> and <code>SMSNotifier(number)<\/code> whose <code>send(msg)<\/code> returns <code>&quot;SMS to &lt;number&gt;: &lt;msg&gt;&quot;<\/code>. Write <code>notify_all(notifiers, msg)<\/code> returning a list of results.<\/p>", "hint": "Each class stores its target in __init__. notify_all is a one-line comprehension.", "solution": "class EmailNotifier:\n    def __init__(self, address):\n        self.address = address\n    def send(self, msg):\n        return f\"Email to {self.address}: {msg}\"\n\nclass SMSNotifier:\n    def __init__(self, number):\n        self.number = number\n    def send(self, msg):\n        return f\"SMS to {self.number}: {msg}\"\n\ndef notify_all(notifiers, msg):\n    return [n.send(msg) for n in notifiers]", "starter": "class EmailNotifier:\n    pass\n\nclass SMSNotifier:\n    pass\n\ndef notify_all(notifiers, msg):\n    pass", "tests": ["notify_all([EmailNotifier('r@x.com'), SMSNotifier('98480')], 'KYC due')", "notify_all([], 'hi')"], "setup": ""}]}, {"n": 27, "week": 4, "track": "pd", "title": "pandas merge: joins", "learn": "<pre class=\"code\" data-lang=\"python\"><code>pd.merge(accounts, customers, on=&quot;customer_id&quot;, how=&quot;inner&quot;)    # INNER JOIN\naccounts.merge(branches, on=&quot;branch_id&quot;, how=&quot;left&quot;)            # LEFT JOIN\ndf.merge(other, left_on=&quot;cust&quot;, right_on=&quot;customer_id&quot;)         # different key names\nm = customers.merge(accounts, on=&quot;customer_id&quot;, how=&quot;left&quot;, indicator=True)\nm[m[&quot;_merge&quot;] == &quot;left_only&quot;]                                    # anti-join: no match\npd.concat([df1, df2], ignore_index=True)                         # UNION ALL<\/code><\/pre>\n<p>⚠️ Watch out for <strong>row explosion<\/strong>. Merging on a key that isn't unique on either side multiplies rows, exactly like a SQL join. Check <code>len()<\/code> before and after.<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Customer balances", "task": "<p>Write <code>customer_balances(customers, accounts)<\/code> returning <code>customer_id, name, total_balance<\/code> for customers <strong>with<\/strong> accounts, sorted by total_balance descending, index reset.<\/p>", "hint": "Merge, then groupby both customer_id and name (two customers share a name!), then sort.", "solution": "def customer_balances(customers, accounts):\n    m = customers.merge(accounts, on=\"customer_id\", how=\"inner\")\n    out = m.groupby([\"customer_id\", \"name\"], as_index=False).agg(total_balance=(\"balance\", \"sum\"))\n    return out.sort_values(\"total_balance\", ascending=False).reset_index(drop=True)", "starter": "def customer_balances(customers, accounts):\n    pass", "tests": ["customer_balances(customers.copy(), accounts.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Customers without accounts", "task": "<p>Write <code>no_accounts(customers, accounts)<\/code> returning a <strong>sorted list of customer_ids<\/strong> that have no account (use <code>indicator=True<\/code>).<\/p>", "hint": "Left merge with indicator=True, then keep the rows where _merge == 'left_only'.", "solution": "def no_accounts(customers, accounts):\n    m = customers.merge(accounts[[\"customer_id\"]].drop_duplicates(), on=\"customer_id\", how=\"left\", indicator=True)\n    return sorted(m.loc[m[\"_merge\"] == \"left_only\", \"customer_id\"].tolist())", "starter": "def no_accounts(customers, accounts):\n    pass", "tests": ["no_accounts(customers.copy(), accounts.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 28, "week": 4, "track": "sql", "title": "SQL: subqueries & CTEs", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>CTEs (<code>WITH name AS (...)<\/code>) are named steps, which makes a query read like a pipeline. They're the SQL equivalent of a pandas method chain, or of separate Python variables.<\/p>\n<pre class=\"code\" data-lang=\"sql\"><code>WITH per_customer AS (\n    SELECT customer_id, SUM(balance) AS total FROM accounts GROUP BY customer_id\n)\nSELECT * FROM per_customer WHERE total &gt; (SELECT AVG(total) FROM per_customer);<\/code><\/pre>", "stretch": null, "problems": [{"kind": "sql", "title": "Above-average customers", "task": "<p>Customers whose <strong>total balance<\/strong> is above the average of all customers' totals: <code>name, total_balance<\/code>, <strong>ordered by<\/strong> total_balance descending.<\/p>", "hint": "First a CTE of totals per customer, then compare each total with a scalar subquery AVG.", "solution": "WITH per_customer AS (\n    SELECT c.customer_id, c.name, SUM(a.balance) AS total_balance\n    FROM customers c JOIN accounts a ON a.customer_id = c.customer_id\n    GROUP BY c.customer_id, c.name\n)\nSELECT name, total_balance\nFROM per_customer\nWHERE total_balance > (SELECT AVG(total_balance) FROM per_customer)\nORDER BY total_balance DESC;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Largest account per branch", "task": "<p>For each branch: <code>city, account_id, balance<\/code> of its largest account, <strong>ordered by<\/strong> city.<\/p>", "hint": "A CTE of MAX(balance) per branch, joined back on branch and balance. (Next week you'll do this with ROW_NUMBER.)", "solution": "WITH mx AS (SELECT branch_id, MAX(balance) AS max_bal FROM accounts GROUP BY branch_id)\nSELECT b.city, a.account_id, a.balance\nFROM accounts a\nJOIN mx ON mx.branch_id = a.branch_id AND mx.max_bal = a.balance\nJOIN branches b ON b.branch_id = a.branch_id\nORDER BY b.city;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Debit share per channel", "task": "<p>For each channel: <code>channel, debit_pct<\/code>, the % of its transactions that are DEBIT, rounded to 1, <strong>ordered by<\/strong> debit_pct descending.<\/p>", "hint": "Use 100.0 (not 100) to avoid integer division.", "solution": "SELECT channel,\n       ROUND(100.0 * SUM(CASE WHEN txn_type = 'DEBIT' THEN 1 ELSE 0 END) / COUNT(*), 1) AS debit_pct\nFROM transactions\nGROUP BY channel\nORDER BY debit_pct DESC;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 29, "week": 5, "track": "py", "title": "Dunder (magic) methods", "learn": "<p>Double-underscore methods let your objects work with Python's built-in operators and functions.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class Vector:\n    def __init__(self, x, y): self.x, self.y = x, y\n    def __repr__(self):  return f&quot;Vector({self.x}, {self.y})&quot;   # for developers\n    def __str__(self):   return f&quot;&lt;{self.x}, {self.y}&gt;&quot;         # for print()\n    def __add__(self, other): return Vector(self.x + other.x, self.y + other.y)\n    def __eq__(self, other):  return (self.x, self.y) == (other.x, other.y)\n    def __len__(self):   return 2\n\nVector(1, 2) + Vector(3, 4)   # Vector(4, 6)<\/code><\/pre>\n<p>Others you'll meet: <code>__lt__<\/code> (makes <code>&lt;<\/code> and sorting work), <code>__contains__<\/code> (<code>in<\/code>), <code>__getitem__<\/code> (<code>obj[i]<\/code>), <code>__iter__<\/code> (<code>for x in obj<\/code>).<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Money", "task": "<p>Create <code>Money(amount, currency=&#x27;INR&#x27;)<\/code>:<\/p>\n<ul><li><code>str(m)<\/code> → <code>&quot;INR 150.00&quot;<\/code> (2 decimals)<\/li><li><code>m1 + m2<\/code> → a new Money; raise <code>ValueError<\/code> if the currencies differ<\/li><li><code>m1 == m2<\/code> → True if amount and currency both match<\/li><\/ul>", "hint": "__str__ uses f'{self.currency} {self.amount:.2f}'. __add__ checks the currency, then returns Money(sum, currency).", "solution": "class Money:\n    def __init__(self, amount, currency=\"INR\"):\n        self.amount = amount\n        self.currency = currency\n\n    def __str__(self):\n        return f\"{self.currency} {self.amount:.2f}\"\n\n    def __repr__(self):\n        return f\"Money({self.amount!r}, {self.currency!r})\"\n\n    def __add__(self, other):\n        if self.currency != other.currency:\n            raise ValueError(\"currency mismatch\")\n        return Money(self.amount + other.amount, self.currency)\n\n    def __eq__(self, other):\n        return self.amount == other.amount and self.currency == other.currency", "starter": "class Money:\n    def __init__(self, amount, currency=\"INR\"):\n        self.amount = amount\n        self.currency = currency", "tests": ["str(Money(150))", "str(Money(150) + Money(25.5))", "Money(10) == Money(10)", "Money(10, 'USD') == Money(10)", "_raises(lambda: Money(1, 'USD') + Money(1), ValueError)", "str(Money(3, 'USD') + Money(4, 'USD'))"], "setup": ""}, {"kind": "py", "title": "Playlist", "task": "<p>Create <code>Playlist(name)<\/code> with <code>add(song)<\/code>, and make it support <code>len(p)<\/code>, <code>song in p<\/code> and <code>p[0]<\/code>.<\/p>", "hint": "Keep a list in self.songs and have each dunder method pass the work on to that list.", "solution": "class Playlist:\n    def __init__(self, name):\n        self.name = name\n        self.songs = []\n\n    def add(self, song):\n        self.songs.append(song)\n\n    def __len__(self):\n        return len(self.songs)\n\n    def __contains__(self, song):\n        return song in self.songs\n\n    def __getitem__(self, i):\n        return self.songs[i]", "starter": "class Playlist:\n    pass", "tests": ["(lambda p: (p.add('Naatu Naatu'), p.add('Jai Ho'), len(p))[2])(Playlist('mix'))", "(lambda p: (p.add('Jai Ho'), 'Jai Ho' in p, 'Kesariya' in p)[1:])(Playlist('mix'))", "(lambda p: (p.add('a'), p.add('b'), p[1], p[-1])[2:])(Playlist('mix'))", "len(Playlist('empty'))"], "setup": ""}]}, {"n": 30, "week": 5, "track": "py", "title": "Encapsulation with @property", "learn": "<p><code>@property<\/code> lets a method be read like an attribute, so you can validate or compute values behind the scenes.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class Account:\n    def __init__(self, balance):\n        self.balance = balance          # this goes through the setter below\n\n    @property\n    def balance(self):\n        return self._balance            # &#x27;_&#x27; = &quot;internal, please don&#x27;t touch&quot;\n\n    @balance.setter\n    def balance(self, value):\n        if value &lt; 0:\n            raise ValueError(&quot;negative balance&quot;)\n        self._balance = value\n\n    @property\n    def is_premium(self):               # computed, read-only\n        return self._balance &gt; 200000\n\na = Account(500)\na.balance = 1000      # calls the setter\na.is_premium          # no () needed<\/code><\/pre>", "stretch": null, "problems": [{"kind": "py", "title": "Person with a validated age", "task": "<p>Create <code>Person(name, age)<\/code> where <code>age<\/code> is a property. Its setter raises <code>ValueError<\/code> if the value isn't an <code>int<\/code> or is negative.<\/p>", "hint": "In __init__ write <code>self.age = age<\/code> so the setter runs. The setter stores the value in self._age.", "solution": "class Person:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    @property\n    def age(self):\n        return self._age\n\n    @age.setter\n    def age(self, value):\n        if not isinstance(value, int) or value < 0:\n            raise ValueError(\"invalid age\")\n        self._age = value", "starter": "class Person:\n    pass", "tests": ["Person('R', 30).age", "_raises(lambda: Person('R', -1), ValueError)", "_raises(lambda: Person('R', 'thirty'), ValueError)", "(lambda p: (setattr(p, 'age', 31), p.age)[1])(Person('R', 30))", "(lambda p: _raises(lambda: setattr(p, 'age', -5), ValueError))(Person('R', 30))"], "setup": ""}, {"kind": "py", "title": "Circle properties", "task": "<p>Create <code>Circle(radius)<\/code>:<\/p>\n<ul><li><code>radius<\/code> property: setter raises <code>ValueError<\/code> unless &gt; 0<\/li><li><code>area<\/code>: read-only property → <code>round(math.pi * r**2, 2)<\/code><\/li><li><code>diameter<\/code>: property with a setter that updates the radius<\/li><\/ul>", "hint": "A property without a setter is read-only, so assigning to it raises AttributeError automatically.", "solution": "import math\n\nclass Circle:\n    def __init__(self, radius):\n        self.radius = radius\n\n    @property\n    def radius(self):\n        return self._radius\n\n    @radius.setter\n    def radius(self, value):\n        if value <= 0:\n            raise ValueError(\"radius must be positive\")\n        self._radius = value\n\n    @property\n    def area(self):\n        return round(math.pi * self._radius ** 2, 2)\n\n    @property\n    def diameter(self):\n        return self._radius * 2\n\n    @diameter.setter\n    def diameter(self, value):\n        self.radius = value / 2", "starter": "import math\n\nclass Circle:\n    pass", "tests": ["Circle(1).area", "Circle(3).diameter", "(lambda c: (setattr(c, 'diameter', 10), c.radius)[1])(Circle(1))", "_raises(lambda: Circle(0), ValueError)", "_raises(lambda: setattr(Circle(1), 'area', 5), AttributeError)"], "setup": ""}]}, {"n": 31, "week": 5, "track": "py", "title": "Abstract base classes: designing interfaces", "learn": "<p>An <strong>abstract base class<\/strong> (ABC) defines a contract: \"every subclass <strong>must<\/strong> implement these methods\". You can't create an ABC directly.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from abc import ABC, abstractmethod\n\nclass Report(ABC):\n    @abstractmethod\n    def rows(self):\n        ...\n\n    def render(self):                     # concrete method using the abstract one\n        return &quot;\\n&quot;.join(str(r) for r in self.rows())\n\nclass KycReport(Report):\n    def rows(self):\n        return [(&quot;pending&quot;, 12), (&quot;done&quot;, 88)]\n\nKycReport().render()    # works\nReport()                # TypeError: can&#x27;t instantiate abstract class<\/code><\/pre>\n<p>This is the <strong>template method<\/strong> pattern. The parent defines the overall flow and the children fill in the steps.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Shapes contract", "task": "<p>Create abstract <code>Shape(ABC)<\/code> with abstract methods <code>area()<\/code> and <code>perimeter()<\/code>, and a concrete <code>describe()<\/code> returning <code>f&quot;{ClassName} area={area} perimeter={perimeter}&quot;<\/code>. Implement <code>Square(side)<\/code> and <code>Rect(w, h)<\/code>. (Tip: <code>type(self).__name__<\/code> gives the class name.)<\/p>", "hint": "Decorate area and perimeter with @abstractmethod in Shape. describe() calls self.area() and self.perimeter().", "solution": "from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    @abstractmethod\n    def area(self): ...\n\n    @abstractmethod\n    def perimeter(self): ...\n\n    def describe(self):\n        return f\"{type(self).__name__} area={self.area()} perimeter={self.perimeter()}\"\n\nclass Square(Shape):\n    def __init__(self, side):\n        self.side = side\n    def area(self):\n        return self.side ** 2\n    def perimeter(self):\n        return 4 * self.side\n\nclass Rect(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n    def perimeter(self):\n        return 2 * (self.w + self.h)", "starter": "from abc import ABC, abstractmethod\n\nclass Shape(ABC):\n    pass\n\nclass Square(Shape):\n    pass\n\nclass Rect(Shape):\n    pass", "tests": ["_raises(lambda: Shape(), TypeError)", "Square(3).describe()", "Rect(2, 5).describe()", "isinstance(Rect(1, 1), Shape)"], "setup": ""}, {"kind": "py", "title": "Payment methods", "task": "<p>Create abstract <code>PaymentMethod<\/code> with abstract <code>fee(amount)<\/code> and concrete <code>pay(amount)<\/code> returning <code>round(amount + fee(amount), 2)<\/code>.<\/p>\n<ul><li><code>UPI<\/code>: fee 0<\/li><li><code>Card<\/code>: fee 2% of amount<\/li><li><code>NetBanking<\/code>: flat fee 10<\/li><\/ul>", "hint": "pay() is written once in the parent. Each child only defines fee().", "solution": "from abc import ABC, abstractmethod\n\nclass PaymentMethod(ABC):\n    @abstractmethod\n    def fee(self, amount): ...\n\n    def pay(self, amount):\n        return round(amount + self.fee(amount), 2)\n\nclass UPI(PaymentMethod):\n    def fee(self, amount):\n        return 0\n\nclass Card(PaymentMethod):\n    def fee(self, amount):\n        return amount * 0.02\n\nclass NetBanking(PaymentMethod):\n    def fee(self, amount):\n        return 10", "starter": "from abc import ABC, abstractmethod\n\nclass PaymentMethod(ABC):\n    pass", "tests": ["UPI().pay(500)", "Card().pay(500)", "NetBanking().pay(500)", "[m.pay(1000) for m in [UPI(), Card(), NetBanking()]]", "_raises(lambda: PaymentMethod(), TypeError)"], "setup": ""}]}, {"n": 32, "week": 5, "track": "py", "title": "Dataclasses & composition", "learn": "<p><code>@dataclass<\/code> writes <code>__init__<\/code>, <code>__repr__<\/code> and <code>__eq__<\/code> for you, which is perfect for classes that mostly hold data.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from dataclasses import dataclass, field\n\n@dataclass\nclass Txn:\n    account_id: int\n    amount: float\n    kind: str = &quot;CREDIT&quot;                # default value\n\n@dataclass\nclass Statement:\n    txns: list = field(default_factory=list)   # safe mutable default\n    def total(self):\n        return sum(t.amount for t in self.txns)\n\n@dataclass(frozen=True)                 # immutable: you can&#x27;t assign to fields\nclass Point:\n    x: float\n    y: float<\/code><\/pre>\n<p><strong>Composition<\/strong> (\"has-a\") means an object is built from other objects, like a Statement <em>has<\/em> Txns. Prefer it to inheritance when there is no real \"is-a\" relationship.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Order with items", "task": "<p>Create <code>@dataclass Item(name, price, qty=1)<\/code> with a property <code>total<\/code> (= price × qty). Create <code>@dataclass Order<\/code> with <code>items<\/code> (empty list by default), <code>add(item)<\/code>, <code>total()<\/code> and <code>most_expensive()<\/code> (the <strong>name<\/strong> of the item with the highest total, or <code>None<\/code> if empty).<\/p>", "hint": "Use <code>items: list = field(default_factory=list)<\/code>. most_expensive uses <code>max(self.items, key=lambda i: i.total)<\/code>.", "solution": "from dataclasses import dataclass, field\n\n@dataclass\nclass Item:\n    name: str\n    price: float\n    qty: int = 1\n\n    @property\n    def total(self):\n        return self.price * self.qty\n\n@dataclass\nclass Order:\n    items: list = field(default_factory=list)\n\n    def add(self, item):\n        self.items.append(item)\n\n    def total(self):\n        return sum(i.total for i in self.items)\n\n    def most_expensive(self):\n        if not self.items:\n            return None\n        return max(self.items, key=lambda i: i.total).name", "starter": "from dataclasses import dataclass, field\n\n@dataclass\nclass Item:\n    pass\n\n@dataclass\nclass Order:\n    pass", "tests": ["Item('pen', 10, 3).total", "Item('pen', 10) == Item('pen', 10)", "(lambda o: (o.add(Item('pen', 10, 3)), o.add(Item('book', 250)), o.total(), o.most_expensive())[2:])(Order())", "Order().most_expensive()", "len(Order().items) == 0 and Order().items is not Order().items"], "setup": ""}, {"kind": "py", "title": "Frozen point", "task": "<p>Create <code>@dataclass(frozen=True) Point(x, y)<\/code> with <code>distance_to(other)<\/code> returning the Euclidean distance rounded to 2.<\/p>", "hint": "<code>math.hypot(dx, dy)<\/code> computes sqrt(dx² + dy²). Frozen dataclasses can be hashed, so they work in sets.", "solution": "from dataclasses import dataclass\nimport math\n\n@dataclass(frozen=True)\nclass Point:\n    x: float\n    y: float\n\n    def distance_to(self, other):\n        return round(math.hypot(self.x - other.x, self.y - other.y), 2)", "starter": "from dataclasses import dataclass\nimport math", "tests": ["Point(0, 0).distance_to(Point(3, 4))", "Point(1, 1).distance_to(Point(2, 3))", "_raises(lambda: setattr(Point(1, 2), 'x', 5), AttributeError)", "Point(1, 2) == Point(1, 2)", "len({Point(1, 2), Point(1, 2)})"], "setup": ""}]}, {"n": 33, "week": 5, "track": "py", "title": "OOP project: a library system", "learn": "<p>Today is design practice. Before you code, sketch it out:<\/p>\n<ul><li><strong>Book<\/strong>: title, author, isbn, <code>available<\/code> (True/False)<\/li><li><strong>Member<\/strong>: name, <code>max_books<\/code> (default 2), the books they've borrowed<\/li><li><strong>Library<\/strong>: stores books by isbn and members by name, and enforces the rules<\/li><\/ul>\n<p>Ask yourself: <em>which object owns which data? Which object enforces which rule?<\/em> Here the Library is the coordinator. It checks the rules before it changes any Book or Member.<\/p>\n<p>Rules to enforce:<\/p>\n<ol><li>You can't check out a book that's already out, or one that doesn't exist.<\/li><li>A member can't go over their <code>max_books<\/code>.<\/li><li>Returning a book makes it available again and removes it from the member's list.<\/li><\/ol>", "stretch": "Add due dates: checkout stores <code>date.today() + timedelta(days=14)<\/code> and <code>overdue(today)<\/code> returns the titles that are past due.", "problems": [{"kind": "py", "title": "Library", "task": "<p>Implement <code>Book(title, author, isbn)<\/code>, <code>Member(name, max_books=2)<\/code> and <code>Library<\/code> with:<\/p>\n<ul><li><code>add_book(book)<\/code>, <code>add_member(member)<\/code><\/li><li><code>checkout(isbn, member_name)<\/code>: raises <code>ValueError<\/code> if the book is missing or unavailable, or the member is at their limit<\/li><li><code>return_book(isbn)<\/code><\/li><li><code>available_titles()<\/code> → sorted list of titles that are currently available<\/li><\/ul>\n<p>The tests use a helper <code>_lib()<\/code> that builds a library with 3 books and members <code>Rishitha<\/code> (max 2) and <code>Pranay<\/code> (max 1).<\/p>", "hint": "Give Library dicts books[isbn] and members[name], plus loans[isbn] = member name so return_book knows who to update.", "solution": "class Book:\n    def __init__(self, title, author, isbn):\n        self.title, self.author, self.isbn = title, author, isbn\n        self.available = True\n\nclass Member:\n    def __init__(self, name, max_books=2):\n        self.name = name\n        self.max_books = max_books\n        self.borrowed = []\n\nclass Library:\n    def __init__(self):\n        self.books = {}\n        self.members = {}\n        self.loans = {}          # isbn -> member name\n\n    def add_book(self, book):\n        self.books[book.isbn] = book\n\n    def add_member(self, member):\n        self.members[member.name] = member\n\n    def checkout(self, isbn, member_name):\n        book = self.books.get(isbn)\n        member = self.members.get(member_name)\n        if book is None or member is None or not book.available:\n            raise ValueError(\"book not available\")\n        if len(member.borrowed) >= member.max_books:\n            raise ValueError(\"borrow limit reached\")\n        book.available = False\n        member.borrowed.append(isbn)\n        self.loans[isbn] = member_name\n\n    def return_book(self, isbn):\n        name = self.loans.pop(isbn, None)\n        if name is None:\n            return\n        self.books[isbn].available = True\n        self.members[name].borrowed.remove(isbn)\n\n    def available_titles(self):\n        return sorted(b.title for b in self.books.values() if b.available)", "starter": "class Book:\n    pass\n\nclass Member:\n    pass\n\nclass Library:\n    pass", "tests": ["_lib().available_titles()", "(lambda l: (l.checkout('111', 'Rishitha'), l.available_titles())[1])(_lib())", "(lambda l: (l.checkout('111', 'Rishitha'), _raises(lambda: l.checkout('111', 'Pranay'), ValueError))[1])(_lib())", "(lambda l: (l.checkout('111', 'Pranay'), _raises(lambda: l.checkout('222', 'Pranay'), ValueError))[1])(_lib())", "(lambda l: (l.checkout('111', 'Rishitha'), l.return_book('111'), l.available_titles())[2])(_lib())", "(lambda l: (l.checkout('111', 'Pranay'), l.return_book('111'), l.checkout('222', 'Pranay'), l.available_titles())[3])(_lib())", "_raises(lambda: _lib().checkout('999', 'Rishitha'), ValueError)"], "setup": "def _lib():\n    lib = Library()\n    for t, a, i in [('Clean Code', 'Robert Martin', '111'), ('Python Crash Course', 'Eric Matthes', '222'),\n                    ('Designing Data-Intensive Applications', 'Martin Kleppmann', '333')]:\n        lib.add_book(Book(t, a, i))\n    lib.add_member(Member('Rishitha'))\n    lib.add_member(Member('Pranay', max_books=1))\n    return lib"}]}, {"n": 34, "week": 5, "track": "pd", "title": "Cleaning messy data", "learn": "<p>Real data is messy. A typical cleanup toolkit:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>df.isna().sum()                         # missing values per column\ndf[&quot;city&quot;] = df[&quot;city&quot;].fillna(&quot;Unknown&quot;)\ndf.dropna(subset=[&quot;name&quot;])\ndf[&quot;name&quot;] = df[&quot;name&quot;].str.strip().str.title()      # .str gives string methods on a whole column\ndf[&quot;amt&quot;] = pd.to_numeric(df[&quot;amt&quot;].str.replace(&quot;,&quot;, &quot;&quot;), errors=&quot;coerce&quot;)   # bad values → NaN\ndf[&quot;d&quot;] = pd.to_datetime(df[&quot;d&quot;], errors=&quot;coerce&quot;)   # bad dates → NaT\ndf[&quot;d&quot;].dt.year, df[&quot;d&quot;].dt.month, df[&quot;d&quot;].dt.day_name()\ndf.drop_duplicates(subset=[&quot;name&quot;, &quot;city&quot;])\ndf.astype({&quot;qty&quot;: &quot;int64&quot;})<\/code><\/pre>\n<p>The problems use a messy <code>raw<\/code> DataFrame. <code>print(raw)<\/code> to look at it first. Indian number formats like <code>4,10,000<\/code> are in there!<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Clean text columns", "task": "<p>Write <code>clean_text(df)<\/code>: strip and title-case <code>name<\/code> and <code>city<\/code>, then fill missing values in both with <code>&#x27;Unknown&#x27;<\/code>. Return df.<\/p>", "hint": "Chain .str.strip().str.title() and then .fillna('Unknown'). Missing values stay missing through .str methods.", "solution": "def clean_text(df):\n    for col in [\"name\", \"city\"]:\n        df[col] = df[col].str.strip().str.title().fillna(\"Unknown\")\n    return df", "starter": "def clean_text(df):\n    pass", "tests": ["clean_text(raw.copy())[['name', 'city']]"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nraw = pd.DataFrame({\n    'name': ['  ananya rao', 'VIKRAM SHAH ', 'meera iyer', None, 'arjun reddy'],\n    'city': ['Hyderabad', None, 'chennai', 'Pune', 'hyderabad '],\n    'join_date': ['2023-02-14', '2022-07-01', '2024-01-20', '2024-06-30', 'not known'],\n    'balance': ['52,000', '4,10,000', '23000', '', '98000']})"}, {"kind": "pd", "title": "Clean numbers & dates", "task": "<p>Write <code>clean_numbers(df)<\/code>: convert <code>balance<\/code> to float (remove commas; blanks or bad values → 0.0) and <code>join_date<\/code> to datetime (bad → NaT). Return df.<\/p>", "hint": "pd.to_numeric(..., errors='coerce') turns '' into NaN, and then .fillna(0.0).", "solution": "def clean_numbers(df):\n    df[\"balance\"] = pd.to_numeric(df[\"balance\"].str.replace(\",\", \"\"), errors=\"coerce\").fillna(0.0)\n    df[\"join_date\"] = pd.to_datetime(df[\"join_date\"], errors=\"coerce\")\n    return df", "starter": "def clean_numbers(df):\n    pass", "tests": ["clean_numbers(raw.copy())['balance']", "clean_numbers(raw.copy())['join_date'].isna().tolist()", "clean_numbers(raw.copy())['join_date'].dt.year.tolist()[:4]"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nraw = pd.DataFrame({\n    'name': ['  ananya rao', 'VIKRAM SHAH ', 'meera iyer', None, 'arjun reddy'],\n    'city': ['Hyderabad', None, 'chennai', 'Pune', 'hyderabad '],\n    'join_date': ['2023-02-14', '2022-07-01', '2024-01-20', '2024-06-30', 'not known'],\n    'balance': ['52,000', '4,10,000', '23000', '', '98000']})"}]}, {"n": 35, "week": 5, "track": "sql", "title": "SQL window functions 1: ranking", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<pre class=\"code\" data-lang=\"sql\"><code>ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY amount DESC, txn_id)   -- 1,2,3,4 (unique)\nRANK()       OVER (ORDER BY total DESC)    -- 1,2,2,4 (gaps after ties)\nDENSE_RANK() OVER (ORDER BY total DESC)    -- 1,2,2,3 (no gaps)\nAVG(amount)  OVER (PARTITION BY account_id)  -- group value on every row<\/code><\/pre>\n<p>Window functions keep every row, while GROUP BY collapses them. To filter on a window result, wrap it in a CTE or subquery, because you can't use it in WHERE directly.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Top-2 transactions per account", "task": "<p>For every account, its 2 largest transactions (ties: smaller txn_id first): <code>account_id, txn_id, amount, rn<\/code>, <strong>ordered by<\/strong> account_id, rn.<\/p>", "hint": "ROW_NUMBER partitioned by account_id inside a CTE, then WHERE rn &lt;= 2.", "solution": "WITH ranked AS (\n    SELECT account_id, txn_id, amount,\n           ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY amount DESC, txn_id) AS rn\n    FROM transactions\n)\nSELECT account_id, txn_id, amount, rn FROM ranked WHERE rn <= 2\nORDER BY account_id, rn;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Rank branches", "task": "<p><code>city, total_balance, rnk<\/code> where rnk is the DENSE_RANK by total balance (highest = 1), <strong>ordered by<\/strong> rnk, city.<\/p>", "hint": "You can window over an aggregate: DENSE_RANK() OVER (ORDER BY SUM(...) DESC).", "solution": "SELECT b.city, SUM(a.balance) AS total_balance,\n       DENSE_RANK() OVER (ORDER BY SUM(a.balance) DESC) AS rnk\nFROM accounts a JOIN branches b ON b.branch_id = a.branch_id\nGROUP BY b.city\nORDER BY rnk, b.city;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Versus the account average", "task": "<p>For account <strong>101<\/strong> only: <code>txn_id, amount, acct_avg<\/code> (that account's average amount, rounded 2) and <code>diff<\/code> (amount − avg, rounded 2), <strong>ordered by<\/strong> txn_id.<\/p>", "hint": "After the WHERE, AVG(amount) OVER () covers the whole filtered set.", "solution": "SELECT txn_id, amount,\n       ROUND(AVG(amount) OVER (), 2) AS acct_avg,\n       ROUND(amount - AVG(amount) OVER (), 2) AS diff\nFROM transactions\nWHERE account_id = 101\nORDER BY txn_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 36, "week": 6, "track": "py", "title": "Iterators & generators", "learn": "<p>A <strong>generator<\/strong> produces values lazily, one at a time, using <code>yield<\/code>. It's ideal for huge or endless sequences, like streaming 10 million rows without loading them all into memory.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def countdown(n):\n    while n &gt; 0:\n        yield n          # pause here and hand back n\n        n -= 1\n\ng = countdown(3)\nnext(g)        # 3\nlist(g)        # [2, 1]   (it carries on from where it paused)\n\nsquares = (x * x for x in range(10**9))   # generator expression: no memory blow-up<\/code><\/pre>\n<div class=\"bridge\">Data-engineering bridge: reading a file line by line (<code>for line in f<\/code>) and fetching from a DB cursor in batches both work this way.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Fibonacci generator", "task": "<p>Write a generator <code>fib_gen(n)<\/code> that yields the first <code>n<\/code> Fibonacci numbers: 0, 1, 1, 2, 3, 5, …<\/p>", "hint": "Keep a, b = 0, 1. In a loop that runs n times: yield a, then a, b = b, a + b.", "solution": "def fib_gen(n):\n    a, b = 0, 1\n    for _ in range(n):\n        yield a\n        a, b = b, a + b", "starter": "def fib_gen(n):\n    pass", "tests": ["list(fib_gen(7))", "list(fib_gen(0))", "list(fib_gen(1))", "hasattr(fib_gen(3), '__next__')"], "setup": ""}, {"kind": "py", "title": "Chunked", "task": "<p>Write a generator <code>chunked(items, size)<\/code> yielding consecutive lists of length <code>size<\/code> (the last one may be shorter).<\/p>", "hint": "<code>range(0, len(items), size)<\/code> steps through the start positions. Yield the slice items[i:i+size].", "solution": "def chunked(items, size):\n    for i in range(0, len(items), size):\n        yield items[i:i + size]", "starter": "def chunked(items, size):\n    pass", "tests": ["list(chunked([1, 2, 3, 4, 5], 2))", "list(chunked([], 3))", "list(chunked(list(range(6)), 3))", "hasattr(chunked([1], 1), '__next__')"], "setup": ""}]}, {"n": 37, "week": 6, "track": "py", "title": "Functional tools: zip, enumerate, map, filter, any/all, reduce", "learn": "<pre class=\"code\" data-lang=\"python\"><code>names, scores = [&quot;a&quot;, &quot;b&quot;], [90, 80]\nlist(zip(names, scores))          # [(&#x27;a&#x27;, 90), (&#x27;b&#x27;, 80)]\ndict(zip(names, scores))          # {&#x27;a&#x27;: 90, &#x27;b&#x27;: 80}\nfor i, n in enumerate(names, start=1): ...\n\nlist(map(str.upper, names))       # [&#x27;A&#x27;, &#x27;B&#x27;]\nlist(filter(lambda x: x &gt; 85, scores))   # [90]\nany(s &gt; 85 for s in scores)       # True: at least one\nall(s &gt; 85 for s in scores)       # False: every one?\n\nfrom functools import reduce\nreduce(lambda acc, x: acc * x, [1, 2, 3, 4], 1)   # 24<\/code><\/pre>\n<p>In everyday Python, comprehensions are usually clearer than <code>map<\/code> and <code>filter<\/code>. Still learn both, because you'll read both.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Pair names and scores", "task": "<p>Write <code>pair_scores(names, scores)<\/code> returning a dict name → score, using <code>zip<\/code>.<\/p>", "hint": "<code>dict(zip(names, scores))<\/code>", "solution": "def pair_scores(names, scores):\n    return dict(zip(names, scores))", "starter": "def pair_scores(names, scores):\n    pass", "tests": ["pair_scores(['a', 'b'], [90, 80])", "pair_scores([], [])", "pair_scores(['x', 'y', 'z'], [1, 2])"], "setup": ""}, {"kind": "py", "title": "Product with reduce", "task": "<p>Write <code>product(nums)<\/code> using <code>functools.reduce<\/code>. Return 1 for an empty list.<\/p>", "hint": "The third argument to reduce, 1, is the starting value. It is also what you get back for an empty list.", "solution": "from functools import reduce\n\ndef product(nums):\n    return reduce(lambda acc, x: acc * x, nums, 1)", "starter": "from functools import reduce\n\ndef product(nums):\n    pass", "tests": ["product([1, 2, 3, 4])", "product([])", "product([5])", "product([2, -3])"], "setup": ""}, {"kind": "py", "title": "Valid PINs", "task": "<p>Write <code>all_valid_pins(pins)<\/code> → True if <strong>every<\/strong> pin is exactly 4 digits.<\/p>", "hint": "<code>all(... for p in pins)<\/code>. Note that all([]) is True.", "solution": "def all_valid_pins(pins):\n    return all(len(p) == 4 and p.isdigit() for p in pins)", "starter": "def all_valid_pins(pins):\n    pass", "tests": ["all_valid_pins(['1234', '0000'])", "all_valid_pins(['1234', '12a4'])", "all_valid_pins(['123'])", "all_valid_pins([])"], "setup": ""}]}, {"n": 38, "week": 6, "track": "py", "title": "Decorators", "learn": "<p>A decorator is a function that <strong>wraps<\/strong> another function to add behaviour (logging, timing, caching, retries) without changing the original.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>import functools\n\ndef log_calls(func):\n    @functools.wraps(func)            # keeps func&#x27;s name and docstring\n    def wrapper(*args, **kwargs):\n        print(f&quot;calling {func.__name__}&quot;)\n        return func(*args, **kwargs)\n    return wrapper\n\n@log_calls                            # same as: add = log_calls(add)\ndef add(a, b):\n    return a + b<\/code><\/pre>\n<p>The pattern is always the same: <strong>take a function → define a wrapper → return the wrapper.<\/strong> Functions are objects, so you can also attach attributes to them (<code>wrapper.calls = 0<\/code>).<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Count calls", "task": "<p>Write a decorator <code>count_calls<\/code> so the decorated function gets a <code>.calls<\/code> attribute that counts how many times it has been called.<\/p>", "hint": "Set <code>wrapper.calls = 0<\/code> after defining wrapper, and do <code>wrapper.calls += 1<\/code> inside it.", "solution": "import functools\n\ndef count_calls(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        wrapper.calls += 1\n        return func(*args, **kwargs)\n    wrapper.calls = 0\n    return wrapper", "starter": "import functools\n\ndef count_calls(func):\n    pass", "tests": ["(lambda f: (f(), f(), f(), f.calls)[3])(count_calls(lambda: 1))", "count_calls(lambda x: x * 2)(21)", "count_calls(lambda: 0).calls"], "setup": ""}, {"kind": "py", "title": "Uppercase result", "task": "<p>Write a decorator <code>uppercase<\/code> that turns the decorated function's string result into uppercase.<\/p>", "hint": "In the wrapper, call func and then <code>.upper()<\/code> the result.", "solution": "import functools\n\ndef uppercase(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        return func(*args, **kwargs).upper()\n    return wrapper", "starter": "import functools\n\ndef uppercase(func):\n    pass", "tests": ["uppercase(lambda n: f'hello {n}')('rishitha')", "uppercase(lambda: 'sql')()"], "setup": ""}]}, {"n": 39, "week": 6, "track": "py", "title": "Files & context managers", "learn": "<p><code>with<\/code> guarantees cleanup (closing a file, releasing a DB connection) <strong>even if an error happens<\/strong>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>with open(&quot;/tmp/report.txt&quot;, &quot;w&quot;) as f:     # &#x27;w&#x27; write, &#x27;a&#x27; append, &#x27;r&#x27; read\n    f.write(&quot;line one\\n&quot;)\n\nwith open(&quot;/tmp/report.txt&quot;) as f:\n    for line in f:                          # reads lazily, line by line\n        print(line.strip())<\/code><\/pre>\n<p>Make your own context manager with <code>__enter__<\/code> and <code>__exit__<\/code>:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class Section:\n    def __enter__(self):\n        print(&quot;start&quot;); return self       # this is what &#x27;as&#x27; gives you\n    def __exit__(self, exc_type, exc, tb):\n        print(&quot;end&quot;)                      # runs even on error<\/code><\/pre>\n<p>(This site runs Python in your browser, so <code>/tmp<\/code> is a pretend in-memory folder. That's fine for practice.)<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Save and count", "task": "<p>Write <code>save_and_count(path, lines)<\/code>: write each line plus <code>\\n<\/code> to the file, then read it back and return how many lines are <strong>non-empty<\/strong>.<\/p>", "hint": "Two <code>with open(...)<\/code> blocks: the first writes with 'w', the second reads. <code>line.strip()<\/code> is falsy for blank lines.", "solution": "def save_and_count(path, lines):\n    with open(path, \"w\") as f:\n        for line in lines:\n            f.write(line + \"\\n\")\n    count = 0\n    with open(path) as f:\n        for line in f:\n            if line.strip():\n                count += 1\n    return count", "starter": "def save_and_count(path, lines):\n    pass", "tests": ["save_and_count('/tmp/t1.txt', ['a', 'b', ''])", "save_and_count('/tmp/t2.txt', [])", "save_and_count('/tmp/t3.txt', ['x'] * 5)"], "setup": ""}, {"kind": "py", "title": "Timer context manager", "task": "<p>Write a class <code>Timer<\/code> usable as <code>with Timer() as t: ...<\/code>. After the block, <code>t.elapsed<\/code> holds the seconds taken (a float). Use <code>time.perf_counter()<\/code>.<\/p>", "hint": "__enter__ records the start time and returns self. __exit__ sets self.elapsed.", "solution": "import time\n\nclass Timer:\n    def __enter__(self):\n        self.start = time.perf_counter()\n        return self\n\n    def __exit__(self, exc_type, exc, tb):\n        self.elapsed = time.perf_counter() - self.start\n        return False", "starter": "import time\n\nclass Timer:\n    pass", "tests": ["_time_it()"], "setup": "def _time_it():\n    with Timer() as t:\n        sum(range(10000))\n    return isinstance(t.elapsed, float) and t.elapsed >= 0"}]}, {"n": 40, "week": 6, "track": "py", "title": "Recursion: functions that call themselves", "learn": "<p>A recursive function solves a problem by solving a <strong>smaller version of the same problem<\/strong>. It needs two parts:<\/p>\n<ol><li><strong>Base case<\/strong>: the simplest input, answered directly (this stops the recursion).<\/li><li><strong>Recursive case<\/strong>: shrink the problem and call yourself.<\/li><\/ol>\n<pre class=\"code\" data-lang=\"python\"><code>def countdown(n):\n    if n == 0:              # base case\n        return [0]\n    return [n] + countdown(n - 1)   # recursive case\n\ndef total(nums):\n    if not nums:\n        return 0\n    return nums[0] + total(nums[1:])<\/code><\/pre>\n<p>Picture a <strong>call stack<\/strong>: each call waits for the call below it to finish. If you forget the base case you get <code>RecursionError<\/code>. Recursion is the foundation for trees, backtracking and dynamic programming (weeks 9–12).<\/p>\n<p>Tip: paste small recursive functions into <a href=\"https://pythontutor.com\" target=\"_blank\" rel=\"noopener\">Python Tutor<\/a> to watch the stack grow and shrink.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Factorial", "task": "<p>Write a recursive <code>factorial(n)<\/code> (0! = 1).<\/p>", "hint": "Base case n &lt;= 1 → 1. Otherwise n * factorial(n - 1).", "solution": "def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)", "starter": "def factorial(n):\n    pass", "tests": ["factorial(0)", "factorial(1)", "factorial(5)", "factorial(10)"], "setup": ""}, {"kind": "py", "title": "Sum of digits", "task": "<p>Write a recursive <code>sum_digits(n)<\/code> for a non-negative int. <code>sum_digits(1234)<\/code> → 10.<\/p>", "hint": "n % 10 is the last digit and n // 10 drops it.", "solution": "def sum_digits(n):\n    if n < 10:\n        return n\n    return n % 10 + sum_digits(n // 10)", "starter": "def sum_digits(n):\n    pass", "tests": ["sum_digits(1234)", "sum_digits(0)", "sum_digits(9)", "sum_digits(99999)"], "setup": ""}, {"kind": "py", "title": "Flatten any depth", "task": "<p>Write <code>deep_flatten(items)<\/code>: <code>[1, [2, [3, 4]], 5]<\/code> → <code>[1, 2, 3, 4, 5]<\/code>, for any depth of nesting.<\/p>", "hint": "Loop over the items. If an item is a list, extend with deep_flatten(item); otherwise append it.", "solution": "def deep_flatten(items):\n    out = []\n    for x in items:\n        if isinstance(x, list):\n            out.extend(deep_flatten(x))\n        else:\n            out.append(x)\n    return out", "starter": "def deep_flatten(items):\n    pass", "tests": ["deep_flatten([1, [2, [3, 4]], 5])", "deep_flatten([])", "deep_flatten([[[[1]]]])", "deep_flatten([1, [], [2, []]])"], "setup": ""}]}, {"n": 41, "week": 6, "track": "pd", "title": "Pivot tables, cumsum & rolling windows", "learn": "<pre class=\"code\" data-lang=\"python\"><code>df[&quot;month&quot;] = df[&quot;txn_date&quot;].dt.strftime(&quot;%Y-%m&quot;)\ndf.pivot_table(index=&quot;month&quot;, columns=&quot;txn_type&quot;, values=&quot;amount&quot;,\n               aggfunc=&quot;sum&quot;, fill_value=0)          # a conditional-aggregation pivot in one line\n\ndf = df.sort_values([&quot;account_id&quot;, &quot;txn_date&quot;, &quot;txn_id&quot;])\ndf[&quot;running&quot;] = df.groupby(&quot;account_id&quot;)[&quot;amount&quot;].cumsum()      # SUM() OVER (PARTITION BY ... ORDER BY ...)\ndf[&quot;ma3&quot;] = df.groupby(&quot;account_id&quot;)[&quot;amount&quot;].transform(lambda s: s.rolling(3).mean())\ndf[&quot;prev&quot;] = df.groupby(&quot;account_id&quot;)[&quot;amount&quot;].shift(1)        # LAG()<\/code><\/pre>\n<p><code>transform<\/code> returns a result <strong>the same length as the input<\/strong> (like a window function). <code>agg<\/code> collapses each group to one row (like GROUP BY).<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Month × type pivot", "task": "<p>Write <code>month_pivot(df)<\/code> returning a pivot table: index = month string <code>&#x27;YYYY-MM&#x27;<\/code>, columns = txn_type, values = summed amount, missing → 0.<\/p>", "hint": "Make a 'month' column with .dt.strftime('%Y-%m') first, then call pivot_table.", "solution": "def month_pivot(df):\n    df[\"month\"] = df[\"txn_date\"].dt.strftime(\"%Y-%m\")\n    return df.pivot_table(index=\"month\", columns=\"txn_type\", values=\"amount\", aggfunc=\"sum\", fill_value=0)", "starter": "def month_pivot(df):\n    pass", "tests": ["month_pivot(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Running balance per account", "task": "<p>Write <code>running_balance(df)<\/code>: signed amount (CREDIT +, DEBIT −), cumulative per account ordered by <code>txn_date<\/code> then <code>txn_id<\/code>. Return columns <code>account_id, txn_id, txn_date, running<\/code>, sorted that way, index reset.<\/p>", "hint": "Sort first, then groupby('account_id')['signed'].cumsum().", "solution": "def running_balance(df):\n    df[\"signed\"] = np.where(df[\"txn_type\"] == \"CREDIT\", df[\"amount\"], -df[\"amount\"])\n    df = df.sort_values([\"account_id\", \"txn_date\", \"txn_id\"])\n    df[\"running\"] = df.groupby(\"account_id\")[\"signed\"].cumsum()\n    return df[[\"account_id\", \"txn_id\", \"txn_date\", \"running\"]].reset_index(drop=True)", "starter": "def running_balance(df):\n    pass", "tests": ["running_balance(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 42, "week": 6, "track": "sql", "title": "SQL window functions 2: running totals,
