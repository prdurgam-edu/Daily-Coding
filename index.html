LAG/LEAD", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<pre class=\"code\" data-lang=\"sql\"><code>SUM(x) OVER (PARTITION BY acct ORDER BY d, id)                         -- running total\nSUM(x) OVER (ORDER BY d ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)      -- moving 3-row sum\nLAG(d)  OVER (PARTITION BY acct ORDER BY d)                            -- previous row&#x27;s value\nLEAD(d) OVER (...)                                                     -- next row&#x27;s value<\/code><\/pre>\n<p>⚠️ With an <code>ORDER BY<\/code> and no frame clause, the default frame is <code>RANGE ... CURRENT ROW<\/code>, which <strong>includes ties<\/strong> (peer rows). Add a unique tiebreaker or say <code>ROWS<\/code>.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Running balance (account 105)", "task": "<p>For account 105: <code>txn_id, txn_date, signed<\/code> (+amount for CREDIT, −amount for DEBIT) and <code>running<\/code> (cumulative signed sum by date, then txn_id), <strong>ordered by<\/strong> txn_date, txn_id.<\/p>", "hint": "SUM(CASE ...) OVER (ORDER BY txn_date, txn_id).", "solution": "SELECT txn_id, txn_date,\n       CASE WHEN txn_type = 'CREDIT' THEN amount ELSE -amount END AS signed,\n       SUM(CASE WHEN txn_type = 'CREDIT' THEN amount ELSE -amount END)\n           OVER (ORDER BY txn_date, txn_id) AS running\nFROM transactions\nWHERE account_id = 105\nORDER BY txn_date, txn_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Days since previous transaction (account 110)", "task": "<p>For account 110: <code>txn_id, txn_date, prev_date, gap_days<\/code> (an integer, NULL for the first), <strong>ordered by<\/strong> txn_date, txn_id.<\/p>", "hint": "LAG(txn_date) gives the previous date. Take the julianday difference and CAST it to INTEGER.", "solution": "SELECT txn_id, txn_date,\n       LAG(txn_date) OVER (ORDER BY txn_date, txn_id) AS prev_date,\n       CAST(julianday(txn_date) - julianday(LAG(txn_date) OVER (ORDER BY txn_date, txn_id)) AS INTEGER) AS gap_days\nFROM transactions\nWHERE account_id = 110\nORDER BY txn_date, txn_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "3-transaction moving average (account 101)", "task": "<p>For account 101: <code>txn_id, txn_date, amount, ma3<\/code> (average of this and the previous 2 transactions by date, then txn_id, rounded 2), <strong>ordered by<\/strong> txn_date, txn_id.<\/p>", "hint": "Use ROWS BETWEEN 2 PRECEDING AND CURRENT ROW.", "solution": "SELECT txn_id, txn_date, amount,\n       ROUND(AVG(amount) OVER (ORDER BY txn_date, txn_id ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 2) AS ma3\nFROM transactions\nWHERE account_id = 101\nORDER BY txn_date, txn_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 43, "week": 7, "track": "py", "title": "Big-O & the hash-map trick", "learn": "<p><strong>Big-O<\/strong> describes how running time grows as the input size <em>n<\/em> grows:<\/p>\n<table class='mdt'><thead><tr><th>Big-O<\/th><th>Name<\/th><th>Example<\/th><\/tr><\/thead><tbody><tr><td>O(1)<\/td><td>constant<\/td><td>dict lookup, <code>list[i]<\/code><\/td><\/tr><tr><td>O(log n)<\/td><td>logarithmic<\/td><td>binary search<\/td><\/tr><tr><td>O(n)<\/td><td>linear<\/td><td>one loop<\/td><\/tr><tr><td>O(n log n)<\/td><td><\/td><td>sorting<\/td><\/tr><tr><td>O(n²)<\/td><td>quadratic<\/td><td>loop inside a loop<\/td><\/tr><\/tbody><\/table>\n<p>At n = 1,000,000, O(n) is about a million steps and O(n²) is about a <strong>trillion<\/strong>.<\/p>\n<p><strong>The #1 interview trick:<\/strong> replace the inner loop with a dict lookup.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code># O(n²): check every pair\nfor i in range(len(nums)):\n    for j in range(i + 1, len(nums)):\n        if nums[i] + nums[j] == target: ...\n\n# O(n): remember what you&#x27;ve seen\nseen = {}                       # value -&gt; index\nfor i, x in enumerate(nums):\n    if target - x in seen:      # O(1) lookup\n        ...\n    seen[x] = i<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: this is like a hash join instead of a nested-loop join.<\/div>", "stretch": "LeetCode 121 <em>Best Time to Buy and Sell Stock<\/em>: one pass, tracking the minimum price seen so far.", "problems": [{"kind": "py", "title": "Two Sum", "task": "<p>Given <code>nums<\/code> and <code>target<\/code>, return <code>[i, j]<\/code> (with i &lt; j) such that <code>nums[i] + nums[j] == target<\/code>. Exactly one answer exists. Aim for <strong>O(n)<\/strong>.<\/p>", "hint": "For each x, the partner you need is target - x. Check whether it's already in <code>seen<\/code> BEFORE adding x.", "solution": "def two_sum(nums, target):\n    seen = {}\n    for i, x in enumerate(nums):\n        if target - x in seen:\n            return [seen[target - x], i]\n        seen[x] = i", "starter": "def two_sum(nums, target):\n    pass", "tests": ["two_sum([2, 7, 11, 15], 9)", "two_sum([3, 2, 4], 6)", "two_sum([3, 3], 6)", "two_sum([1, 5, 9, -2, 8], 6)"], "setup": ""}]}, {"n": 44, "week": 7, "track": "py", "title": "Hashing patterns", "learn": "<p>Hash maps and sets show up in a large share of interview problems. Three patterns to recognise:<\/p>\n<ol><li><strong>Seen-before<\/strong>: a set to spot duplicates or answer \"have I met this already?\"<\/li><li><strong>Counting<\/strong>: a dict or Counter of frequencies.<\/li><li><strong>Grouping by a signature<\/strong>: compute a key that's equal for items that belong together.<\/li><\/ol>\n<pre class=\"code\" data-lang=\"python\"><code>from collections import defaultdict\ngroups = defaultdict(list)\nfor w in [&quot;eat&quot;, &quot;tea&quot;, &quot;tan&quot;]:\n    key = &quot;&quot;.join(sorted(w))      # &#x27;aet&#x27; for both eat and tea\n    groups[key].append(w)<\/code><\/pre>\n<p>Dict keys must be immutable, so use a string or a <strong>tuple<\/strong> as the key, never a list.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Contains duplicate", "task": "<p>Return True if any value appears at least twice in <code>nums<\/code>.<\/p>", "hint": "Use a set: if x is already in it, return True.", "solution": "def contains_duplicate(nums):\n    seen = set()\n    for x in nums:\n        if x in seen:\n            return True\n        seen.add(x)\n    return False", "starter": "def contains_duplicate(nums):\n    pass", "tests": ["contains_duplicate([1, 2, 3, 1])", "contains_duplicate([1, 2, 3])", "contains_duplicate([])"], "setup": ""}, {"kind": "py", "title": "Group anagrams", "task": "<p>Write <code>group_anagrams(words)<\/code> returning a list of groups (lists) of words that are anagrams of each other. Any order is fine.<\/p>", "hint": "The signature is ''.join(sorted(w)). Group into a defaultdict(list) and return its values.", "solution": "from collections import defaultdict\n\ndef group_anagrams(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[\"\".join(sorted(w))].append(w)\n    return list(groups.values())", "starter": "def group_anagrams(words):\n    pass", "tests": ["sorted(sorted(g) for g in group_anagrams(['eat', 'tea', 'tan', 'ate', 'nat', 'bat']))", "sorted(sorted(g) for g in group_anagrams(['']))", "sorted(sorted(g) for g in group_anagrams(['abc']))"], "setup": ""}]}, {"n": 45, "week": 7, "track": "py", "title": "Two pointers", "learn": "<p>Put one pointer at each end (or two pointers moving at different speeds) and walk them toward each other. This often turns O(n²) into <strong>O(n)<\/strong> with <strong>O(1)<\/strong> extra memory.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def is_sorted_pair_sum(nums, target):     # nums is sorted\n    lo, hi = 0, len(nums) - 1\n    while lo &lt; hi:\n        s = nums[lo] + nums[hi]\n        if s == target: return True\n        if s &lt; target: lo += 1             # need bigger → move left pointer right\n        else: hi -= 1\n    return False<\/code><\/pre>\n<p>It works whenever the data is <strong>sorted<\/strong>, or the question is about <strong>both ends<\/strong> (like a palindrome).<\/p>", "stretch": "LeetCode 11 <em>Container With Most Water<\/em>: always move the shorter wall inward.", "problems": [{"kind": "py", "title": "Clean palindrome", "task": "<p>Return True if <code>s<\/code> is a palindrome considering <strong>only letters and digits<\/strong>, ignoring case. Use two pointers and don't build a new string.<\/p>", "hint": "Skip non-alphanumeric characters on either side, then compare the lowercase characters.", "solution": "def is_palindrome_clean(s):\n    lo, hi = 0, len(s) - 1\n    while lo < hi:\n        if not s[lo].isalnum():\n            lo += 1\n        elif not s[hi].isalnum():\n            hi -= 1\n        elif s[lo].lower() != s[hi].lower():\n            return False\n        else:\n            lo += 1\n            hi -= 1\n    return True", "starter": "def is_palindrome_clean(s):\n    pass", "tests": ["is_palindrome_clean('A man, a plan, a canal: Panama')", "is_palindrome_clean('race a car')", "is_palindrome_clean(' ')", "is_palindrome_clean('0P')"], "setup": ""}, {"kind": "py", "title": "Merge two sorted lists", "task": "<p>Write <code>merge_sorted(a, b)<\/code>: both lists are sorted, so return one sorted list in O(n + m) without calling <code>sorted()<\/code>.<\/p>", "hint": "Pointers i and j: take the smaller of a[i] and b[j] each time. When one list runs out, append the rest of the other.", "solution": "def merge_sorted(a, b):\n    i = j = 0\n    out = []\n    while i < len(a) and j < len(b):\n        if a[i] <= b[j]:\n            out.append(a[i]); i += 1\n        else:\n            out.append(b[j]); j += 1\n    out.extend(a[i:])\n    out.extend(b[j:])\n    return out", "starter": "def merge_sorted(a, b):\n    pass", "tests": ["merge_sorted([1, 3, 5], [2, 4, 6])", "merge_sorted([], [1, 2])", "merge_sorted([1, 1], [1])", "merge_sorted([5, 9], [1, 2, 3])"], "setup": ""}]}, {"n": 46, "week": 7, "track": "py", "title": "Sliding window", "learn": "<p>For questions about a <strong>contiguous subarray or substring<\/strong>, keep a \"window\" and slide it along instead of recomputing from scratch.<\/p>\n<p><strong>Fixed size k:<\/strong> add the item coming in and subtract the item going out.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>window = sum(nums[:k])\nbest = window\nfor i in range(k, len(nums)):\n    window += nums[i] - nums[i - k]\n    best = max(best, window)<\/code><\/pre>\n<p><strong>Variable size:<\/strong> grow the right edge, and shrink from the left while the window breaks a rule.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>left = 0\nfor right, ch in enumerate(s):\n    # add ch ...\n    while window_invalid():\n        # remove s[left] ...\n        left += 1<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: a fixed window is <code>SUM(x) OVER (ROWS BETWEEN k-1 PRECEDING AND CURRENT ROW)<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Max sum of k consecutive", "task": "<p>Write <code>max_window_sum(nums, k)<\/code>, the maximum sum of any k consecutive elements (assume len(nums) ≥ k ≥ 1).<\/p>", "hint": "Start with sum(nums[:k]). Each step: window += nums[i] - nums[i-k].", "solution": "def max_window_sum(nums, k):\n    window = sum(nums[:k])\n    best = window\n    for i in range(k, len(nums)):\n        window += nums[i] - nums[i - k]\n        best = max(best, window)\n    return best", "starter": "def max_window_sum(nums, k):\n    pass", "tests": ["max_window_sum([2, 1, 5, 1, 3, 2], 3)", "max_window_sum([5], 1)", "max_window_sum([-1, -2, -3], 2)", "max_window_sum([1, 2, 3, 4], 4)"], "setup": ""}, {"kind": "py", "title": "Longest substring without repeats", "task": "<p>Write <code>longest_unique(s)<\/code> returning the <strong>length<\/strong> of the longest substring with no repeated characters.<\/p>", "hint": "Remember each character's last index. If ch was seen inside the window, jump left to last[ch] + 1.", "solution": "def longest_unique(s):\n    last = {}\n    left = best = 0\n    for right, ch in enumerate(s):\n        if ch in last and last[ch] >= left:\n            left = last[ch] + 1\n        last[ch] = right\n        best = max(best, right - left + 1)\n    return best", "starter": "def longest_unique(s):\n    pass", "tests": ["longest_unique('abcabcbb')", "longest_unique('bbbbb')", "longest_unique('pwwkew')", "longest_unique('')", "longest_unique('abba')"], "setup": ""}]}, {"n": 47, "week": 7, "track": "py", "title": "Prefix sums", "learn": "<p>Precompute running totals once, and then the sum of <strong>any range<\/strong> is O(1):<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>nums = [3, 1, 4, 1, 5]\nprefix = [0]\nfor x in nums:\n    prefix.append(prefix[-1] + x)     # [0, 3, 4, 8, 9, 14]\n# sum of nums[i:j] == prefix[j] - prefix[i]\nprefix[4] - prefix[1]                 # 1+4+1 = 6<\/code><\/pre>\n<p><strong>Prefix sum + hash map<\/strong>: \"how many subarrays sum to k?\" A subarray ending here sums to k exactly when some <strong>earlier<\/strong> prefix equals <code>current - k<\/code>.<\/p>\n<div class=\"bridge\">SQL bridge: the prefix array is <code>SUM(x) OVER (ORDER BY i)<\/code>. You've used this idea for years.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Pivot index", "task": "<p>Return the leftmost index where the sum of everything to the left equals the sum of everything to the right, or -1 if there isn't one.<\/p>", "hint": "Right sum = total - left - x. Check before adding x to left.", "solution": "def pivot_index(nums):\n    total = sum(nums)\n    left = 0\n    for i, x in enumerate(nums):\n        if left == total - left - x:\n            return i\n        left += x\n    return -1", "starter": "def pivot_index(nums):\n    pass", "tests": ["pivot_index([1, 7, 3, 6, 5, 6])", "pivot_index([1, 2, 3])", "pivot_index([2, 1, -1])", "pivot_index([0])"], "setup": ""}, {"kind": "py", "title": "Count subarrays summing to k", "task": "<p>Return how many contiguous subarrays sum exactly to k. Aim for O(n).<\/p>", "hint": "Keep counts of prefix sums seen so far, starting with {0: 1}. Add counts[running - k] to the answer at each step.", "solution": "def subarray_sum(nums, k):\n    counts = {0: 1}\n    running = result = 0\n    for x in nums:\n        running += x\n        result += counts.get(running - k, 0)\n        counts[running] = counts.get(running, 0) + 1\n    return result", "starter": "def subarray_sum(nums, k):\n    pass", "tests": ["subarray_sum([1, 1, 1], 2)", "subarray_sum([1, 2, 3], 3)", "subarray_sum([1, -1, 0], 0)", "subarray_sum([], 0)"], "setup": ""}]}, {"n": 48, "week": 7, "track": "pd", "title": "NumPy deeper: axes, broadcasting & reshaping", "learn": "<pre class=\"code\" data-lang=\"python\"><code>m = np.array([[1, 2, 3],\n              [4, 5, 6]])\nm.shape                 # (2, 3)\nm.sum(axis=0)           # down the columns → [5, 7, 9]\nm.sum(axis=1)           # across the rows  → [6, 15]\nm.reshape(3, 2), m.T, m.flatten()\nm / m.sum(axis=1, keepdims=True)     # BROADCASTING: (2,3) / (2,1) works row by row\nnp.where(m &gt; 3, m, 0)                # keep values &gt; 3, otherwise 0\nm.argmax(), m.argmax(axis=1)         # index of the max<\/code><\/pre>\n<p><strong>Broadcasting rule:<\/strong> compare the shapes from the right. Dimensions must be equal, or one of them must be 1.<\/p>\n<p><code>axis=0<\/code> collapses the rows (gives one result per column). <code>axis=1<\/code> collapses the columns (one result per row).<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Row-normalise", "task": "<p>Write <code>row_normalize(m)<\/code> so each row sums to 1 (divide by the row sum). Use broadcasting, no loops.<\/p>", "hint": "Use m.sum(axis=1, keepdims=True) so the shapes broadcast.", "solution": "import numpy as np\n\ndef row_normalize(m):\n    return m / m.sum(axis=1, keepdims=True)", "starter": "import numpy as np\n\ndef row_normalize(m):\n    pass", "tests": ["row_normalize(np.array([[1, 1], [1, 3]]))", "row_normalize(np.array([[2, 3, 5]]))"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nimport numpy as np"}, {"kind": "pd", "title": "Clip negatives", "task": "<p>Write <code>clip_negatives(arr)<\/code> replacing negatives with 0 using <code>np.where<\/code>.<\/p>", "hint": "np.where(arr &lt; 0, 0, arr)", "solution": "import numpy as np\n\ndef clip_negatives(arr):\n    return np.where(arr < 0, 0, arr)", "starter": "import numpy as np\n\ndef clip_negatives(arr):\n    pass", "tests": ["clip_negatives(np.array([-2, 3, -1, 5]))", "clip_negatives(np.array([[1, -1], [-3, 4]]))"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nimport numpy as np"}, {"kind": "pd", "title": "Best month", "task": "<p><code>sales<\/code> is a 2-D array (rows = products, columns = months). Write <code>best_month(sales)<\/code> returning the <strong>column index<\/strong> with the highest total, as an int.<\/p>", "hint": "Total each column with sum(axis=0), then argmax.", "solution": "import numpy as np\n\ndef best_month(sales):\n    return int(sales.sum(axis=0).argmax())", "starter": "import numpy as np\n\ndef best_month(sales):\n    pass", "tests": ["best_month(np.array([[5, 1, 9], [3, 8, 2]]))", "best_month(np.array([[1, 2, 3, 4]]))"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nimport numpy as np"}]}, {"n": 49, "week": 7, "track": "sql", "title": "SQL: date logic & cohorts", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>Date questions show up all the time in banking analytics: first and last activity, quarter-over-quarter, new versus returning.<\/p>\n<pre class=\"code\" data-lang=\"sql\"><code>MIN(txn_date), MAX(txn_date)\n(CAST(strftime(&#x27;%m&#x27;, d) AS INTEGER) + 2) / 3      -- quarter number\nstrftime(&#x27;%Y-%m&#x27;, MIN(txn_date)) OVER (PARTITION BY account_id)   -- first-active month<\/code><\/pre>", "stretch": null, "problems": [{"kind": "sql", "title": "Account activity span", "task": "<p>Per account: <code>account_id, first_txn, last_txn, txn_count, active_days<\/code> (last − first in days, as an integer), <strong>ordered by<\/strong> account_id.<\/p>", "hint": "MIN, MAX and COUNT per account, plus a julianday difference.", "solution": "SELECT account_id, MIN(txn_date) AS first_txn, MAX(txn_date) AS last_txn, COUNT(*) AS txn_count,\n       CAST(julianday(MAX(txn_date)) - julianday(MIN(txn_date)) AS INTEGER) AS active_days\nFROM transactions\nGROUP BY account_id\nORDER BY account_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Q1 vs Q2 credits", "task": "<p>Accounts whose total <strong>credits<\/strong> in Q1 2026 (Jan–Mar) were greater than in Q2 2026 (Apr–Jun): <code>account_id, q1, q2<\/code>, <strong>ordered by<\/strong> account_id.<\/p>", "hint": "Use conditional aggregation by date range, then HAVING q1 &gt; q2.", "solution": "SELECT account_id,\n       SUM(CASE WHEN txn_date < '2026-04-01' THEN amount ELSE 0 END) AS q1,\n       SUM(CASE WHEN txn_date >= '2026-04-01' THEN amount ELSE 0 END) AS q2\nFROM transactions\nWHERE txn_type = 'CREDIT' AND txn_date >= '2026-01-01' AND txn_date < '2026-07-01'\nGROUP BY account_id\nHAVING q1 > q2\nORDER BY account_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "New vs returning accounts per month", "task": "<p>For each month: <code>month, active_accounts, new_accounts<\/code> (accounts whose <strong>first ever<\/strong> transaction is in that month), <strong>ordered by<\/strong> month.<\/p>", "hint": "Compute each account's first month with a window MIN, then COUNT(DISTINCT CASE ...).", "solution": "WITH t AS (\n    SELECT account_id, strftime('%Y-%m', txn_date) AS month,\n           MIN(strftime('%Y-%m', txn_date)) OVER (PARTITION BY account_id) AS first_month\n    FROM transactions\n)\nSELECT month, COUNT(DISTINCT account_id) AS active_accounts,\n       COUNT(DISTINCT CASE WHEN month = first_month THEN account_id END) AS new_accounts\nFROM t\nGROUP BY month\nORDER BY month;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 50, "week": 8, "track": "py", "title": "Stacks", "learn": "<p>A stack is <strong>Last In, First Out<\/strong>, like a pile of plates. In Python a list works as a stack: <code>append()<\/code> pushes and <code>pop()<\/code> pops, both O(1).<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>stack = []\nstack.append(&quot;(&quot;)\nstack.append(&quot;[&quot;)\nstack.pop()        # &#x27;[&#x27;\nstack[-1]          # peek: &#x27;(&#x27;\nnot stack          # True if empty<\/code><\/pre>\n<p>Use one for anything <strong>nested<\/strong> or <strong>matching<\/strong>: brackets, undo history, the call stack, evaluating expressions, DFS.<\/p>", "stretch": "LeetCode 155 <em>Min Stack<\/em>: getMin() in O(1) by storing (value, current_min) pairs.", "problems": [{"kind": "py", "title": "Valid parentheses", "task": "<p>Return True if every bracket in <code>s<\/code> (<code>()[]{}<\/code>) is closed by the right type in the right order.<\/p>", "hint": "Push opening brackets. On a closing bracket, the top of the stack must be its partner. At the end the stack must be empty.", "solution": "def is_valid(s):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n    for ch in s:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif not stack or stack.pop() != pairs[ch]:\n            return False\n    return not stack", "starter": "def is_valid(s):\n    pass", "tests": ["is_valid('()[]{}')", "is_valid('(]')", "is_valid('([{}])')", "is_valid('((')", "is_valid('')", "is_valid(')(')"], "setup": ""}]}, {"n": 51, "week": 8, "track": "py", "title": "Queues & deque", "learn": "<p>A queue is <strong>First In, First Out<\/strong>, like a line at the bank. Don't use <code>list.pop(0)<\/code>, which is O(n). Use <code>collections.deque<\/code>:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from collections import deque\nq = deque()\nq.append(&quot;a&quot;); q.append(&quot;b&quot;)   # enqueue at the right\nq.popleft()                    # &#x27;a&#x27;, O(1)\nq.appendleft(&quot;z&quot;)              # deque works at both ends\ndeque(maxlen=3)                # keeps only the last 3 items<\/code><\/pre>\n<p>Classic interview twist: <strong>build a queue out of two stacks<\/strong>. Pour the inbox stack into the outbox stack only when the outbox is empty. Each item moves at most once, so the cost averages out to O(1) per operation (this is called <strong>amortised O(1)<\/strong>).<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Queue from two stacks", "task": "<p>Implement <code>MyQueue<\/code> with <code>push(x)<\/code>, <code>pop()<\/code> (removes and returns the front), <code>peek()<\/code> and <code>empty()<\/code>, using <strong>only two lists used as stacks<\/strong>.<\/p>", "hint": "Push goes to inbox. pop and peek first refill the outbox by reversing the inbox, but only when the outbox is empty.", "solution": "class MyQueue:\n    def __init__(self):\n        self.inbox = []\n        self.outbox = []\n\n    def push(self, x):\n        self.inbox.append(x)\n\n    def _move(self):\n        if not self.outbox:\n            while self.inbox:\n                self.outbox.append(self.inbox.pop())\n\n    def pop(self):\n        self._move()\n        return self.outbox.pop()\n\n    def peek(self):\n        self._move()\n        return self.outbox[-1]\n\n    def empty(self):\n        return not self.inbox and not self.outbox", "starter": "class MyQueue:\n    def __init__(self):\n        self.inbox = []\n        self.outbox = []", "tests": ["(lambda q: (q.push(1), q.push(2), q.peek(), q.pop(), q.empty())[2:])(MyQueue())", "(lambda q: (q.push(1), q.push(2), q.pop(), q.push(3), q.pop(), q.pop(), q.empty())[2:])(MyQueue())", "MyQueue().empty()"], "setup": ""}, {"kind": "py", "title": "Last-N moving average", "task": "<p>Write class <code>MovingAverage(size)<\/code> with <code>next(val)<\/code> returning the average of the last <code>size<\/code> values. Use <code>deque(maxlen=size)<\/code>.<\/p>", "hint": "A deque with maxlen drops the oldest item automatically.", "solution": "from collections import deque\n\nclass MovingAverage:\n    def __init__(self, size):\n        self.window = deque(maxlen=size)\n\n    def next(self, val):\n        self.window.append(val)\n        return sum(self.window) / len(self.window)", "starter": "from collections import deque\n\nclass MovingAverage:\n    pass", "tests": ["(lambda m: [m.next(1), m.next(10), m.next(3), m.next(5)])(MovingAverage(3))", "MovingAverage(1).next(7)"], "setup": ""}]}, {"n": 52, "week": 8, "track": "py", "title": "Monotonic stack", "learn": "<p>\"For each element, find the <strong>next greater<\/strong> (or smaller) element.\" Doing it naively is O(n²). A <strong>monotonic stack<\/strong> does it in O(n).<\/p>\n<p>The idea: keep a stack of <em>indices<\/em> whose answer you don't know yet. Their values are kept in decreasing order. When a bigger value arrives, it is the answer for everything smaller on the stack, so pop those off.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>stack = []                     # indices still waiting for a warmer day\nfor i, t in enumerate(temps):\n    while stack and temps[stack[-1]] &lt; t:\n        j = stack.pop()\n        answer[j] = i - j      # i is the next warmer day for j\n    stack.append(i)<\/code><\/pre>\n<p>Each index is pushed once and popped once, so the total is O(n).<\/p>", "stretch": "LeetCode 84 <em>Largest Rectangle in Histogram<\/em> is the hard version of this pattern.", "problems": [{"kind": "py", "title": "Daily temperatures", "task": "<p>For each day, return how many days you'd wait for a warmer temperature (0 if never).<\/p>", "hint": "Stack of indices. While today is warmer than the day at stack[-1], pop it and set answer[j] = i - j.", "solution": "def daily_temperatures(temps):\n    answer = [0] * len(temps)\n    stack = []\n    for i, t in enumerate(temps):\n        while stack and temps[stack[-1]] < t:\n            j = stack.pop()\n            answer[j] = i - j\n        stack.append(i)\n    return answer", "starter": "def daily_temperatures(temps):\n    pass", "tests": ["daily_temperatures([73, 74, 75, 71, 69, 72, 76, 73])", "daily_temperatures([30, 40, 50, 60])", "daily_temperatures([60, 50, 40])", "daily_temperatures([])"], "setup": ""}]}, {"n": 53, "week": 8, "track": "py", "title": "Linked lists", "learn": "<p>A linked list is a chain of nodes. Each node holds a value and a pointer to the next node.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\nhead = ListNode(1, ListNode(2, ListNode(3)))   # 1 → 2 → 3\ncur = head\nwhile cur:                 # walk the chain\n    print(cur.val)\n    cur = cur.next<\/code><\/pre>\n<ul><li>Inserting or removing in the middle is O(1) once you're there. Reaching the i-th node is O(n).<\/li><li><strong>Draw boxes and arrows on paper.<\/strong> Most linked-list bugs come from losing a pointer.<\/li><li><strong>Fast/slow pointers:<\/strong> move one pointer 1 step and another 2 steps. When fast reaches the end, slow is in the middle.<\/li><\/ul>\n<p>For these problems, <code>ListNode<\/code> already exists, and the tests use helpers <code>_build([1,2,3])<\/code> and <code>_to_list(head)<\/code>.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Reverse a linked list", "task": "<p>Write <code>reverse_list(head)<\/code> returning the new head.<\/p>", "hint": "Keep three pointers, prev, cur and nxt. Save cur.next, point cur.next back at prev, then move both forward.", "solution": "def reverse_list(head):\n    prev = None\n    cur = head\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev = cur\n        cur = nxt\n    return prev", "starter": "def reverse_list(head):\n    pass", "tests": ["_to_list(reverse_list(_build([1, 2, 3, 4, 5])))", "_to_list(reverse_list(_build([])))", "_to_list(reverse_list(_build([7])))"], "setup": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef _build(vals):\n    head = None\n    for v in reversed(vals):\n        head = ListNode(v, head)\n    return head\n\ndef _to_list(head, limit=1000):\n    out = []\n    while head and len(out) < limit:\n        out.append(head.val)\n        head = head.next\n    return out\n\ndef _cycle(vals, pos):\n    head = _build(vals)\n    if pos < 0 or head is None:\n        return head\n    nodes, cur = [], head\n    while cur:\n        nodes.append(cur)\n        cur = cur.next\n    nodes[-1].next = nodes[pos]\n    return head"}, {"kind": "py", "title": "Middle node", "task": "<p>Write <code>middle_value(head)<\/code> returning the value of the middle node (for an even length, the <strong>second<\/strong> middle).<\/p>", "hint": "Fast moves 2 steps and slow moves 1. When fast falls off the end, slow is at the middle.", "solution": "def middle_value(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n    return slow.val", "starter": "def middle_value(head):\n    pass", "tests": ["middle_value(_build([1, 2, 3, 4, 5]))", "middle_value(_build([1, 2, 3, 4, 5, 6]))", "middle_value(_build([9]))"], "setup": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef _build(vals):\n    head = None\n    for v in reversed(vals):\n        head = ListNode(v, head)\n    return head\n\ndef _to_list(head, limit=1000):\n    out = []\n    while head and len(out) < limit:\n        out.append(head.val)\n        head = head.next\n    return out\n\ndef _cycle(vals, pos):\n    head = _build(vals)\n    if pos < 0 or head is None:\n        return head\n    nodes, cur = [], head\n    while cur:\n        nodes.append(cur)\n        cur = cur.next\n    nodes[-1].next = nodes[pos]\n    return head"}]}, {"n": 54, "week": 8, "track": "py", "title": "Linked lists 2: merging & cycles", "learn": "<p><strong>A dummy head node<\/strong> makes building a new list easy: start with <code>dummy = ListNode()<\/code>, keep a <code>tail<\/code> pointer, append nodes to <code>tail.next<\/code>, and return <code>dummy.next<\/code> at the end.<\/p>\n<p><strong>Floyd's cycle detection<\/strong> (the tortoise and the hare): if the list loops back on itself, the fast pointer eventually catches up with the slow one. If there's no loop, fast reaches <code>None<\/code>. This uses O(1) memory, compared with O(n) for a set of visited nodes.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>slow = fast = head\nwhile fast and fast.next:\n    slow, fast = slow.next, fast.next.next\n    if slow is fast:      # &#x27;is&#x27; compares identity (the same node object)\n        return True\nreturn False<\/code><\/pre>\n<p>Tests use <code>_cycle([3,2,0,-4], 1)<\/code>, which builds the list and connects the tail back to index 1.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Merge two sorted linked lists", "task": "<p>Write <code>merge_two(a, b)<\/code> merging two sorted linked lists into one sorted list and returning its head.<\/p>", "hint": "Use a dummy head and a tail pointer. Attach the smaller node each step, and attach whatever is left at the end.", "solution": "def merge_two(a, b):\n    dummy = tail = ListNode()\n    while a and b:\n        if a.val <= b.val:\n            tail.next, a = a, a.next\n        else:\n            tail.next, b = b, b.next\n        tail = tail.next\n    tail.next = a or b\n    return dummy.next", "starter": "def merge_two(a, b):\n    pass", "tests": ["_to_list(merge_two(_build([1, 2, 4]), _build([1, 3, 4])))", "_to_list(merge_two(_build([]), _build([0])))", "_to_list(merge_two(_build([]), _build([])))"], "setup": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef _build(vals):\n    head = None\n    for v in reversed(vals):\n        head = ListNode(v, head)\n    return head\n\ndef _to_list(head, limit=1000):\n    out = []\n    while head and len(out) < limit:\n        out.append(head.val)\n        head = head.next\n    return out\n\ndef _cycle(vals, pos):\n    head = _build(vals)\n    if pos < 0 or head is None:\n        return head\n    nodes, cur = [], head\n    while cur:\n        nodes.append(cur)\n        cur = cur.next\n    nodes[-1].next = nodes[pos]\n    return head"}, {"kind": "py", "title": "Has cycle", "task": "<p>Write <code>has_cycle(head)<\/code> → True if the list contains a cycle. Use O(1) extra memory.<\/p>", "hint": "Use Floyd's fast/slow pointers. Compare the nodes with <code>is<\/code>, not their values.", "solution": "def has_cycle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:\n            return True\n    return False", "starter": "def has_cycle(head):\n    pass", "tests": ["has_cycle(_cycle([3, 2, 0, -4], 1))", "has_cycle(_cycle([1, 2], 0))", "has_cycle(_cycle([1], -1))", "has_cycle(None)"], "setup": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\ndef _build(vals):\n    head = None\n    for v in reversed(vals):\n        head = ListNode(v, head)\n    return head\n\ndef _to_list(head, limit=1000):\n    out = []\n    while head and len(out) < limit:\n        out.append(head.val)\n        head = head.next\n    return out\n\ndef _cycle(vals, pos):\n    head = _build(vals)\n    if pos < 0 or head is None:\n        return head\n    nodes, cur = [], head\n    while cur:\n        nodes.append(cur)\n        cur = cur.next\n    nodes[-1].next = nodes[pos]\n    return head"}]}, {"n": 55, "week": 8, "track": "pd", "title": "Strings & datetimes in pandas", "learn": "<pre class=\"code\" data-lang=\"python\"><code>s = pd.Series([&quot;Ananya.Rao@Gmail.com&quot;, &quot;vikram@icici.com&quot;])\ns.str.lower(), s.str.split(&quot;@&quot;).str[1], s.str.contains(&quot;icici&quot;), s.str.len()\ns.str.extract(r&quot;@(\\w+)\\.&quot;)             # regex capture groups\n\nd = txns[&quot;txn_date&quot;]\nd.dt.day_name(), d.dt.month, d.dt.to_period(&quot;M&quot;), d.dt.dayofweek   # Monday = 0\n(d.max() - d.min()).days\n\norder = [&quot;Monday&quot;, &quot;Tuesday&quot;, &quot;Wednesday&quot;, &quot;Thursday&quot;, &quot;Friday&quot;, &quot;Saturday&quot;, &quot;Sunday&quot;]\nseries.reindex(order, fill_value=0)     # force an order and fill in missing labels<\/code><\/pre>", "stretch": null, "problems": [{"kind": "pd", "title": "Spend by weekday", "task": "<p>Write <code>weekday_spend(df)<\/code> returning a <strong>Series<\/strong> of total DEBIT amount per weekday name, ordered Monday→Sunday, with missing days as 0.<\/p>", "hint": "Filter the debits, groupby on .dt.day_name(), then reindex with the Monday→Sunday order.", "solution": "def weekday_spend(df):\n    order = [\"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\", \"Sunday\"]\n    debits = df[df[\"txn_type\"] == \"DEBIT\"]\n    s = debits.groupby(debits[\"txn_date\"].dt.day_name())[\"amount\"].sum()\n    return s.reindex(order, fill_value=0)", "starter": "def weekday_spend(df):\n    pass", "tests": ["weekday_spend(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Email domains", "task": "<p><code>contacts<\/code> has an <code>email<\/code> column. Write <code>domain_counts(contacts)<\/code> returning a <strong>dict<\/strong> of lowercase domain (the part after @) → count.<\/p>", "hint": ".str.lower().str.split('@').str[1].value_counts().to_dict()", "solution": "def domain_counts(contacts):\n    return contacts[\"email\"].str.lower().str.split(\"@\").str[1].value_counts().to_dict()", "starter": "def domain_counts(contacts):\n    pass", "tests": ["domain_counts(contacts.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\ncontacts = pd.DataFrame({'email': ['ananya@Gmail.com', 'vikram@icici.com', 'meera@gmail.com', 'ARJUN@ICICI.COM', 'kavya@yahoo.in', 'rohan@gmail.com']})"}]}, {"n": 56, "week": 8, "track": "sql", "title": "SQL interview classics (employees table)", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>Today uses the <code>employees<\/code> table (<code>emp_id, name, branch_id, manager_id, salary, hire_date<\/code>). Self-joins, the \"Nth highest\" question, and top-per-group with ties come up in nearly every data interview.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Second-highest salary", "task": "<p>Return the second-highest <strong>distinct<\/strong> salary as a single value <code>second_highest<\/code>.<\/p>", "hint": "There are several approaches: MAX below the MAX, DENSE_RANK = 2, or DISTINCT ... LIMIT 1 OFFSET 1.", "solution": "SELECT MAX(salary) AS second_highest\nFROM employees\nWHERE salary < (SELECT MAX(salary) FROM employees);", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Earning more than their manager", "task": "<p>Employees who earn <strong>strictly more<\/strong> than their manager: <code>employee, manager, emp_salary, mgr_salary<\/code>.<\/p>", "hint": "Self-join employees e to employees m ON m.emp_id = e.manager_id.", "solution": "SELECT e.name AS employee, m.name AS manager, e.salary AS emp_salary, m.salary AS mgr_salary\nFROM employees e\nJOIN employees m ON m.emp_id = e.manager_id\nWHERE e.salary > m.salary;", "starter": "-- Write your query here\nSELECT ", "ordered": false}, {"kind": "sql", "title": "Top earner per branch (keep ties)", "task": "<p>For each branch_id, the highest-paid employee(s), <strong>including ties<\/strong>: <code>branch_id, name, salary<\/code>, <strong>ordered by<\/strong> branch_id, name.<\/p>", "hint": "Use RANK (not ROW_NUMBER) so ties both survive.", "solution": "WITH r AS (\n    SELECT branch_id, name, salary, RANK() OVER (PARTITION BY branch_id ORDER BY salary DESC) AS rk\n    FROM employees\n)\nSELECT branch_id, name, salary FROM r WHERE rk = 1\nORDER BY branch_id, name;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 57, "week": 9, "track": "py", "title": "Backtracking", "learn": "<p>Backtracking explores every choice, <strong>undoes it<\/strong>, and tries the next one. Think of it as a decision tree: at each element, either \"take it\" or \"skip it\".<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def subsets(nums):\n    result, current = [], []\n    def explore(i):\n        if i == len(nums):              # base case: made a choice for every element\n            result.append(current[:])   # save a COPY\n            return\n        current.append(nums[i])         # choose\n        explore(i + 1)\n        current.pop()                   # un-choose (this is the backtrack)\n        explore(i + 1)                  # skip\n    explore(0)\n    return result<\/code><\/pre>\n<p>The <strong>choose → explore → un-choose<\/strong> template solves subsets, permutations, combinations, N-Queens, Sudoku and more.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Subsets", "task": "<p>Write <code>subsets(nums)<\/code> returning all subsets (the power set) of distinct integers. Any order.<\/p>", "hint": "Follow the template in the lesson. Remember to append a copy (current[:]), not current itself.", "solution": "def subsets(nums):\n    result, current = [], []\n    def explore(i):\n        if i == len(nums):\n            result.append(current[:])\n            return\n        current.append(nums[i])\n        explore(i + 1)\n        current.pop()\n        explore(i + 1)\n    explore(0)\n    return result", "starter": "def subsets(nums):\n    pass", "tests": ["sorted(sorted(s) for s in subsets([1, 2, 3]))", "sorted(sorted(s) for s in subsets([]))", "len(subsets([1, 2, 3, 4, 5]))"], "setup": ""}, {"kind": "py", "title": "Permutations", "task": "<p>Write <code>permutations(s)<\/code> returning a <strong>sorted list<\/strong> of all distinct orderings of the string <code>s<\/code>.<\/p>", "hint": "explore(prefix, remaining): try each remaining character as the next one. Use a set so repeated letters don't give duplicates.", "solution": "def permutations(s):\n    result = set()\n    def explore(prefix, remaining):\n        if not remaining:\n            result.add(prefix)\n            return\n        for i in range(len(remaining)):\n            explore(prefix + remaining[i], remaining[:i] + remaining[i + 1:])\n    explore(\"\", s)\n    return sorted(result)", "starter": "def permutations(s):\n    pass", "tests": ["permutations('abc')", "permutations('aab')", "permutations('')", "len(permutations('abcde'))"], "setup": ""}]}, {"n": 58, "week": 9, "track": "py", "title": "Binary search", "learn": "<p>On <strong>sorted<\/strong> data, halve the search space each step, which is <strong>O(log n)<\/strong>. A million items take about 20 steps.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def binary_search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo &lt;= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] &lt; target:\n            lo = mid + 1          # target is in the right half\n        else:\n            hi = mid - 1          # target is in the left half\n    return -1<\/code><\/pre>\n<p>Off-by-one errors are the main danger. Decide whether your range is <code>[lo, hi]<\/code> (inclusive) or <code>[lo, hi)<\/code>, and stick with it.<\/p>\n<div class=\"bridge\">SQL bridge: a B-tree index lookup is binary search on disk. That's why <code>WHERE id = 5<\/code> on an indexed column is fast.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Binary search", "task": "<p>Return the index of <code>target<\/code> in sorted <code>nums<\/code>, or -1. Don't use <code>.index()<\/code>.<\/p>", "hint": "Use while lo &lt;= hi and mid = (lo + hi) // 2. Move lo or hi past mid.", "solution": "def binary_search(nums, target):\n    lo, hi = 0, len(nums) - 1\n    while lo <= hi:\n        mid = (lo + hi) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1", "starter": "def binary_search(nums, target):\n    pass", "tests": ["binary_search([-1, 0, 3, 5, 9, 12], 9)", "binary_search([-1, 0, 3, 5, 9, 12], 2)", "binary_search([], 1)", "binary_search([5], 5)", "binary_search(list(range(0, 1000, 3)), 999)"], "setup": ""}, {"kind": "py", "title": "Search insert position", "task": "<p>Return the index where <code>target<\/code> is, or where it <strong>would be inserted<\/strong> to keep <code>nums<\/code> sorted.<\/p>", "hint": "Use a half-open range [lo, hi) with hi = len(nums). When the loop ends, lo is the first index whose value is ≥ target.", "solution": "def search_insert(nums, target):\n    lo, hi = 0, len(nums)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if nums[mid] < target:\n            lo = mid + 1\n        else:\n            hi = mid\n    return lo", "starter": "def search_insert(nums, target):\n    pass", "tests": ["search_insert([1, 3, 5, 6], 5)", "search_insert([1, 3, 5, 6], 2)", "search_insert([1, 3, 5, 6], 7)", "search_insert([], 4)"], "setup": ""}]}, {"n": 59, "week": 9, "track": "py", "title": "Binary search on the answer", "learn": "<p>Binary search isn't only for arrays. Whenever you have a <strong>yes/no question that flips exactly once<\/strong> (<code>False False False True True<\/code>), you can binary search for the first <code>True<\/code>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def first_true(lo, hi, ok):     # smallest x in [lo, hi] with ok(x) True\n    while lo &lt; hi:\n        mid = (lo + hi) // 2\n        if ok(mid):\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo<\/code><\/pre>\n<p>Examples: integer square root (\"is mid*mid &gt; x?\"), the first bad build in CI, the minimum capacity to ship packages in D days, Koko eating bananas.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Integer square root", "task": "<p>Return ⌊√x⌋ for x ≥ 0 without using <code>**0.5<\/code> or <code>math<\/code>.<\/p>", "hint": "You're looking for the largest m with m*m &lt;= x. Round mid up, (lo + hi + 1) // 2, so the loop always makes progress.", "solution": "def int_sqrt(x):\n    lo, hi = 0, x\n    while lo < hi:\n        mid = (lo + hi + 1) // 2\n        if mid * mid <= x:\n            lo = mid\n        else:\n            hi = mid - 1\n    return lo", "starter": "def int_sqrt(x):\n    pass", "tests": ["int_sqrt(0)", "int_sqrt(1)", "int_sqrt(8)", "int_sqrt(16)", "int_sqrt(2147395599)"], "setup": ""}, {"kind": "py", "title": "First bad version", "task": "<p>Versions 1..n. <code>is_bad(v)<\/code> is False up to some version and True from then on. Return the first bad version using as few calls as possible.<\/p>", "hint": "Use the first_true template from the lesson with lo=1 and hi=n.", "solution": "def first_bad(n, is_bad):\n    lo, hi = 1, n\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if is_bad(mid):\n            hi = mid\n        else:\n            lo = mid + 1\n    return lo", "starter": "def first_bad(n, is_bad):\n    pass", "tests": ["first_bad(10, lambda v: v >= 4)", "first_bad(1, lambda v: True)", "first_bad(10**9, lambda v: v >= 123456789)"], "setup": ""}]}, {"n": 60, "week": 9, "track": "py", "title": "Sorting algorithms", "learn": "<p>You'll almost always use <code>sorted()<\/code> (Timsort, O(n log n)), but implementing sorts yourself teaches you how to reason about loops and recursion.<\/p>\n<p><strong>Insertion sort, O(n²):<\/strong> like sorting playing cards in your hand. Take the next card and slide it left until it's in place. It's fast on nearly sorted data.<\/p>\n<p><strong>Merge sort, O(n log n):<\/strong> <em>divide and conquer<\/em>.<\/p>\n<ol><li>Split the list in half.<\/li><li>Sort each half (recursively).<\/li><li><strong>Merge<\/strong> the two sorted halves (you wrote this on day 45!).<\/li><\/ol>\n<pre class=\"code\" data-lang=\"python\"><code>def merge_sort(a):\n    if len(a) &lt;= 1:\n        return a\n    mid = len(a) // 2\n    return merge(merge_sort(a[:mid]), merge_sort(a[mid:]))<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: databases use an external merge sort when an <code>ORDER BY<\/code> doesn't fit in memory.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Insertion sort", "task": "<p>Write <code>insertion_sort(nums)<\/code> returning a new sorted list. Don't use <code>sorted<\/code> or <code>.sort<\/code>.<\/p>", "hint": "For each i, save key = a[i] and shift bigger elements one place right, then drop key into the gap.", "solution": "def insertion_sort(nums):\n    a = list(nums)\n    for i in range(1, len(a)):\n        key = a[i]\n        j = i - 1\n        while j >= 0 and a[j] > key:\n            a[j + 1] = a[j]\n            j -= 1\n        a[j + 1] = key\n    return a", "starter": "def insertion_sort(nums):\n    a = list(nums)\n    # sort a in place\n    return a", "tests": ["insertion_sort([5, 2, 4, 6, 1, 3])", "insertion_sort([])", "insertion_sort([1])", "insertion_sort([3, 3, 1])"], "setup": ""}, {"kind": "py", "title": "Merge sort", "task": "<p>Write <code>merge_sort(nums)<\/code> returning a new sorted list in O(n log n).<\/p>", "hint": "Base case len &lt;= 1. Split, recurse on both halves, then merge with two pointers.", "solution": "def merge_sort(nums):\n    if len(nums) <= 1:\n        return list(nums)\n    mid = len(nums) // 2\n    left, right = merge_sort(nums[:mid]), merge_sort(nums[mid:])\n    out, i, j = [], 0, 0\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            out.append(left[i]); i += 1\n        else:\n            out.append(right[j]); j += 1\n    return out + left[i:] + right[j:]", "starter": "def merge_sort(nums):\n    pass", "tests": ["merge_sort([38, 27, 43, 3, 9, 82, 10])", "merge_sort([])", "merge_sort([2, 1])", "merge_sort(list(range(50, 0, -1))) == list(range(1, 51))"], "setup": ""}]}, {"n": 61, "week": 9, "track": "py", "title": "Sorting as a tool: intervals", "learn": "<p>Many problems become easy <strong>once the data is sorted<\/strong>. Intervals are the classic case: sort by start time, and overlapping intervals end up next to each other.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>intervals.sort(key=lambda iv: iv[0])\nmerged = [intervals[0]]\nfor start, end in intervals[1:]:\n    if start &lt;= merged[-1][1]:            # overlaps the last one\n        merged[-1][1] = max(merged[-1][1], end)\n    else:\n        merged.append([start, end])<\/code><\/pre>\n<p>The same idea solves meeting rooms, calendar free slots, and session windows in clickstream data.<\/p>", "stretch": "LeetCode 253 <em>Meeting Rooms II<\/em>: how many rooms do you need? (Sort, then use a heap of end times, which is week 11.)", "problems": [{"kind": "py", "title": "Merge intervals", "task": "<p>Write <code>merge_intervals(intervals)<\/code> merging all overlapping <code>[start, end]<\/code> intervals. Return them sorted by start.<\/p>", "hint": "Sort by start. Compare each interval's start with the end of the last merged interval.", "solution": "def merge_intervals(intervals):\n    if not intervals:\n        return []\n    ivs = sorted([list(iv) for iv in intervals], key=lambda iv: iv[0])\n    merged = [ivs[0]]\n    for start, end in ivs[1:]:\n        if start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    return merged", "starter": "def merge_intervals(intervals):\n    pass", "tests": ["merge_intervals([[1, 3], [2, 6], [8, 10], [15, 18]])", "merge_intervals([[1, 4], [4, 5]])", "merge_intervals([])", "merge_intervals([[5, 6], [1, 10]])"], "setup": ""}]}, {"n": 62, "week": 9, "track": "pd", "title": "Mini EDA: putting pandas together", "learn": "<p>A real analysis chains everything together: <strong>merge → derive → aggregate → sort → present<\/strong>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>report = (\n    accounts\n    .merge(customers, on=&quot;customer_id&quot;)\n    .groupby([&quot;customer_id&quot;, &quot;name&quot;], as_index=False)\n    .agg(n_accounts=(&quot;account_id&quot;, &quot;count&quot;), total_balance=(&quot;balance&quot;, &quot;sum&quot;))\n    .sort_values(&quot;total_balance&quot;, ascending=False)\n)<\/code><\/pre>\n<p>Writing it as a <strong>method chain<\/strong> in parentheses keeps each step readable, like CTEs in SQL.<\/p>\n<p>Outlier rule of thumb: values more than k standard deviations above the mean (<code>mean + k*std<\/code>). Note that pandas <code>.std()<\/code> uses the sample std (ddof=1).<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Customer report", "task": "<p>Write <code>customer_report(customers, accounts, txns)<\/code> returning <code>name, n_accounts, total_balance, n_txns<\/code> for customers with accounts, sorted by total_balance descending, index reset. (Count transactions across all of a customer's accounts.)<\/p>", "hint": "Build two aggregates (accounts per customer, and txns per customer via accounts), then merge them on customer_id.", "solution": "def customer_report(customers, accounts, txns):\n    acc = accounts.merge(customers, on=\"customer_id\")\n    base = acc.groupby([\"customer_id\", \"name\"], as_index=False).agg(\n        n_accounts=(\"account_id\", \"count\"), total_balance=(\"balance\", \"sum\"))\n    t = txns.merge(accounts[[\"account_id\", \"customer_id\"]], on=\"account_id\")\n    tc = t.groupby(\"customer_id\", as_index=False).agg(n_txns=(\"txn_id\", \"count\"))\n    out = base.merge(tc, on=\"customer_id\", how=\"left\").fillna({\"n_txns\": 0})\n    out = out.sort_values(\"total_balance\", ascending=False).reset_index(drop=True)\n    return out[[\"name\", \"n_accounts\", \"total_balance\", \"n_txns\"]]", "starter": "def customer_report(customers, accounts, txns):\n    pass", "tests": ["customer_report(customers.copy(), accounts.copy(), txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Flag outliers", "task": "<p>Write <code>flag_outliers(df)<\/code> adding a boolean column <code>outlier<\/code> = amount &gt; mean + 1.5 × std (pandas <code>.std()<\/code>). Return df.<\/p>", "hint": "Compute the limit once (a single number), then compare the whole column against it.", "solution": "def flag_outliers(df):\n    limit = df[\"amount\"].mean() + 1.5 * df[\"amount\"].std()\n    df[\"outlier\"] = df[\"amount\"] > limit\n    return df", "starter": "def flag_outliers(df):\n    pass", "tests": ["flag_outliers(txns.copy())['outlier']", "int(flag_outliers(txns.copy())['outlier'].sum())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 63, "week": 9, "track": "sql", "title": "SQL: percent of total, NTILE & pivots", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<pre class=\"code\" data-lang=\"sql\"><code>100.0 * x / SUM(x) OVER ()        -- share of the grand total\nNTILE(4) OVER (ORDER BY balance DESC)   -- quartile buckets\nSUM(CASE WHEN type = &#x27;FD&#x27; THEN balance ELSE 0 END) AS fd   -- manual pivot<\/code><\/pre>", "stretch": null, "problems": [{"kind": "sql", "title": "Branch share of deposits", "task": "<p><code>city, total_balance, pct<\/code> where pct is the branch's share of all balances (rounded 2), <strong>ordered by<\/strong> pct descending.<\/p>", "hint": "SUM(SUM(balance)) OVER () is the grand total: a window over an aggregate.", "solution": "SELECT b.city, SUM(a.balance) AS total_balance,\n       ROUND(100.0 * SUM(a.balance) / SUM(SUM(a.balance)) OVER (), 2) AS pct\nFROM accounts a JOIN branches b ON b.branch_id = a.branch_id\nGROUP BY b.city\nORDER BY pct DESC;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Balance quartiles", "task": "<p><code>account_id, balance, quartile<\/code> using NTILE(4) over balance descending (ties: account_id), <strong>ordered by<\/strong> balance descending, account_id.<\/p>", "hint": "NTILE(4) OVER (ORDER BY balance DESC, account_id).", "solution": "SELECT account_id, balance, NTILE(4) OVER (ORDER BY balance DESC, account_id) AS quartile\nFROM accounts\nORDER BY balance DESC, account_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Segment × account type pivot", "task": "<p>Per customer segment: <code>segment, savings, current, fd<\/code>, the total balance by account type, <strong>ordered by<\/strong> segment.<\/p>", "hint": "Three SUM(CASE ...) columns.", "solution": "SELECT c.segment,\n       SUM(CASE WHEN a.type = 'SAVINGS' THEN a.balance ELSE 0 END) AS savings,\n       SUM(CASE WHEN a.type = 'CURRENT' THEN a.balance ELSE 0 END) AS current,\n       SUM(CASE WHEN a.type = 'FD' THEN a.balance ELSE 0 END) AS fd\nFROM accounts a JOIN customers c ON c.customer_id = a.customer_id\nGROUP BY c.segment\nORDER BY c.segment;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 64, "week": 10, "track": "py", "title": "Binary trees & traversals", "learn": "<p>A tree node has a value and up to two children. Almost every tree problem is solved with <strong>recursion<\/strong>: handle the node, then trust the recursive call to handle each subtree.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right<\/code><\/pre>\n<p>Three depth-first orders:<\/p>\n<ul><li><strong>Preorder<\/strong>: node, left, right (copying a tree)<\/li><li><strong>Inorder<\/strong>: left, node, right (on a BST this gives <strong>sorted<\/strong> order)<\/li><li><strong>Postorder<\/strong>: left, right, node (deleting or sizing a tree)<\/li><\/ul>\n<pre class=\"code\" data-lang=\"python\"><code>def inorder(root):\n    if root is None:\n        return []\n    return inorder(root.left) + [root.val] + inorder(root.right)<\/code><\/pre>\n<p>Tests build trees with <code>_tree([1, None, 2, 3])<\/code> (LeetCode-style level order, where None means a missing child).<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Inorder traversal", "task": "<p>Return the inorder traversal as a list.<\/p>", "hint": "Base case None → []. Then left + [val] + right.", "solution": "def inorder(root):\n    if root is None:\n        return []\n    return inorder(root.left) + [root.val] + inorder(root.right)", "starter": "def inorder(root):\n    pass", "tests": ["inorder(_tree([1, None, 2, 3]))", "inorder(_tree([]))", "inorder(_tree([4, 2, 6, 1, 3, 5, 7]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}, {"kind": "py", "title": "Preorder, iteratively", "task": "<p>Return the preorder traversal <strong>without recursion<\/strong>, using an explicit stack.<\/p>", "hint": "Pop a node and record it. Push right before left so the left child gets popped first.", "solution": "def preorder(root):\n    out, stack = [], [root] if root else []\n    while stack:\n        node = stack.pop()\n        out.append(node.val)\n        if node.right:\n            stack.append(node.right)\n        if node.left:\n            stack.append(node.left)\n    return out", "starter": "def preorder(root):\n    pass", "tests": ["preorder(_tree([1, None, 2, 3]))", "preorder(_tree([]))", "preorder(_tree([4, 2, 6, 1, 3, 5, 7]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}]}, {"n": 65, "week": 10, "track": "py", "title": "Thinking recursively about trees", "learn": "<p>The most useful question for tree problems: <strong>\"If I already knew the answer for my left and right subtrees, how would I get the answer for this node?\"<\/strong><\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def size(root):\n    if not root:\n        return 0\n    return 1 + size(root.left) + size(root.right)<\/code><\/pre>\n<ul><li>Max depth = 1 + max(depth(left), depth(right))<\/li><li>Same tree = values equal AND left subtrees same AND right subtrees same<\/li><li>Mirror tree = swap the children, recursively<\/li><\/ul>\n<p>Each node is visited once, so it's O(n) time. The extra space is O(height) for the call stack.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Max depth", "task": "<p>Return the number of nodes on the longest path from the root down to a leaf.<\/p>", "hint": "Empty tree → 0. Otherwise 1 + the max of the two subtrees.", "solution": "def max_depth(root):\n    if root is None:\n        return 0\n    return 1 + max(max_depth(root.left), max_depth(root.right))", "starter": "def max_depth(root):\n    pass", "tests": ["max_depth(_tree([3, 9, 20, None, None, 15, 7]))", "max_depth(_tree([1, None, 2]))", "max_depth(_tree([]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}, {"kind": "py", "title": "Same tree", "task": "<p>Return True if two trees have the same shape and the same values.<\/p>", "hint": "Both None → True. Only one is None, or the values differ → False. Otherwise recurse on both sides.", "solution": "def is_same(p, q):\n    if p is None and q is None:\n        return True\n    if p is None or q is None or p.val != q.val:\n        return False\n    return is_same(p.left, q.left) and is_same(p.right, q.right)", "starter": "def is_same(p, q):\n    pass", "tests": ["is_same(_tree([1, 2, 3]), _tree([1, 2, 3]))", "is_same(_tree([1, 2]), _tree([1, None, 2]))", "is_same(_tree([]), _tree([]))", "is_same(_tree([1, 2, 1]), _tree([1, 1, 2]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list,
