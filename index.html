<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Code — 84 days of Python, DSA, pandas &amp; SQL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#fffdf9; --panel2:#f1eee7; --ink:#1f1d1a; --muted:#6b665e; --line:#e4dfd4;
  --py:#4f46e5; --pd:#0e8a7a; --sql:#c2410c; --ok:#15803d; --okbg:#e9f6ee; --bad:#b91c1c; --badbg:#fcecec;
  --ed:#1b1d27; --ed2:#232634; --edink:#e4e4ef; --edmuted:#6c7091;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131419; --panel:#1b1d24; --panel2:#22252e; --ink:#ecebe7; --muted:#a29e96; --line:#2d303a;
        --okbg:#12301e; --badbg:#3a1717; --py:#8b85ff; --pd:#2cc4ad; --sql:#f08a4b; --ok:#4ade80; --bad:#f87171;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--py)}
button{font:inherit;cursor:pointer}
code{font-family:var(--mono);font-size:.88em;background:var(--panel2);padding:.08em .35em;border-radius:5px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;text-decoration:none;color:var(--ink);letter-spacing:-.02em}
.brand span{color:var(--py)}
.top nav{display:flex;gap:4px}
.top nav a{padding:6px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.top nav a.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.stats{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.chip{padding:3px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.chip.ready{color:var(--ok)} .chip.err{color:var(--bad)}
main{max-width:1440px;margin:0 auto;padding:20px}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:6px;color:#fff}
.t-py{background:var(--py)} .t-pd{background:var(--pd)} .t-sql{background:var(--sql)}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:9px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--py);border-color:var(--py);color:#fff}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
/* day */
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.dayhead h1{font-size:24px;margin:0;letter-spacing:-.02em;flex:1 1 360px}
.dayhead .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.lesson{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto}
@media (max-width:980px){.lesson{position:static;max-height:none}}
.lesson h2,.work h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.lesson p{margin:.6em 0}
.lesson ul,.lesson ol,.task ul,.task ol{padding-left:1.3em;margin:.5em 0}
.bridge{border-left:3px solid var(--pd);background:color-mix(in srgb,var(--pd) 9%,transparent);padding:8px 12px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.bridge::before{content:"🔗 ";}
pre.code{background:var(--ed);color:var(--edink);padding:12px 14px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.55;margin:10px 0}
pre.code code{background:none;padding:0;font-size:inherit;color:inherit}
table.mdt{border-collapse:collapse;font-size:13.5px;margin:10px 0;width:100%}
table.mdt th,table.mdt td{border:1px solid var(--line);padding:5px 9px;text-align:left}
table.mdt th{background:var(--panel2)}
.stretch{margin-top:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:10px;font-size:14px}
.notes textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);padding:8px 10px;font:inherit;font-size:14px;resize:vertical}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ptab{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 12px;font-size:14px;color:var(--muted)}
.ptab.on{background:var(--panel);color:var(--ink);border-color:var(--ink)}
.ptab .ok{color:var(--ok);font-weight:700}
.task{margin-bottom:12px}
.task h3{margin:0 0 6px;font-size:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.toolbar .sp{flex:1}
.kbd{font-size:12px;color:var(--muted)}
/* editor */
.ed{display:flex;background:var(--ed);border-radius:12px;overflow:hidden;border:1px solid #0000}
.ed:focus-within{border-color:var(--py)}
.ed-gutter{flex:0 0 auto;padding:12px 8px 12px 12px;text-align:right;color:var(--edmuted);font:13.5px/20px var(--mono);user-select:none;background:var(--ed2);min-width:42px;white-space:pre}
.ed-wrap{position:relative;flex:1;min-width:0}
.ed-hl,.ed-ta{margin:0;border:0;padding:12px 14px;font:13.5px/20px var(--mono);tab-size:4;white-space:pre;word-wrap:normal;letter-spacing:0}
.ed-hl{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--edink)}
.ed-hl code{background:none;padding:0;font:inherit;color:inherit}
.ed-ta{position:relative;display:block;width:100%;background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;overflow-x:auto;overflow-y:hidden}
.ed-ta::selection{background:#4f46e566;color:transparent}
.tk-k{color:#c792ea}.tk-s{color:#c3e88d}.tk-n{color:#f78c6c}.tk-c{color:#7a7fa6;font-style:italic}.tk-b{color:#82aaff}.tk-f{color:#ffcb6b}
/* output */
.out{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.out-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel2);font-size:13px;font-weight:600}
.out-b{padding:10px 12px;max-height:520px;overflow:auto}
.out pre{margin:0;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.err{color:var(--bad)}
.tests{list-style:none;margin:0;padding:0}
.tests li{border-bottom:1px solid var(--line);padding:7px 0}
.tests li:last-child{border:0}
.tests .ex{font:12.5px var(--mono);overflow-wrap:anywhere}
.tests .cmp{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0 24px;font-size:12px}
.tests .cmp pre{background:var(--panel2);padding:4px 8px;border-radius:6px}
.pass{color:var(--ok);font-weight:700} .fail{color:var(--bad);font-weight:700}
.banner{padding:12px 14px;border-radius:10px;margin:10px 0;font-weight:500}
.banner.ok{background:var(--okbg);color:var(--ok)} .banner.bad{background:var(--badbg);color:var(--bad)}
.hint{background:color-mix(in srgb,#f5b301 14%,var(--panel));border:1px solid color-mix(in srgb,#f5b301 40%,transparent);padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.sol pre.code{max-height:380px}
table.res{border-collapse:collapse;font:12.5px var(--mono);width:max-content;min-width:100%}
table.res th,table.res td{border:1px solid var(--line);padding:3px 8px;text-align:left;white-space:nowrap}
table.res th{background:var(--panel2);position:sticky;top:0}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:8px 0}
.tbl{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;background:var(--bg)}
.tbl b{font-family:var(--mono)}
.tbl .cols{font-family:var(--mono);color:var(--muted);line-height:1.5;margin-top:4px}
details summary{cursor:pointer;font-weight:600;font-size:14px}
/* tutor */
.tutor{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel)}
.tutor .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tutor input{flex:1;min-width:180px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;font-size:14px}
.tutor .ans{margin-top:10px;font-size:14px}
.tutor .ans pre{background:var(--ed);color:var(--edink);padding:10px;border-radius:8px;overflow:auto;font:12.5px/1.5 var(--mono)}
/* plan */
.hero{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;margin-bottom:18px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:30px;margin:0 0 6px;letter-spacing:-.03em}
.hour{display:grid;grid-template-columns:62px 1fr;gap:6px 10px;font-size:14px;margin-top:8px}
.hour > b{font-family:var(--mono);color:var(--py)}
.pbar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:10px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--py),var(--pd))}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.week h3{margin:0;font-size:16px}
.week .goal{font-size:13.5px;color:var(--muted);margin:4px 0 10px}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dchip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;height:52px;border-radius:9px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:12px;background:var(--bg);position:relative}
.dchip .num{font-weight:700;font-size:14px}
.dchip .tr{width:18px;height:4px;border-radius:2px}
.dchip.done{background:var(--okbg);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.dchip.done::after{content:"✓";position:absolute;top:2px;right:5px;color:var(--ok);font-weight:700;font-size:11px}
.dchip.today{outline:2px solid var(--py);outline-offset:1px}
.dlist{margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.dlist li{display:flex;gap:8px;padding:2px 0}
.dlist li span:first-child{font-family:var(--mono);color:var(--muted);min-width:22px}
.res a{font-size:13px;margin-right:10px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin:6px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:1000px){.pg{grid-template-columns:1fr}}
.sync{font-size:12px}
.foot{margin:30px 0 10px;text-align:center;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#plan">daily<span>code</span></a>
  <nav>
    <a href="#today" data-nav="today">Today</a>
    <a href="#plan" data-nav="plan">Plan</a>
    <a href="#playground" data-nav="playground">Playground</a>
  </nav>
  <div class="stats">
    <span class="chip" id="streak" title="Days in a row with at least one problem solved">🔥 0</span>
    <span class="chip" id="prog">0 / 84 days</span>
    <span class="chip" id="engine">Python: loading…</span>
    <span class="sync muted" id="sync"></span>
  </div>
</header>
<main id="app"></main>
<div class="foot">Your code runs in your browser (Pyodide + SQLite). Nothing is sent anywhere unless you ask Claude for help.</div>

<script type="application/json" id="content">{"days": [{"n": 1, "week": 1, "track": "py", "title": "Variables, types & your first function", "learn": "<p>Python runs top to bottom, one line at a time. A <strong>variable<\/strong> is just a name that points at a value. You don't declare types, Python works them out.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>name = &quot;Rishitha&quot;      # str  (text)\nyears = 3              # int  (whole number)\nrate = 7.5             # float (decimal)\nis_active = True       # bool (True / False)\nprint(type(rate))      # &lt;class &#x27;float&#x27;&gt;<\/code><\/pre>\n<p><strong>Arithmetic:<\/strong> <code>+ - * /<\/code>, plus <code>//<\/code> (floor division), <code>%<\/code> (remainder) and <code>**<\/code> (power). <code>7 / 2<\/code> is <code>3.5<\/code>, <code>7 // 2<\/code> is <code>3<\/code>, <code>7 % 2<\/code> is <code>1<\/code>.<\/p>\n<p><strong>f-strings<\/strong> put values into text: <code>f&quot;{name} has {years} years of SQL&quot;<\/code>. Use <code>f&quot;{rate:.2f}&quot;<\/code> for 2 decimal places.<\/p>\n<p><strong>Functions.<\/strong> Every exercise on this site asks you to write one. A function takes inputs and <code>return<\/code>s an output:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def area(width, height):\n    result = width * height\n    return result\n\narea(3, 4)   # 12<\/code><\/pre>\n<p>The body of a function is <strong>indented<\/strong> (4 spaces). <code>return<\/code> hands the value back to whoever called the function. <code>print<\/code> only shows it on screen. The checker looks at what you <code>return<\/code>.<\/p>\n<div class=\"bridge\">SQL bridge: a Python function is like a scalar UDF. <code>def area(w, h): return w*h<\/code> behaves like <code>SELECT w*h<\/code>.<\/div>", "stretch": "Write <code>bmi(weight_kg, height_m)<\/code> that returns the BMI rounded to 1 decimal using <code>round(x, 1)<\/code>.", "problems": [{"kind": "py", "title": "Say hello", "task": "<p>Write <code>greet(name)<\/code> that <strong>returns<\/strong> the text <code>Hello, &lt;name&gt;!<\/code>.<\/p>\n<p><code>greet(&quot;Rishitha&quot;)<\/code> → <code>&quot;Hello, Rishitha!&quot;<\/code><\/p>", "hint": "Use an f-string: f\"Hello, {name}!\" and put <code>return<\/code> in front of it.", "solution": "def greet(name):\n    return f\"Hello, {name}!\"", "starter": "def greet(name):\n    # build the text with an f-string and return it\n    pass", "tests": ["greet('Rishitha')", "greet('Python')", "greet('')"], "setup": ""}, {"kind": "py", "title": "Minutes to hours", "task": "<p>Write <code>format_duration(minutes)<\/code> that turns a number of minutes into text like <code>&quot;2h 5m&quot;<\/code>.<\/p>\n<ul><li><code>format_duration(125)<\/code> → <code>&quot;2h 5m&quot;<\/code><\/li><li><code>format_duration(59)<\/code> → <code>&quot;0h 59m&quot;<\/code><\/li><\/ul>", "hint": "<code>minutes // 60<\/code> gives the whole hours and <code>minutes % 60<\/code> gives the minutes left over.", "solution": "def format_duration(minutes):\n    hours = minutes // 60\n    mins = minutes % 60\n    return f\"{hours}h {mins}m\"", "starter": "def format_duration(minutes):\n    hours = 0      # fix me: use //\n    mins = 0       # fix me: use %\n    return f\"{hours}h {mins}m\"", "tests": ["format_duration(125)", "format_duration(60)", "format_duration(59)", "format_duration(0)", "format_duration(1441)"], "setup": ""}]}, {"n": 2, "week": 1, "track": "py", "title": "Strings: indexing, slicing & methods", "learn": "<p>A string is a <strong>sequence of characters<\/strong>, and you can pick pieces out of it by position. Positions start at <strong>0<\/strong>. Negative positions count from the end.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>s = &quot;Hyderabad&quot;\ns[0]       # &#x27;H&#x27;\ns[-1]      # &#x27;d&#x27;\ns[0:4]     # &#x27;Hyde&#x27;   (start included, stop excluded)\ns[4:]      # &#x27;rabad&#x27;\ns[::-1]    # &#x27;dabaredyH&#x27;  (step -1 reverses)\nlen(s)     # 9<\/code><\/pre>\n<p>Useful methods (each returns a <strong>new<\/strong> string, because strings can't be changed in place):<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>&quot;  hi  &quot;.strip()          # &#x27;hi&#x27;\n&quot;data&quot;.upper()            # &#x27;DATA&#x27;\n&quot;a,b,c&quot;.split(&quot;,&quot;)        # [&#x27;a&#x27;, &#x27;b&#x27;, &#x27;c&#x27;]\n&quot;-&quot;.join([&quot;a&quot;, &quot;b&quot;])      # &#x27;a-b&#x27;\n&quot;banana&quot;.replace(&quot;a&quot;, &quot;o&quot;)# &#x27;bonono&#x27;\n&quot;ICIC0001&quot;.startswith(&quot;ICIC&quot;)  # True\n&quot;*&quot; * 5                   # &#x27;*****&#x27;<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: <code>UPPER()<\/code> → <code>.upper()<\/code>, <code>TRIM()<\/code> → <code>.strip()<\/code>, <code>SUBSTR(s, 1, 4)<\/code> → <code>s[0:4]<\/code>, <code>s LIKE &#x27;abc%&#x27;<\/code> → <code>s.startswith(&#x27;abc&#x27;)<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Mask an account number", "task": "<p>Banks show only the last 4 digits. Write <code>mask_account(acc)<\/code> that replaces every character <strong>except the last 4<\/strong> with <code>*<\/code>.<\/p>\n<ul><li><code>mask_account(&quot;123456789012&quot;)<\/code> → <code>&quot;********9012&quot;<\/code><\/li><li><code>mask_account(&quot;1234&quot;)<\/code> → <code>&quot;1234&quot;<\/code><\/li><\/ul>", "hint": "<code>acc[-4:]<\/code> is the last 4 characters. How many stars do you need? <code>len(acc) - 4<\/code>. And <code>&#x27;*&#x27; * 3<\/code> is <code>&#x27;***&#x27;<\/code>.", "solution": "def mask_account(acc):\n    return \"*\" * (len(acc) - 4) + acc[-4:]", "starter": "def mask_account(acc):\n    pass", "tests": ["mask_account('123456789012')", "mask_account('1234')", "mask_account('98765')", "mask_account('0000111122223333')"], "setup": ""}, {"kind": "py", "title": "Palindrome check", "task": "<p>Write <code>is_palindrome(s)<\/code> that returns <code>True<\/code> if <code>s<\/code> reads the same forwards and backwards, <strong>ignoring spaces and upper/lower case<\/strong>.<\/p>\n<ul><li><code>is_palindrome(&quot;Racecar&quot;)<\/code> → <code>True<\/code><\/li><li><code>is_palindrome(&quot;nurses run&quot;)<\/code> → <code>True<\/code><\/li><\/ul>", "hint": "Clean first with <code>.replace(&#x27; &#x27;, &#x27;&#x27;).lower()<\/code>, then compare the string with its reverse <code>[::-1]<\/code>.", "solution": "def is_palindrome(s):\n    cleaned = s.replace(\" \", \"\").lower()\n    return cleaned == cleaned[::-1]", "starter": "def is_palindrome(s):\n    cleaned = s  # remove spaces and lowercase\n    pass", "tests": ["is_palindrome('Racecar')", "is_palindrome('nurses run')", "is_palindrome('python')", "is_palindrome('A man a plan a canal Panama')", "is_palindrome('ab')"], "setup": ""}]}, {"n": 3, "week": 1, "track": "py", "title": "Making decisions: if / elif / else", "learn": "<pre class=\"code\" data-lang=\"python\"><code>score = 82\nif score &gt;= 90:\n    grade = &quot;A&quot;\nelif score &gt;= 80:\n    grade = &quot;B&quot;\nelse:\n    grade = &quot;C&quot;<\/code><\/pre>\n<ul><li>Comparisons: <code>==  !=  &lt;  &lt;=  &gt;  &gt;=<\/code><\/li><li>Combine them with <code>and<\/code>, <code>or<\/code>, <code>not<\/code>.<\/li><li><strong>Truthiness:<\/strong> <code>0<\/code>, <code>&quot;&quot;<\/code>, <code>[]<\/code>, <code>{}<\/code> and <code>None<\/code> all count as False. Everything else counts as True.<\/li><li>One-liner: <code>label = &quot;even&quot; if n % 2 == 0 else &quot;odd&quot;<\/code><\/li><\/ul>\n<p>Python checks the branches <strong>from top to bottom<\/strong> and runs only the first one that matches. Order matters.<\/p>\n<div class=\"bridge\">SQL bridge: <code>CASE WHEN score &gt;= 90 THEN &#x27;A&#x27; WHEN score &gt;= 80 THEN &#x27;B&#x27; ELSE &#x27;C&#x27; END<\/code> is exactly an if/elif/else chain.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Letter grades", "task": "<p>Write <code>grade(score)<\/code> that returns: <code>&#x27;A&#x27;<\/code> for 90+, <code>&#x27;B&#x27;<\/code> for 80–89, <code>&#x27;C&#x27;<\/code> for 70–79, <code>&#x27;D&#x27;<\/code> for 60–69, <code>&#x27;F&#x27;<\/code> below 60.<\/p>", "hint": "Check the highest band first: <code>if score &gt;= 90<\/code>, then <code>elif score &gt;= 80<\/code>, and so on.", "solution": "def grade(score):\n    if score >= 90:\n        return \"A\"\n    elif score >= 80:\n        return \"B\"\n    elif score >= 70:\n        return \"C\"\n    elif score >= 60:\n        return \"D\"\n    return \"F\"", "starter": "def grade(score):\n    pass", "tests": ["grade(95)", "grade(90)", "grade(85)", "grade(72)", "grade(60)", "grade(59)", "grade(0)"], "setup": ""}, {"kind": "py", "title": "Leap years", "task": "<p>Write <code>is_leap_year(year)<\/code>. A year is a leap year if it is divisible by 4, <strong>except<\/strong> years divisible by 100, <strong>unless<\/strong> they're also divisible by 400.<\/p>\n<p>2024 → True, 1900 → False, 2000 → True.<\/p>", "hint": "<code>year % 4 == 0<\/code> means divisible by 4. Combine: divisible by 4 AND (not divisible by 100 OR divisible by 400).", "solution": "def is_leap_year(year):\n    return year % 4 == 0 and (year % 100 != 0 or year % 400 == 0)", "starter": "def is_leap_year(year):\n    pass", "tests": ["is_leap_year(2024)", "is_leap_year(1900)", "is_leap_year(2000)", "is_leap_year(2023)", "is_leap_year(2100)"], "setup": ""}]}, {"n": 4, "week": 1, "track": "py", "title": "Loops: for, while & the accumulator pattern", "learn": "<pre class=\"code\" data-lang=\"python\"><code>for i in range(5):          # 0,1,2,3,4\n    print(i)\n\nfor i in range(1, 11, 2):   # 1,3,5,7,9  (start, stop, step)\n    ...\n\nfor ch in &quot;hello&quot;:          # loop over any sequence\n    ...\n\nn = 10\nwhile n &gt; 0:                # repeat while a condition is True\n    n -= 3<\/code><\/pre>\n<ul><li><code>break<\/code> leaves the loop and <code>continue<\/code> skips to the next item.<\/li><li><strong>Accumulator pattern.<\/strong> Start with an empty total, then update it inside the loop:<\/li><\/ul>\n<pre class=\"code\" data-lang=\"python\"><code>total = 0\nfor x in [4, 8, 15]:\n    total += x       # same as total = total + x<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: an accumulator is how you'd write <code>SUM()<\/code> or <code>COUNT()<\/code> by hand.<\/div>", "stretch": "Classic FizzBuzz: write <code>fizzbuzz(n)<\/code> returning a list of strings from 1..n where multiples of 3 are 'Fizz', of 5 'Buzz', of both 'FizzBuzz'.", "problems": [{"kind": "py", "title": "Sum of evens", "task": "<p>Write <code>sum_of_evens(n)<\/code> returning the sum of all even numbers from 1 to <code>n<\/code> (inclusive).<\/p>\n<p><code>sum_of_evens(10)<\/code> → <code>30<\/code> (2+4+6+8+10)<\/p>", "hint": "<code>range(1, n + 1)<\/code> includes n. Inside the loop, add <code>i<\/code> only when <code>i % 2 == 0<\/code>.", "solution": "def sum_of_evens(n):\n    total = 0\n    for i in range(1, n + 1):\n        if i % 2 == 0:\n            total += i\n    return total", "starter": "def sum_of_evens(n):\n    total = 0\n    # loop here\n    return total", "tests": ["sum_of_evens(10)", "sum_of_evens(1)", "sum_of_evens(2)", "sum_of_evens(7)", "sum_of_evens(100)"], "setup": ""}, {"kind": "py", "title": "Count vowels", "task": "<p>Write <code>count_vowels(s)<\/code> returning how many vowels (a, e, i, o, u, either case) are in <code>s<\/code>.<\/p>", "hint": "Loop over <code>s.lower()<\/code>. <code>ch in &#x27;aeiou&#x27;<\/code> is True when ch is a vowel.", "solution": "def count_vowels(s):\n    count = 0\n    for ch in s.lower():\n        if ch in \"aeiou\":\n            count += 1\n    return count", "starter": "def count_vowels(s):\n    pass", "tests": ["count_vowels('Hyderabad')", "count_vowels('SQL')", "count_vowels('')", "count_vowels('AEIOU aeiou')", "count_vowels('rhythm')"], "setup": ""}]}, {"n": 5, "week": 1, "track": "py", "title": "Lists: your first data structure", "learn": "<p>A list is an <strong>ordered, changeable<\/strong> collection.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>nums = [5, 3, 8]\nnums.append(1)      # [5, 3, 8, 1]\nnums[0]             # 5\nnums[-1]            # 1\nnums[1:3]           # [3, 8]\nnums.pop()          # removes and returns the last item\nlen(nums), sum(nums), min(nums), max(nums)\n8 in nums           # True\nsorted(nums)        # new sorted list  (nums is unchanged)\nnums.sort()         # sorts nums itself<\/code><\/pre>\n<p>Loop with positions using <code>enumerate<\/code>:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>for i, x in enumerate([&quot;a&quot;, &quot;b&quot;]):\n    print(i, x)     # 0 a, then 1 b<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: a list is like a one-column result set. <code>running_total<\/code> below is <code>SUM(x) OVER (ORDER BY ...)<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Second largest", "task": "<p>Write <code>second_largest(nums)<\/code> returning the <strong>second-largest distinct<\/strong> value, or <code>None<\/code> if there isn't one.<\/p>\n<ul><li><code>[3, 1, 4, 1, 5]<\/code> → <code>4<\/code><\/li><li><code>[5, 5, 5]<\/code> → <code>None<\/code><\/li><\/ul>", "hint": "First build a list of distinct values (skip x if it's already <code>in<\/code> the list), sort it, then take index -2.", "solution": "def second_largest(nums):\n    distinct = []\n    for x in nums:\n        if x not in distinct:\n            distinct.append(x)\n    distinct.sort()\n    if len(distinct) < 2:\n        return None\n    return distinct[-2]", "starter": "def second_largest(nums):\n    pass", "tests": ["second_largest([3, 1, 4, 1, 5])", "second_largest([5, 5, 5])", "second_largest([2, 8])", "second_largest([-1, -3, -2])", "second_largest([7])"], "setup": ""}, {"kind": "py", "title": "Running total", "task": "<p>Write <code>running_total(nums)<\/code> that returns a new list where each element is the sum of everything up to and including that position.<\/p>\n<p><code>[1, 2, 3, 4]<\/code> → <code>[1, 3, 6, 10]<\/code><\/p>", "hint": "Keep a <code>total<\/code> variable. In each loop step, add x to it and <code>append<\/code> the total to the result.", "solution": "def running_total(nums):\n    result = []\n    total = 0\n    for x in nums:\n        total += x\n        result.append(total)\n    return result", "starter": "def running_total(nums):\n    result = []\n    return result", "tests": ["running_total([1, 2, 3, 4])", "running_total([])", "running_total([5])", "running_total([10, -5, 2])"], "setup": ""}]}, {"n": 6, "week": 1, "track": "pd", "title": "NumPy basics: arrays & vectorisation", "learn": "<p>NumPy arrays hold numbers of <strong>one type<\/strong> in a tight block of memory, and the maths runs in fast C code. <strong>No Python loops needed.<\/strong><\/p>\n<pre class=\"code\" data-lang=\"python\"><code>import numpy as np\na = np.array([10, 20, 30, 40])\na.shape, a.dtype        # (4,), int64\na * 2                   # array([20, 40, 60, 80])  (operates on every element)\na + a, a ** 2, np.sqrt(a)\na.sum(), a.mean(), a.max(), a.std()\na[a &gt; 15]               # boolean mask → array([20, 30, 40])\n(a &gt; 15).sum()          # True counts as 1, so this counts matches: 3\nnp.arange(0, 10, 2), np.zeros(3), np.linspace(0, 1, 5)<\/code><\/pre>\n<p>This <strong>vectorised<\/strong> style of thinking (operate on whole columns at once) is exactly how SQL works, and it's how pandas works on top of NumPy.<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Min-max normalise", "task": "<p>Write <code>normalize(arr)<\/code> returning <code>(arr - min) / (max - min)<\/code> as a NumPy array. No loops.<\/p>", "hint": "arr.min() and arr.max() are single numbers, and subtracting them from arr applies to every element.", "solution": "import numpy as np\n\ndef normalize(arr):\n    return (arr - arr.min()) / (arr.max() - arr.min())", "starter": "import numpy as np\n\ndef normalize(arr):\n    pass", "tests": ["normalize(np.array([10, 20, 30]))", "normalize(np.array([5, 0, 10, 2.5]))", "normalize(np.array([-1.0, 1.0]))"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nimport numpy as np"}, {"kind": "pd", "title": "Count above the mean", "task": "<p>Write <code>count_above_mean(arr)<\/code> returning how many elements are strictly greater than the mean (as an int).<\/p>", "hint": "<code>arr &gt; arr.mean()<\/code> is an array of booleans. <code>.sum()<\/code> counts the Trues.", "solution": "import numpy as np\n\ndef count_above_mean(arr):\n    return int((arr > arr.mean()).sum())", "starter": "import numpy as np\n\ndef count_above_mean(arr):\n    pass", "tests": ["count_above_mean(np.array([1, 2, 3, 4, 100]))", "count_above_mean(np.array([5, 5, 5]))", "count_above_mean(np.array([1, 2, 3, 4]))"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nimport numpy as np"}]}, {"n": 7, "week": 1, "track": "sql", "title": "SQL warm-up on the bank dataset", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>Today: joins and aggregates, to get to know the data. Explore it in the <strong>Tables<\/strong> panel first, or run <code>SELECT * FROM transactions LIMIT 10<\/code>.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Balance by branch city", "task": "<p>Return each branch <code>city<\/code> and its <code>total_balance<\/code> (sum of account balances), <strong>ordered by<\/strong> total_balance descending.<\/p>", "hint": "Join accounts to branches on branch_id, then GROUP BY city.", "solution": "SELECT b.city, SUM(a.balance) AS total_balance\nFROM accounts a\nJOIN branches b ON b.branch_id = a.branch_id\nGROUP BY b.city\nORDER BY total_balance DESC;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "2024 joiners with multiple accounts", "task": "<p>Customers who <strong>joined in 2024<\/strong> and hold <strong>more than one<\/strong> account: <code>name, num_accounts<\/code>.<\/p>", "hint": "Dates are stored as 'YYYY-MM-DD' text, so ranges compare correctly. Use HAVING for the count.", "solution": "SELECT c.name, COUNT(*) AS num_accounts\nFROM customers c\nJOIN accounts a ON a.customer_id = c.customer_id\nWHERE c.join_date >= '2024-01-01' AND c.join_date < '2025-01-01'\nGROUP BY c.customer_id, c.name\nHAVING COUNT(*) > 1;", "starter": "-- Write your query here\nSELECT ", "ordered": false}, {"kind": "sql", "title": "Channel mix", "task": "<p>For each <code>channel<\/code>: <code>channel, txn_count, total_amount<\/code>, <strong>ordered by<\/strong> total_amount descending.<\/p>", "hint": "A simple GROUP BY channel.", "solution": "SELECT channel, COUNT(*) AS txn_count, SUM(amount) AS total_amount\nFROM transactions\nGROUP BY channel\nORDER BY total_amount DESC;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 8, "week": 2, "track": "py", "title": "Dictionaries: key → value lookups", "learn": "<p>A dict maps <strong>keys<\/strong> to <strong>values<\/strong>. Looking up a key is instant, however big the dict gets.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>balances = {&quot;101&quot;: 52000, &quot;102&quot;: 180000}\nbalances[&quot;101&quot;]                 # 52000\nbalances.get(&quot;999&quot;, 0)          # 0  (default instead of an error)\nbalances[&quot;103&quot;] = 410000        # add / update\n&quot;101&quot; in balances               # True  (checks keys)\nfor acc, bal in balances.items():\n    print(acc, bal)<\/code><\/pre>\n<p><strong>Counting pattern.<\/strong> You will use this one constantly:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>counts = {}\nfor word in [&quot;upi&quot;, &quot;atm&quot;, &quot;upi&quot;]:\n    counts[word] = counts.get(word, 0) + 1\n# {&#x27;upi&#x27;: 2, &#x27;atm&#x27;: 1}<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: a dict is like an index on a primary key. The counting pattern is <code>SELECT word, COUNT(*) ... GROUP BY word<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Word count", "task": "<p>Write <code>word_count(text)<\/code> returning a dict of each <strong>lowercased<\/strong> word → how many times it appears. Words are separated by whitespace.<\/p>\n<p><code>word_count(&quot;the cat and the hat&quot;)<\/code> → <code>{&#x27;the&#x27;: 2, &#x27;cat&#x27;: 1, &#x27;and&#x27;: 1, &#x27;hat&#x27;: 1}<\/code><\/p>", "hint": "<code>text.lower().split()<\/code> gives the words. Then use <code>counts[w] = counts.get(w, 0) + 1<\/code>.", "solution": "def word_count(text):\n    counts = {}\n    for w in text.lower().split():\n        counts[w] = counts.get(w, 0) + 1\n    return counts", "starter": "def word_count(text):\n    counts = {}\n    return counts", "tests": ["word_count('the cat and the hat')", "word_count('')", "word_count('Data data DATA')", "word_count('upi  atm upi')"], "setup": ""}, {"kind": "py", "title": "Invert a dict", "task": "<p>Write <code>invert(d)<\/code> that swaps keys and values. Assume all values are unique.<\/p>\n<p><code>invert({&#x27;a&#x27;: 1, &#x27;b&#x27;: 2})<\/code> → <code>{1: &#x27;a&#x27;, 2: &#x27;b&#x27;}<\/code><\/p>", "hint": "Loop <code>for k, v in d.items():<\/code> and set <code>result[v] = k<\/code>.", "solution": "def invert(d):\n    result = {}\n    for k, v in d.items():\n        result[v] = k\n    return result", "starter": "def invert(d):\n    pass", "tests": ["invert({'a': 1, 'b': 2})", "invert({})", "invert({'HYD': 'Hyderabad', 'BLR': 'Bengaluru'})"], "setup": ""}]}, {"n": 9, "week": 2, "track": "py", "title": "Tuples & sets", "learn": "<p><strong>Tuples<\/strong> are like lists that can't be changed. Use them for fixed groups of values, and to return several values at once.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>point = (3, 4)\nx, y = point            # unpacking\ndef min_and_max(a):\n    return min(a), max(a)   # returns a tuple\nlo, hi = min_and_max([4, 1, 9])<\/code><\/pre>\n<p><strong>Sets<\/strong> hold <strong>unique, unordered<\/strong> values. Checking membership is instant.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>s = set([1, 2, 2, 3])   # {1, 2, 3}\ns.add(4)\na, b = {1, 2, 3}, {2, 3, 4}\na &amp; b   # {2, 3}       intersection\na | b   # {1, 2, 3, 4} union\na - b   # {1}          difference<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: <code>&amp;<\/code> is <code>INTERSECT<\/code>, <code>|<\/code> is <code>UNION<\/code>, <code>-<\/code> is <code>EXCEPT<\/code>, and <code>set(x)<\/code> is <code>SELECT DISTINCT<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Common elements", "task": "<p>Write <code>common_elements(a, b)<\/code> returning a <strong>sorted list<\/strong> of the values that appear in both lists, with no duplicates.<\/p>", "hint": "Turn both lists into sets, intersect with <code>&amp;<\/code>, then <code>sorted(...)<\/code> gives back a list.", "solution": "def common_elements(a, b):\n    return sorted(set(a) & set(b))", "starter": "def common_elements(a, b):\n    pass", "tests": ["common_elements([1, 2, 3, 4], [3, 4, 5])", "common_elements([1, 1, 2], [1])", "common_elements([], [1, 2])", "common_elements(['upi', 'atm'], ['card', 'upi'])"], "setup": ""}, {"kind": "py", "title": "Min and max together", "task": "<p>Write <code>min_max(nums)<\/code> that returns a tuple <code>(smallest, largest)<\/code>. <strong>Challenge:<\/strong> don't use <code>min()<\/code> or <code>max()<\/code>. Loop once and track both.<\/p>", "hint": "Start both at nums[0], then for each x: if x is smaller than smallest, replace it; same for largest.", "solution": "def min_max(nums):\n    smallest = largest = nums[0]\n    for x in nums:\n        if x < smallest:\n            smallest = x\n        if x > largest:\n            largest = x\n    return smallest, largest", "starter": "def min_max(nums):\n    smallest = nums[0]\n    largest = nums[0]\n    # loop and update\n    return smallest, largest", "tests": ["min_max([3, 1, 4, 1, 5])", "min_max([7])", "min_max([-2, -9, 0])"], "setup": ""}]}, {"n": 10, "week": 2, "track": "py", "title": "Functions, deeper", "learn": "<pre class=\"code\" data-lang=\"python\"><code>def power(base, exp=2):          # default value\n    return base ** exp\n\npower(3)            # 9\npower(2, 10)        # 1024\npower(exp=3, base=2)  # keyword arguments: any order\n\ndef total(*nums):               # any number of positional args → a tuple\n    return sum(nums)\ntotal(1, 2, 3)                   # 6\n\ndef tag(name, **attrs):         # any keyword args → a dict\n    return attrs\ntag(&quot;div&quot;, id=&quot;main&quot;)           # {&#x27;id&#x27;: &#x27;main&#x27;}<\/code><\/pre>\n<ul><li><strong>Scope:<\/strong> variables created inside a function exist only inside it.<\/li><li><strong>Docstrings:<\/strong> put a string right under <code>def<\/code> to describe what the function does.<\/li><li>⚠️ Never use a mutable default like <code>def f(x=[])<\/code>. That one list is shared between calls. Use <code>x=None<\/code> and create the list inside.<\/li><\/ul>", "stretch": null, "problems": [{"kind": "py", "title": "Power with a default", "task": "<p>Write <code>power(base, exp=2)<\/code> returning <code>base<\/code> raised to <code>exp<\/code>.<\/p>", "hint": "Use the <code>**<\/code> operator.", "solution": "def power(base, exp=2):\n    return base ** exp", "starter": "def power(base, exp=2):\n    pass", "tests": ["power(3)", "power(2, 10)", "power(exp=3, base=2)", "power(5, 0)"], "setup": ""}, {"kind": "py", "title": "Average of anything", "task": "<p>Write <code>average(*nums)<\/code> returning the mean of all arguments, or <code>0<\/code> if none are given.<\/p>", "hint": "<code>nums<\/code> is a tuple. If it's empty (<code>not nums<\/code>), return 0; otherwise <code>sum(nums) / len(nums)<\/code>.", "solution": "def average(*nums):\n    if not nums:\n        return 0\n    return sum(nums) / len(nums)", "starter": "def average(*nums):\n    pass", "tests": ["average(1, 2, 3)", "average()", "average(10)", "average(1, 2)"], "setup": ""}, {"kind": "py", "title": "Build a profile", "task": "<p>Write <code>build_profile(name, **details)<\/code> returning a dict containing <code>&#x27;name&#x27;<\/code> plus every keyword argument.<\/p>\n<p><code>build_profile(&#x27;Rishitha&#x27;, role=&#x27;Data Engineer&#x27;)<\/code> → <code>{&#x27;name&#x27;: &#x27;Rishitha&#x27;, &#x27;role&#x27;: &#x27;Data Engineer&#x27;}<\/code><\/p>", "hint": "Start with <code>{&#x27;name&#x27;: name}<\/code> and add the <code>details<\/code> dict to it with <code>.update(details)<\/code>.", "solution": "def build_profile(name, **details):\n    profile = {\"name\": name}\n    profile.update(details)\n    return profile", "starter": "def build_profile(name, **details):\n    pass", "tests": ["build_profile('Rishitha', role='Data Engineer')", "build_profile('A')", "build_profile('B', city='Hyderabad', years=3)"], "setup": ""}]}, {"n": 11, "week": 2, "track": "py", "title": "Comprehensions: SELECT ... WHERE in one line", "learn": "<p>A comprehension builds a list, dict or set in a single expression:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>nums = [1, 2, 3, 4, 5]\n[x * x for x in nums]               # [1, 4, 9, 16, 25]\n[x for x in nums if x % 2 == 0]     # [2, 4]\n{w: len(w) for w in [&quot;upi&quot;, &quot;neft&quot;]}  # {&#x27;upi&#x27;: 3, &#x27;neft&#x27;: 4}\n{x % 3 for x in nums}               # {0, 1, 2}\n[c for row in [[1, 2], [3]] for c in row]  # [1, 2, 3]  (nested)<\/code><\/pre>\n<p>Read it left to right as **\"give me <code>expr<\/code> for each <code>x<\/code> in <code>items<\/code> where <code>cond<\/code>\"**.<\/p>\n<div class=\"bridge\">SQL bridge: <code>[x*x for x in nums if x &gt; 2]<\/code> ≈ <code>SELECT x*x FROM nums WHERE x &gt; 2<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Squares of odds", "task": "<p>Write <code>squares_of_odds(nums)<\/code> returning a list of the squares of the odd numbers, in order. Use a comprehension.<\/p>", "hint": "<code>[x * x for x in nums if x % 2 == 1]<\/code>. Note that <code>-3 % 2<\/code> is 1 in Python.", "solution": "def squares_of_odds(nums):\n    return [x * x for x in nums if x % 2 == 1]", "starter": "def squares_of_odds(nums):\n    return []", "tests": ["squares_of_odds([1, 2, 3, 4, 5])", "squares_of_odds([])", "squares_of_odds([2, 4])", "squares_of_odds([-3, 7])"], "setup": ""}, {"kind": "py", "title": "Word lengths", "task": "<p>Write <code>word_lengths(words)<\/code> returning a dict mapping each word to its length (dict comprehension).<\/p>", "hint": "<code>{w: len(w) for w in words}<\/code>", "solution": "def word_lengths(words):\n    return {w: len(w) for w in words}", "starter": "def word_lengths(words):\n    return {}", "tests": ["word_lengths(['upi', 'neft', 'rtgs'])", "word_lengths([])", "word_lengths(['a'])"], "setup": ""}, {"kind": "py", "title": "Flatten a matrix", "task": "<p>Write <code>flatten(matrix)<\/code> turning a list of lists into one flat list, row by row.<\/p>", "hint": "Nested comprehension: <code>[x for row in matrix for x in row]<\/code>. The <code>for<\/code> clauses go in the same order as nested loops.", "solution": "def flatten(matrix):\n    return [x for row in matrix for x in row]", "starter": "def flatten(matrix):\n    return []", "tests": ["flatten([[1, 2], [3, 4], [5]])", "flatten([])", "flatten([[], [1]])"], "setup": ""}]}, {"n": 12, "week": 2, "track": "py", "title": "Errors & exceptions", "learn": "<p>When something goes wrong, Python <strong>raises<\/strong> an exception. Read a traceback <strong>from the bottom up<\/strong>: the last line tells you the error type and the message.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>try:\n    value = int(&quot;abc&quot;)\nexcept ValueError as e:\n    print(&quot;Not a number:&quot;, e)\nelse:\n    print(&quot;ran only if no error&quot;)\nfinally:\n    print(&quot;always runs&quot;)<\/code><\/pre>\n<p>Common ones: <code>ValueError<\/code> (right type, bad value), <code>TypeError<\/code> (wrong type), <code>KeyError<\/code> (missing dict key), <code>IndexError<\/code>, <code>ZeroDivisionError<\/code>.<\/p>\n<p><strong>Raise your own<\/strong> to reject bad input:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def withdraw(balance, amount):\n    if amount &gt; balance:\n        raise ValueError(&quot;Insufficient funds&quot;)\n    return balance - amount<\/code><\/pre>", "stretch": null, "problems": [{"kind": "py", "title": "Safe divide", "task": "<p>Write <code>safe_divide(a, b)<\/code> that returns <code>a / b<\/code>, or <code>None<\/code> if <code>b<\/code> is zero. Use try/except.<\/p>", "hint": "Put <code>return a / b<\/code> inside <code>try:<\/code> and catch <code>ZeroDivisionError<\/code>.", "solution": "def safe_divide(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None", "starter": "def safe_divide(a, b):\n    pass", "tests": ["safe_divide(10, 4)", "safe_divide(1, 0)", "safe_divide(0, 5)"], "setup": ""}, {"kind": "py", "title": "Validate an age", "task": "<p>Write <code>parse_age(text)<\/code> that converts text to an int age (ignore surrounding spaces). Raise <code>ValueError<\/code> if it's not a whole number, or if it's negative or over 150.<\/p>", "hint": "<code>int(&#x27;abc&#x27;)<\/code> raises ValueError on its own. After converting, <code>raise ValueError(...)<\/code> if age &lt; 0 or age &gt; 150.", "solution": "def parse_age(text):\n    age = int(text.strip())   # int() already raises ValueError for 'abc'\n    if age < 0 or age > 150:\n        raise ValueError(\"age out of range\")\n    return age", "starter": "def parse_age(text):\n    pass", "tests": ["parse_age(' 42 ')", "parse_age('0')", "_raises(lambda: parse_age('abc'), ValueError)", "_raises(lambda: parse_age('-5'), ValueError)", "_raises(lambda: parse_age('200'), ValueError)"], "setup": ""}]}, {"n": 13, "week": 2, "track": "pd", "title": "pandas intro: Series, DataFrames & filtering", "learn": "<p>A <strong>DataFrame<\/strong> is a table, and each column is a <strong>Series<\/strong> (a labelled NumPy array). These DataFrames are preloaded on every pandas day: <code>txns<\/code>, <code>accounts<\/code>, <code>customers<\/code>, <code>branches<\/code>. They hold the same data as the SQL tables. Try <code>print(txns.head())<\/code> and click <strong>Run<\/strong>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>txns.shape, txns.dtypes, txns.head()\ntxns[&quot;amount&quot;]                       # one column → Series\ntxns[[&quot;txn_id&quot;, &quot;amount&quot;]]           # several columns → DataFrame\ntxns[txns[&quot;amount&quot;] &gt; 3000]          # filter rows (a boolean mask, like NumPy)\ntxns[(txns.txn_type == &quot;DEBIT&quot;) &amp; (txns.amount &gt; 3000)]   # &amp; | ~, and wrap each condition in ( )\ntxns.loc[txns.amount &gt; 3000, [&quot;txn_id&quot;, &quot;amount&quot;]]        # .loc[rows, cols]\ntxns.iloc[0:5]                       # by position\ntxns[&quot;double&quot;] = txns[&quot;amount&quot;] * 2  # new column\nnp.where(cond, a, b)                 # vectorised if/else<\/code><\/pre>\n<div class=\"bridge\">SQL bridge: <code>df.loc[df.a &gt; 5, [&#x27;b&#x27;, &#x27;c&#x27;]]<\/code> ≈ <code>SELECT b, c FROM df WHERE a &gt; 5<\/code>.<\/div>\n<p>Always call functions with <code>df.copy()<\/code> in your own experiments, so you don't accidentally change the original.<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Big debits", "task": "<p>Write <code>big_debits(df)<\/code> returning rows where <code>txn_type == &#x27;DEBIT&#x27;<\/code> <strong>and<\/strong> <code>amount &gt; 3000<\/code>, keeping only the columns <code>txn_id, account_id, amount<\/code>, with the index reset (<code>reset_index(drop=True)<\/code>).<\/p>", "hint": "Build the mask with &amp; and parentheses, then .loc[mask, [cols]].reset_index(drop=True).", "solution": "def big_debits(df):\n    mask = (df[\"txn_type\"] == \"DEBIT\") & (df[\"amount\"] > 3000)\n    return df.loc[mask, [\"txn_id\", \"account_id\", \"amount\"]].reset_index(drop=True)", "starter": "def big_debits(df):\n    pass", "tests": ["big_debits(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Signed amounts", "task": "<p>Write <code>add_signed(df)<\/code> adding a column <code>signed<\/code> that equals <code>amount<\/code> for CREDIT and <code>-amount<\/code> for DEBIT. Return the DataFrame.<\/p>", "hint": "<code>np.where(condition, value_if_true, value_if_false)<\/code>.", "solution": "def add_signed(df):\n    df[\"signed\"] = np.where(df[\"txn_type\"] == \"CREDIT\", df[\"amount\"], -df[\"amount\"])\n    return df", "starter": "def add_signed(df):\n    pass", "tests": ["add_signed(txns.copy())['signed']", "list(add_signed(txns.copy()).columns)"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 14, "week": 2, "track": "sql", "title": "SQL: conditional aggregation", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p><strong>Conditional aggregation<\/strong> (<code>SUM(CASE WHEN ... THEN x ELSE 0 END)<\/code>) pivots rows into columns in a single pass. It's one of the most useful patterns in reporting SQL, and it maps directly onto <code>pivot_table<\/code> in pandas.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Monthly credits vs debits", "task": "<p>Return <code>month<\/code> ('YYYY-MM'), <code>credits<\/code>, <code>debits<\/code> (sums of amount), <strong>ordered by<\/strong> month.<\/p>", "hint": "strftime('%Y-%m', txn_date) plus two SUM(CASE ...) columns.", "solution": "SELECT strftime('%Y-%m', txn_date) AS month,\n       SUM(CASE WHEN txn_type = 'CREDIT' THEN amount ELSE 0 END) AS credits,\n       SUM(CASE WHEN txn_type = 'DEBIT'  THEN amount ELSE 0 END) AS debits\nFROM transactions\nGROUP BY month\nORDER BY month;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Accounts spending more than they receive", "task": "<p>Accounts whose total debits exceed total credits: <code>account_id, credits, debits<\/code>, <strong>ordered by<\/strong> account_id.<\/p>", "hint": "Same pattern as the previous problem, grouped by account and filtered with HAVING.", "solution": "SELECT account_id,\n       SUM(CASE WHEN txn_type = 'CREDIT' THEN amount ELSE 0 END) AS credits,\n       SUM(CASE WHEN txn_type = 'DEBIT'  THEN amount ELSE 0 END) AS debits\nFROM transactions\nGROUP BY account_id\nHAVING debits > credits\nORDER BY account_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Segment summary", "task": "<p>Per customer <code>segment<\/code> (only customers with accounts): <code>segment, customers<\/code> (distinct count), <code>avg_balance<\/code> (average account balance rounded to 2), <strong>ordered by<\/strong> segment.<\/p>", "hint": "Use COUNT(DISTINCT ...), because the join repeats customers once per account.", "solution": "SELECT c.segment, COUNT(DISTINCT c.customer_id) AS customers, ROUND(AVG(a.balance), 2) AS avg_balance\nFROM customers c\nJOIN accounts a ON a.customer_id = c.customer_id\nGROUP BY c.segment\nORDER BY c.segment;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 15, "week": 3, "track": "py", "title": "Nested loops & 2-D lists", "learn": "<p>A list of lists works like a <strong>table<\/strong>: <code>grid[row][col]<\/code>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>grid = [[1, 2, 3],\n        [4, 5, 6]]\ngrid[1][2]        # 6\nlen(grid)         # 2 rows\nlen(grid[0])      # 3 columns\n\nfor r in range(len(grid)):\n    for c in range(len(grid[0])):\n        print(r, c, grid[r][c])\n\ntable = [[0] * 3 for _ in range(2)]   # 2x3 of zeros (the right way)<\/code><\/pre>\n<p>⚠️ <code>[[0] * 3] * 2<\/code> creates the <strong>same<\/strong> inner list twice, so changing one row changes both.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Transpose", "task": "<p>Write <code>transpose(matrix)<\/code>: rows become columns. <code>[[1,2,3],[4,5,6]]<\/code> → <code>[[1,4],[2,5],[3,6]]<\/code>.<\/p>", "hint": "The new row number c is built from <code>matrix[r][c]<\/code> for every r. A nested comprehension works nicely here.", "solution": "def transpose(matrix):\n    rows, cols = len(matrix), len(matrix[0])\n    return [[matrix[r][c] for r in range(rows)] for c in range(cols)]", "starter": "def transpose(matrix):\n    pass", "tests": ["transpose([[1, 2, 3], [4, 5, 6]])", "transpose([[1]])", "transpose([[1, 2], [3, 4]])"], "setup": ""}, {"kind": "py", "title": "Multiplication table", "task": "<p>Write <code>multiplication_table(n)<\/code> returning an n×n list of lists where cell [i][j] = (i+1)*(j+1).<\/p>", "hint": "Outer loop for rows i, inner loop for columns j.", "solution": "def multiplication_table(n):\n    return [[(i + 1) * (j + 1) for j in range(n)] for i in range(n)]", "starter": "def multiplication_table(n):\n    pass", "tests": ["multiplication_table(3)", "multiplication_table(1)", "multiplication_table(0)"], "setup": ""}]}, {"n": 16, "week": 3, "track": "py", "title": "String algorithms", "learn": "<p>Every character has a number. <code>ord(&#x27;a&#x27;)<\/code> is 97 and <code>chr(97)<\/code> is <code>&#x27;a&#x27;<\/code>. That is how you shift letters.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>ch = &quot;c&quot;\nch.isalpha(), ch.isdigit(), ch.isupper()\noffset = ord(ch) - ord(&quot;a&quot;)          # 2\nchr((offset + 3) % 26 + ord(&quot;a&quot;))    # &#x27;f&#x27;<\/code><\/pre>\n<p><strong>Building strings in a loop.<\/strong> Collect the pieces in a list and <code>&quot;&quot;.join(pieces)<\/code> at the end. It is faster than doing <code>s += ...<\/code> again and again.<\/p>\n<p><strong>Walking through runs<\/strong> (groups of the same character): keep track of the current character and a count, and <strong>flush<\/strong> the group when the character changes. Don't forget to flush the last group after the loop.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Run-length compression", "task": "<p>Write <code>compress(s)<\/code>: <code>&#x27;aaabcc&#x27;<\/code> → <code>&#x27;a3b1c2&#x27;<\/code>. Empty string → <code>&#x27;&#x27;<\/code>.<\/p>", "hint": "Track <code>current<\/code> and <code>count<\/code>. When <code>ch != current<\/code>, append f'{current}{count}' and reset. Append once more after the loop.", "solution": "def compress(s):\n    if not s:\n        return \"\"\n    pieces = []\n    current, count = s[0], 0\n    for ch in s:\n        if ch == current:\n            count += 1\n        else:\n            pieces.append(f\"{current}{count}\")\n            current, count = ch, 1\n    pieces.append(f\"{current}{count}\")\n    return \"\".join(pieces)", "starter": "def compress(s):\n    pass", "tests": ["compress('aaabcc')", "compress('')", "compress('a')", "compress('abc')", "compress('zzzzzzzzzzzz')"], "setup": ""}, {"kind": "py", "title": "Caesar cipher", "task": "<p>Write <code>caesar(text, shift)<\/code> shifting each letter forward by <code>shift<\/code> (wrapping z→a), <strong>keeping case<\/strong>. Leave non-letters unchanged.<\/p>\n<p><code>caesar(&#x27;Hello, World!&#x27;, 3)<\/code> → <code>&#x27;Khoor, Zruog!&#x27;<\/code><\/p>", "hint": "Pick <code>base = ord(&#x27;A&#x27;)<\/code> or <code>ord(&#x27;a&#x27;)<\/code>, then <code>chr((ord(ch) - base + shift) % 26 + base)<\/code>.", "solution": "def caesar(text, shift):\n    out = []\n    for ch in text:\n        if ch.isalpha():\n            base = ord(\"A\") if ch.isupper() else ord(\"a\")\n            out.append(chr((ord(ch) - base + shift) % 26 + base))\n        else:\n            out.append(ch)\n    return \"\".join(out)", "starter": "def caesar(text, shift):\n    pass", "tests": ["caesar('Hello, World!', 3)", "caesar('xyz', 3)", "caesar('abc', 26)", "caesar('Khoor', -3)", "caesar('2026 UPI', 1)"], "setup": ""}]}, {"n": 17, "week": 3, "track": "py", "title": "Sorting with key functions & lambda", "learn": "<pre class=\"code\" data-lang=\"python\"><code>words = [&quot;neft&quot;, &quot;upi&quot;, &quot;rtgs&quot;, &quot;imps&quot;, &quot;atm&quot;]\nsorted(words)                          # alphabetical\nsorted(words, key=len)                 # by length\nsorted(words, key=len, reverse=True)\nsorted(words, key=lambda w: (len(w), w))   # length, then alphabetical<\/code><\/pre>\n<ul><li><code>lambda w: ...<\/code> is a tiny unnamed function.<\/li><li><code>key<\/code> turns each item into the value used for sorting. If you return a <strong>tuple<\/strong>, Python sorts by the first element, then the second, and so on.<\/li><li>To sort one part descending and another ascending, negate the number: <code>key=lambda r: (-r[1], r[0])<\/code>.<\/li><li>Python's sort is <strong>stable<\/strong>: items with equal keys keep their original order.<\/li><\/ul>\n<div class=\"bridge\">SQL bridge: <code>ORDER BY LENGTH(w), w<\/code> → <code>key=lambda w: (len(w), w)<\/code>. <code>ORDER BY score DESC, name<\/code> → <code>key=lambda r: (-r.score, r.name)<\/code>.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Sort by length", "task": "<p>Write <code>sort_by_length(words)<\/code>: shortest first; ties alphabetical.<\/p>", "hint": "<code>key=lambda w: (len(w), w)<\/code>", "solution": "def sort_by_length(words):\n    return sorted(words, key=lambda w: (len(w), w))", "starter": "def sort_by_length(words):\n    pass", "tests": ["sort_by_length(['neft', 'upi', 'rtgs', 'imps', 'atm'])", "sort_by_length([])", "sort_by_length(['bb', 'a', 'ab'])"], "setup": ""}, {"kind": "py", "title": "Top-k scores", "task": "<p><code>records<\/code> is a list of <code>(name, score)<\/code> tuples. Write <code>top_k(records, k)<\/code> returning the <strong>names<\/strong> of the k highest scores. Break ties by name, A→Z.<\/p>", "hint": "Sort with <code>key=lambda r: (-r[1], r[0])<\/code>, slice <code>[:k]<\/code>, then pull out the names.", "solution": "def top_k(records, k):\n    ranked = sorted(records, key=lambda r: (-r[1], r[0]))\n    return [name for name, score in ranked[:k]]", "starter": "def top_k(records, k):\n    pass", "tests": ["top_k([('asha', 90), ('ravi', 95), ('meena', 90), ('zoya', 70)], 3)", "top_k([('a', 1)], 5)", "top_k([], 2)"], "setup": ""}]}, {"n": 18, "week": 3, "track": "py", "title": "The standard library: batteries included", "learn": "<pre class=\"code\" data-lang=\"python\"><code>import math\nmath.sqrt(16), math.ceil(2.1), math.floor(2.9)\n\nfrom collections import Counter, defaultdict\nCounter(&quot;banana&quot;)                  # Counter({&#x27;a&#x27;: 3, &#x27;n&#x27;: 2, &#x27;b&#x27;: 1})\nCounter(&quot;banana&quot;).most_common(1)   # [(&#x27;a&#x27;, 3)]\n\ngroups = defaultdict(list)         # missing keys start as []\ngroups[&quot;h&quot;].append(&quot;hyd&quot;)\n\nfrom datetime import date, timedelta\nd = date.fromisoformat(&quot;2026-01-15&quot;)\n(date(2026, 3, 1) - d).days        # 45\nd + timedelta(days=30)<\/code><\/pre>\n<p>Learn to <strong>read the docs<\/strong>. Search \"python collections Counter\" and skim the examples. Knowing what already exists saves you from writing it yourself.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Most common character", "task": "<p>Write <code>most_common_char(s)<\/code> returning the most frequent character, <strong>ignoring spaces<\/strong>. Break ties with the alphabetically smallest.<\/p>", "hint": "Build a Counter, then choose the key with the biggest count. <code>min(counts, key=lambda c: (-counts[c], c))<\/code> handles ties.", "solution": "from collections import Counter\n\ndef most_common_char(s):\n    counts = Counter(s.replace(\" \", \"\"))\n    return min(counts, key=lambda ch: (-counts[ch], ch))", "starter": "from collections import Counter\n\ndef most_common_char(s):\n    pass", "tests": ["most_common_char('banana')", "most_common_char('abc')", "most_common_char('hello world')", "most_common_char('zz aa')"], "setup": ""}, {"kind": "py", "title": "Days between dates", "task": "<p>Write <code>days_between(d1, d2)<\/code> taking <code>&#x27;YYYY-MM-DD&#x27;<\/code> strings and returning the absolute number of days between them.<\/p>", "hint": "<code>date.fromisoformat(...)<\/code> parses the text. Subtracting two dates gives a timedelta with <code>.days<\/code>. Wrap it in <code>abs()<\/code>.", "solution": "from datetime import date\n\ndef days_between(d1, d2):\n    return abs((date.fromisoformat(d2) - date.fromisoformat(d1)).days)", "starter": "from datetime import date\n\ndef days_between(d1, d2):\n    pass", "tests": ["days_between('2026-01-01', '2026-03-01')", "days_between('2026-03-01', '2026-01-01')", "days_between('2024-02-28', '2024-03-01')", "days_between('2026-05-05', '2026-05-05')"], "setup": ""}, {"kind": "py", "title": "Group by first letter", "task": "<p>Write <code>group_by_first_letter(words)<\/code> returning a dict: lowercase first letter → list of words (in original order).<\/p>", "hint": "<code>groups = defaultdict(list)<\/code> then <code>groups[w[0].lower()].append(w)<\/code>.", "solution": "from collections import defaultdict\n\ndef group_by_first_letter(words):\n    groups = defaultdict(list)\n    for w in words:\n        groups[w[0].lower()].append(w)\n    return dict(groups)", "starter": "from collections import defaultdict\n\ndef group_by_first_letter(words):\n    pass", "tests": ["group_by_first_letter(['Hyd', 'hello', 'Blr', 'bank'])", "group_by_first_letter([])"], "setup": ""}]}, {"n": 19, "week": 3, "track": "py", "title": "Mini-project: bank statement tools", "learn": "<p>Today you combine everything from weeks 1–3: loops, dicts, conditions and strings. There's no new syntax.<\/p>\n<p><strong>Problem-solving routine<\/strong> (use it every day from now on):<\/p>\n<ol><li>Restate the problem in your own words.<\/li><li>Work through one example <strong>by hand<\/strong> on paper.<\/li><li>Write the steps in plain English as comments.<\/li><li>Turn each comment into code.<\/li><li>Run it, read the errors, fix, repeat.<\/li><\/ol>\n<p>Each transaction is a dict: <code>{&quot;type&quot;: &quot;CREDIT&quot;, &quot;amount&quot;: 500}<\/code>.<\/p>\n<p>An <strong>IFSC code<\/strong> is 11 characters: 4 letters (the bank), then <code>0<\/code>, then 6 letters or digits (the branch). For example <code>ICIC0001234<\/code>.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Summarise a statement", "task": "<p>Write <code>summarize(txns)<\/code> returning a dict with keys <code>credits<\/code>, <code>debits<\/code>, <code>net<\/code> (credits − debits) and <code>count<\/code>.<\/p>", "hint": "Two accumulators, credits and debits. Loop once and add to the right one depending on t['type'].", "solution": "def summarize(txns):\n    credits = debits = 0\n    for t in txns:\n        if t[\"type\"] == \"CREDIT\":\n            credits += t[\"amount\"]\n        else:\n            debits += t[\"amount\"]\n    return {\"credits\": credits, \"debits\": debits, \"net\": credits - debits, \"count\": len(txns)}", "starter": "def summarize(txns):\n    pass", "tests": ["summarize([{'type': 'CREDIT', 'amount': 500}, {'type': 'DEBIT', 'amount': 200}, {'type': 'CREDIT', 'amount': 50}])", "summarize([])", "summarize([{'type': 'DEBIT', 'amount': 99}])"], "setup": ""}, {"kind": "py", "title": "Validate an IFSC code", "task": "<p>Write <code>is_valid_ifsc(code)<\/code> → True if <code>code<\/code> is 11 characters, the first 4 are <strong>uppercase letters<\/strong>, the 5th is <code>&#x27;0&#x27;<\/code>, and the last 6 are uppercase letters or digits.<\/p>", "hint": "Slice it into code[:4], code[4], code[5:] and check each part. Return False as soon as one check fails.", "solution": "def is_valid_ifsc(code):\n    if len(code) != 11:\n        return False\n    bank, zero, branch = code[:4], code[4], code[5:]\n    if not (bank.isalpha() and bank.isupper()):\n        return False\n    if zero != \"0\":\n        return False\n    for ch in branch:\n        if not (ch.isdigit() or (ch.isalpha() and ch.isupper())):\n            return False\n    return True", "starter": "def is_valid_ifsc(code):\n    pass", "tests": ["is_valid_ifsc('ICIC0001234')", "is_valid_ifsc('HDFC0ABC123')", "is_valid_ifsc('icic0001234')", "is_valid_ifsc('ICIC1001234')", "is_valid_ifsc('ICIC000123')", "is_valid_ifsc('SBIN0_12345')"], "setup": ""}]}, {"n": 20, "week": 3, "track": "pd", "title": "pandas groupby: GROUP BY, the pandas way", "learn": "<pre class=\"code\" data-lang=\"python\"><code>txns.groupby(&quot;txn_type&quot;)[&quot;amount&quot;].sum()            # Series indexed by txn_type\ntxns.groupby(&quot;account_id&quot;).agg(\n    total=(&quot;amount&quot;, &quot;sum&quot;),\n    n=(&quot;amount&quot;, &quot;count&quot;),\n    biggest=(&quot;amount&quot;, &quot;max&quot;),\n).reset_index()                                     # turn the group keys back into a column\ntxns[&quot;channel&quot;].value_counts()                      # COUNT(*) GROUP BY channel ORDER BY 2 DESC\ntxns.sort_values([&quot;amount&quot;, &quot;txn_id&quot;], ascending=[False, True])\ntxns[&quot;account_id&quot;].nunique()                        # COUNT(DISTINCT)<\/code><\/pre>\n<table class='mdt'><thead><tr><th>SQL<\/th><th>pandas<\/th><\/tr><\/thead><tbody><tr><td><code>GROUP BY a<\/code><\/td><td><code>.groupby(&quot;a&quot;)<\/code><\/td><\/tr><tr><td><code>SUM(x) AS total<\/code><\/td><td><code>.agg(total=(&quot;x&quot;, &quot;sum&quot;))<\/code><\/td><\/tr><tr><td><code>HAVING total &gt; 5<\/code><\/td><td>filter <strong>after<\/strong> the agg<\/td><\/tr><tr><td><code>ORDER BY total DESC<\/code><\/td><td><code>.sort_values(&quot;total&quot;, ascending=False)<\/code><\/td><\/tr><tr><td><code>LIMIT 5<\/code><\/td><td><code>.head(5)<\/code><\/td><\/tr><\/tbody><\/table>", "stretch": null, "problems": [{"kind": "pd", "title": "Total by type", "task": "<p>Write <code>total_by_type(df)<\/code> returning a <strong>Series<\/strong> indexed by <code>txn_type<\/code> with the summed <code>amount<\/code>.<\/p>", "hint": "<code>df.groupby(&#x27;txn_type&#x27;)[&#x27;amount&#x27;].sum()<\/code>", "solution": "def total_by_type(df):\n    return df.groupby(\"txn_type\")[\"amount\"].sum()", "starter": "def total_by_type(df):\n    pass", "tests": ["total_by_type(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Top accounts", "task": "<p>Write <code>top_accounts(df, n)<\/code> returning a DataFrame with columns <code>account_id, total<\/code> (sum of amount), sorted by total descending (ties: account_id ascending), top n rows, index reset.<\/p>", "hint": "groupby(..., as_index=False).agg(total=('amount', 'sum')), then sort_values with two columns, head(n), reset_index(drop=True).", "solution": "def top_accounts(df, n):\n    out = df.groupby(\"account_id\", as_index=False).agg(total=(\"amount\", \"sum\"))\n    out = out.sort_values([\"total\", \"account_id\"], ascending=[False, True])\n    return out.head(n).reset_index(drop=True)", "starter": "def top_accounts(df, n):\n    pass", "tests": ["top_accounts(txns.copy(), 5)", "top_accounts(txns.copy(), 1)"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 21, "week": 3, "track": "sql", "title": "SQL: outer joins & anti-joins", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for
