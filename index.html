None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}]}, {"n": 66, "week": 10, "track": "py", "title": "Breadth-first search (level order)", "learn": "<p>BFS visits nodes <strong>level by level<\/strong> using a queue. It is the tool for \"shortest number of steps\" questions, and you'll use it on graphs too.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from collections import deque\ndef bfs(root):\n    q = deque([root])\n    while q:\n        level_size = len(q)             # how many nodes are on this level\n        for _ in range(level_size):\n            node = q.popleft()\n            # process node ...\n            if node.left:  q.append(node.left)\n            if node.right: q.append(node.right)<\/code><\/pre>\n<p>The <code>level_size<\/code> trick is what lets you group the output by level.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Level order", "task": "<p>Return the values level by level as a list of lists.<\/p>", "hint": "Loop <code>for _ in range(len(q))<\/code> to handle exactly one level at a time.", "solution": "from collections import deque\n\ndef level_order(root):\n    if not root:\n        return []\n    out, q = [], deque([root])\n    while q:\n        level = []\n        for _ in range(len(q)):\n            node = q.popleft()\n            level.append(node.val)\n            if node.left:\n                q.append(node.left)\n            if node.right:\n                q.append(node.right)\n        out.append(level)\n    return out", "starter": "from collections import deque\n\ndef level_order(root):\n    pass", "tests": ["level_order(_tree([3, 9, 20, None, None, 15, 7]))", "level_order(_tree([1]))", "level_order(_tree([]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}, {"kind": "py", "title": "Right side view", "task": "<p>Return the value of the <strong>rightmost<\/strong> node on each level, top to bottom.<\/p>", "hint": "It's level order again, but keep only the last node of each level.", "solution": "from collections import deque\n\ndef right_view(root):\n    if not root:\n        return []\n    out, q = [], deque([root])\n    while q:\n        n = len(q)\n        for i in range(n):\n            node = q.popleft()\n            if i == n - 1:\n                out.append(node.val)\n            if node.left:\n                q.append(node.left)\n            if node.right:\n                q.append(node.right)\n    return out", "starter": "from collections import deque\n\ndef right_view(root):\n    pass", "tests": ["right_view(_tree([1, 2, 3, None, 5, None, 4]))", "right_view(_tree([1, 2]))", "right_view(_tree([]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}]}, {"n": 67, "week": 10, "track": "py", "title": "Binary search trees", "learn": "<p>In a <strong>BST<\/strong>, for every node, everything in its left subtree is <strong>smaller<\/strong> and everything in its right subtree is <strong>larger<\/strong>. That makes search, insert and delete O(height): O(log n) if the tree is balanced, O(n) in the worst case.<\/p>\n<p>A common mistake when validating: checking only each node against its direct children. The rule applies to the <strong>whole subtree<\/strong>, so pass down an allowed range instead:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def valid(node, low, high):\n    if not node: return True\n    if not (low &lt; node.val &lt; high): return False\n    return valid(node.left, low, node.val) and valid(node.right, node.val, high)\n\nvalid(root, float(&quot;-inf&quot;), float(&quot;inf&quot;))<\/code><\/pre>\n<p>Another way to check it: the inorder traversal of a valid BST is strictly increasing.<\/p>", "stretch": "LeetCode 230 <em>Kth Smallest Element in a BST<\/em>: an inorder traversal that stops early.", "problems": [{"kind": "py", "title": "Validate a BST", "task": "<p>Return True if the tree is a valid BST (strictly increasing, no duplicates).<\/p>", "hint": "Pass (low, high) bounds down. Going left, high becomes node.val. Going right, low becomes node.val.", "solution": "def is_valid_bst(root):\n    def valid(node, low, high):\n        if not node:\n            return True\n        if not (low < node.val < high):\n            return False\n        return valid(node.left, low, node.val) and valid(node.right, node.val, high)\n    return valid(root, float(\"-inf\"), float(\"inf\"))", "starter": "def is_valid_bst(root):\n    pass", "tests": ["is_valid_bst(_tree([2, 1, 3]))", "is_valid_bst(_tree([5, 1, 4, None, None, 3, 6]))", "is_valid_bst(_tree([5, 4, 6, None, None, 3, 7]))", "is_valid_bst(_tree([]))", "is_valid_bst(_tree([2, 2, 2]))"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}]}, {"n": 68, "week": 10, "track": "py", "title": "BST operations", "learn": "<p>Because of the ordering, you only ever go <strong>one way<\/strong> at each node:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def search(root, x):\n    while root and root.val != x:\n        root = root.left if x &lt; root.val else root.right\n    return root<\/code><\/pre>\n<p><strong>Insert:<\/strong> walk down as if searching, and attach a new node where you hit <code>None<\/code>.<\/p>\n<p><strong>Lowest common ancestor in a BST:<\/strong> if both values are smaller than the node, go left. If both are larger, go right. Otherwise the paths <strong>split here<\/strong>, and this node is the answer.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Insert into a BST", "task": "<p>Write <code>bst_insert(root, val)<\/code> returning the root (create a node if the tree is empty).<\/p>", "hint": "Recurse left or right and assign the result back to root.left or root.right.", "solution": "def bst_insert(root, val):\n    if root is None:\n        return TreeNode(val)\n    if val < root.val:\n        root.left = bst_insert(root.left, val)\n    else:\n        root.right = bst_insert(root.right, val)\n    return root", "starter": "def bst_insert(root, val):\n    pass", "tests": ["_inorder(bst_insert(_tree([4, 2, 7, 1, 3]), 5))", "_inorder(bst_insert(None, 1))", "bst_insert(_tree([4, 2, 7]), 9).right.right.val"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}, {"kind": "py", "title": "Lowest common ancestor (BST)", "task": "<p>Given values <code>p<\/code> and <code>q<\/code> that both exist in the BST, return the <strong>value<\/strong> of their lowest common ancestor.<\/p>", "hint": "Both smaller → go left. Both bigger → go right. Otherwise you've found the split point.", "solution": "def lca(root, p, q):\n    node = root\n    while node:\n        if p < node.val and q < node.val:\n            node = node.left\n        elif p > node.val and q > node.val:\n            node = node.right\n        else:\n            return node.val", "starter": "def lca(root, p, q):\n    pass", "tests": ["lca(_tree([6, 2, 8, 0, 4, 7, 9, None, None, 3, 5]), 2, 8)", "lca(_tree([6, 2, 8, 0, 4, 7, 9, None, None, 3, 5]), 2, 4)", "lca(_tree([6, 2, 8, 0, 4, 7, 9, None, None, 3, 5]), 3, 5)", "lca(_tree([2, 1]), 2, 1)"], "setup": "from collections import deque\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\ndef _tree(vals):\n    # build from level-order list, None = missing child (LeetCode style)\n    if not vals or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    q, i = deque([root]), 1\n    while q and i < len(vals):\n        node = q.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i]); q.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i]); q.append(node.right)\n        i += 1\n    return root\n\ndef _inorder(root):\n    return _inorder(root.left) + [root.val] + _inorder(root.right) if root else []"}]}, {"n": 69, "week": 10, "track": "pd", "title": "Binning, top-N per group & vectorising", "learn": "<pre class=\"code\" data-lang=\"python\"><code>pd.cut(df[&quot;amount&quot;], bins=[0, 1000, 3000, 5000], labels=[&quot;small&quot;, &quot;medium&quot;, &quot;large&quot;])   # CASE WHEN banding\npd.qcut(df[&quot;amount&quot;], 4, labels=False)                    # quartiles, like NTILE(4)\n\n(df.sort_values([&quot;account_id&quot;, &quot;amount&quot;, &quot;txn_id&quot;], ascending=[True, False, True])\n   .groupby(&quot;account_id&quot;).head(2))                         # top-2 per group, like ROW_NUMBER() &lt;= 2\n\ndf.groupby(&quot;account_id&quot;)[&quot;amount&quot;].rank(method=&quot;dense&quot;, ascending=False)   # DENSE_RANK()<\/code><\/pre>\n<p><strong>Performance:<\/strong> <code>df.apply(func, axis=1)<\/code> runs Python once per row and is slow. Vectorised column maths runs in C and is often <strong>100× faster<\/strong>. Reach for <code>apply<\/code> last.<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Amount buckets", "task": "<p>Write <code>bucket_counts(df)<\/code> returning a <strong>dict<\/strong> label → count, using <code>pd.cut<\/code> with bins <code>[0, 1000, 3000, 5000]<\/code> and labels <code>small, medium, large<\/code>.<\/p>", "hint": "pd.cut(...).value_counts(). Then convert the keys to str and the values to int in a dict comprehension.", "solution": "def bucket_counts(df):\n    b = pd.cut(df[\"amount\"], bins=[0, 1000, 3000, 5000], labels=[\"small\", \"medium\", \"large\"])\n    return {str(k): int(v) for k, v in b.value_counts().items()}", "starter": "def bucket_counts(df):\n    pass", "tests": ["bucket_counts(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Top-N per account", "task": "<p>Write <code>top_n_per_account(df, n)<\/code> returning the n largest transactions per account (ties: lower txn_id first): columns <code>account_id, txn_id, amount<\/code>, sorted by account_id, then amount descending, then txn_id, index reset.<\/p>", "hint": "Sort once with three keys, then groupby(...).head(n).", "solution": "def top_n_per_account(df, n):\n    s = df.sort_values([\"account_id\", \"amount\", \"txn_id\"], ascending=[True, False, True])\n    return s.groupby(\"account_id\").head(n)[[\"account_id\", \"txn_id\", \"amount\"]].reset_index(drop=True)", "starter": "def top_n_per_account(df, n):\n    pass", "tests": ["top_n_per_account(txns.copy(), 2)", "len(top_n_per_account(txns.copy(), 1))"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 70, "week": 10, "track": "sql", "title": "SQL: recursive CTEs", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>A recursive CTE has an <strong>anchor<\/strong> query plus a <strong>recursive<\/strong> part that joins back to the CTE itself. It's a loop in SQL, used for hierarchies (org charts, account trees), generating date spines, and graph walks. It's the same idea as recursion in Python (day 40)!<\/p>\n<pre class=\"code\" data-lang=\"sql\"><code>WITH RECURSIVE nums(n) AS (\n    SELECT 1                          -- anchor\n    UNION ALL\n    SELECT n + 1 FROM nums WHERE n &lt; 5   -- recursive step and stop condition\n)\nSELECT * FROM nums;<\/code><\/pre>", "stretch": null, "problems": [{"kind": "sql", "title": "Org-chart levels", "task": "<p>Every employee's <code>name, level<\/code> (the top boss = 1, their reports = 2, …), <strong>ordered by<\/strong> level, name.<\/p>", "hint": "The anchor is the employee with manager_id IS NULL. The recursive step joins employees to org on manager_id.", "solution": "WITH RECURSIVE org(emp_id, name, level) AS (\n    SELECT emp_id, name, 1 FROM employees WHERE manager_id IS NULL\n    UNION ALL\n    SELECT e.emp_id, e.name, o.level + 1\n    FROM employees e JOIN org o ON e.manager_id = o.emp_id\n)\nSELECT name, level FROM org\nORDER BY level, name;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Date spine for January", "task": "<p>For every day of January 2026: <code>day, txn_count<\/code> (0 on days without transactions), <strong>ordered by<\/strong> day.<\/p>", "hint": "Generate the days with a recursive CTE, then LEFT JOIN the transactions and COUNT(t.txn_id).", "solution": "WITH RECURSIVE days(day) AS (\n    SELECT '2026-01-01'\n    UNION ALL\n    SELECT date(day, '+1 day') FROM days WHERE day < '2026-01-31'\n)\nSELECT d.day, COUNT(t.txn_id) AS txn_count\nFROM days d LEFT JOIN transactions t ON t.txn_date = d.day\nGROUP BY d.day\nORDER BY d.day;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Chain of command", "task": "<p>Gopal Rao's management chain from himself up to the top: <code>name, depth<\/code> (Gopal = 0), <strong>ordered by<\/strong> depth.<\/p>", "hint": "This walks UP the tree: join on e.emp_id = c.manager_id.", "solution": "WITH RECURSIVE chain(emp_id, name, manager_id, depth) AS (\n    SELECT emp_id, name, manager_id, 0 FROM employees WHERE name = 'Gopal Rao'\n    UNION ALL\n    SELECT e.emp_id, e.name, e.manager_id, c.depth + 1\n    FROM employees e JOIN chain c ON e.emp_id = c.manager_id\n)\nSELECT name, depth FROM chain ORDER BY depth;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 71, "week": 11, "track": "py", "title": "Heaps & priority queues", "learn": "<p>A <strong>heap<\/strong> always gives you the smallest item in O(1), with O(log n) push and pop. Python's <code>heapq<\/code> works on a plain list and is a <strong>min-heap<\/strong>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>import heapq\nh = []\nheapq.heappush(h, 5); heapq.heappush(h, 1); heapq.heappush(h, 3)\nheapq.heappop(h)      # 1\nh[0]                  # peek at the smallest: 3\nheapq.nlargest(2, [5, 1, 9, 3])   # [9, 5]<\/code><\/pre>\n<p><strong>The top-k trick:<\/strong> keep a min-heap of size k. When it grows past k, pop the smallest. What remains are the k largest, in O(n log k).<\/p>\n<p>For a <strong>max-heap<\/strong>, push negated values (<code>-x<\/code>). Push tuples <code>(priority, item)<\/code> to order by priority.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "K largest", "task": "<p>Write <code>k_largest(nums, k)<\/code> returning the k largest values in <strong>descending<\/strong> order, using a size-k min-heap.<\/p>", "hint": "Push each x and pop whenever the size goes over k. Sort what's left in descending order.", "solution": "import heapq\n\ndef k_largest(nums, k):\n    heap = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) > k:\n            heapq.heappop(heap)\n    return sorted(heap, reverse=True)", "starter": "import heapq\n\ndef k_largest(nums, k):\n    pass", "tests": ["k_largest([3, 2, 1, 5, 6, 4], 2)", "k_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4)", "k_largest([1], 1)", "k_largest([], 3)"], "setup": ""}, {"kind": "py", "title": "Kth largest element", "task": "<p>Return the k-th largest element (k = 1 is the max).<\/p>", "hint": "Same heap as before. Its root, heap[0], is the k-th largest.", "solution": "import heapq\n\ndef kth_largest(nums, k):\n    heap = []\n    for x in nums:\n        heapq.heappush(heap, x)\n        if len(heap) > k:\n            heapq.heappop(heap)\n    return heap[0]", "starter": "import heapq\n\ndef kth_largest(nums, k):\n    pass", "tests": ["kth_largest([3, 2, 1, 5, 6, 4], 2)", "kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4)", "kth_largest([7], 1)"], "setup": ""}]}, {"n": 72, "week": 11, "track": "py", "title": "Heap + hash map: top-k frequent", "learn": "<p>Combine two tools you already have: <strong>count<\/strong> with a dict or Counter, then <strong>pick the top k<\/strong> with a heap or a sort.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from collections import Counter\ncounts = Counter([&quot;upi&quot;, &quot;atm&quot;, &quot;upi&quot;, &quot;card&quot;, &quot;upi&quot;, &quot;atm&quot;])\ncounts.most_common(2)          # [(&#x27;upi&#x27;, 3), (&#x27;atm&#x27;, 2)]<\/code><\/pre>\n<p><code>most_common<\/code> uses a heap internally. Interviewers often ask you to build it yourself.<\/p>\n<p><strong>Bucket sort<\/strong> alternative, O(n): make <code>buckets[f]<\/code> = a list of items that appear <code>f<\/code> times, then walk the buckets from the highest frequency down.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Top-k frequent", "task": "<p>Return the k most frequent numbers, ordered by frequency (highest first) and then by value (smallest first) for ties.<\/p>", "hint": "Count first. Then sort or heap the (num, count) pairs by (-count, num).", "solution": "from collections import Counter\nimport heapq\n\ndef top_k_frequent(nums, k):\n    counts = Counter(nums)\n    return [x for x, _ in heapq.nsmallest(k, counts.items(), key=lambda kv: (-kv[1], kv[0]))]", "starter": "from collections import Counter\n\ndef top_k_frequent(nums, k):\n    pass", "tests": ["top_k_frequent([1, 1, 1, 2, 2, 3], 2)", "top_k_frequent([1], 1)", "top_k_frequent([4, 4, 5, 5, 6], 2)", "top_k_frequent([3, 1, 3, 1, 2], 3)"], "setup": ""}]}, {"n": 73, "week": 11, "track": "py", "title": "Graphs & BFS shortest path", "learn": "<p>A graph is nodes connected by edges. The usual way to store one is an <strong>adjacency list<\/strong>:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>graph = {\n    &quot;A&quot;: [&quot;B&quot;, &quot;C&quot;],\n    &quot;B&quot;: [&quot;D&quot;],\n    &quot;C&quot;: [&quot;D&quot;],\n    &quot;D&quot;: [],\n}<\/code><\/pre>\n<p><strong>BFS finds the fewest-hops path<\/strong> in an unweighted graph. Track <code>visited<\/code> so you never process a node twice (graphs can have cycles, unlike trees).<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from collections import deque\nq, visited = deque([(start, 0)]), {start}\nwhile q:\n    node, dist = q.popleft()\n    if node == goal: return dist\n    for nxt in graph.get(node, []):\n        if nxt not in visited:\n            visited.add(nxt); q.append((nxt, dist + 1))<\/code><\/pre>\n<div class=\"bridge\">Data bridge: network topology, dbt model lineage (a DAG!) and fraud rings between accounts are all graphs.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Shortest path length", "task": "<p>Write <code>shortest_path(graph, start, end)<\/code> returning the number of edges on the shortest path, or -1 if <code>end<\/code> can't be reached.<\/p>", "hint": "BFS with (node, distance) pairs in the queue. Mark a node visited when you enqueue it.", "solution": "from collections import deque\n\ndef shortest_path(graph, start, end):\n    q = deque([(start, 0)])\n    visited = {start}\n    while q:\n        node, dist = q.popleft()\n        if node == end:\n            return dist\n        for nxt in graph.get(node, []):\n            if nxt not in visited:\n                visited.add(nxt)\n                q.append((nxt, dist + 1))\n    return -1", "starter": "from collections import deque\n\ndef shortest_path(graph, start, end):\n    pass", "tests": ["shortest_path({'A': ['B', 'C'], 'B': ['D'], 'C': ['D', 'E'], 'D': ['F'], 'E': ['F'], 'F': []}, 'A', 'F')", "shortest_path({'A': ['B'], 'B': ['A']}, 'A', 'Z')", "shortest_path({'A': []}, 'A', 'A')", "shortest_path({1: [2], 2: [3], 3: [1, 4], 4: []}, 1, 4)"], "setup": ""}]}, {"n": 74, "week": 11, "track": "py", "title": "DFS on grids: counting islands", "learn": "<p>A grid is a graph too: each cell connects to its 4 neighbours (up, down, left, right). <strong>Depth-first search<\/strong> floods outward from a cell and marks everything connected to it.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>def dfs(r, c):\n    if r &lt; 0 or c &lt; 0 or r &gt;= rows or c &gt;= cols: return      # off the grid\n    if grid[r][c] != &quot;1&quot; or (r, c) in seen: return           # water or already done\n    seen.add((r, c))\n    for dr, dc in [(1, 0), (-1, 0), (0, 1), (0, -1)]:\n        dfs(r + dr, c + dc)<\/code><\/pre>\n<p>Count islands: loop over every cell, and each time you find unvisited land, add 1 and flood it.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Number of islands", "task": "<p><code>grid<\/code> is a list of strings of '1' (land) and '0' (water). Return the number of islands (4-directional).<\/p>", "hint": "Double loop over the cells. Each time you find a '1' that isn't in <code>seen<\/code>, count it and flood-fill from it.", "solution": "def num_islands(grid):\n    if not grid:\n        return 0\n    rows, cols = len(grid), len(grid[0])\n    seen = set()\n\n    def dfs(r, c):\n        stack = [(r, c)]\n        while stack:\n            r, c = stack.pop()\n            if r < 0 or c < 0 or r >= rows or c >= cols:\n                continue\n            if grid[r][c] != \"1\" or (r, c) in seen:\n                continue\n            seen.add((r, c))\n            stack.extend([(r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)])\n\n    count = 0\n    for r in range(rows):\n        for c in range(cols):\n            if grid[r][c] == \"1\" and (r, c) not in seen:\n                count += 1\n                dfs(r, c)\n    return count", "starter": "def num_islands(grid):\n    pass", "tests": ["num_islands(['11110', '11010', '11000', '00000'])", "num_islands(['11000', '11000', '00100', '00011'])", "num_islands([])", "num_islands(['101', '010', '101'])"], "setup": ""}]}, {"n": 75, "week": 11, "track": "py", "title": "Topological sort: dependency order", "learn": "<p>In a <strong>directed acyclic graph<\/strong> (DAG), a topological order lists every node <em>after<\/em> all of its dependencies. It's how dbt decides model run order, how Airflow schedules tasks, and how pip installs packages.<\/p>\n<p><strong>Kahn's algorithm:<\/strong><\/p>\n<ol><li>Count the incoming edges (<strong>in-degree<\/strong>) for every node.<\/li><li>Put all nodes with in-degree 0 into a queue.<\/li><li>Pop a node, add it to the order, and decrease the in-degree of its neighbours. Any neighbour that drops to 0 joins the queue.<\/li><li>If the order ends up shorter than the number of nodes, there's a <strong>cycle<\/strong>.<\/li><\/ol>\n<p><code>[a, b]<\/code> in a prerequisites list means \"to take course a you must first take b\", which is an edge b → a.<\/p>", "stretch": null, "problems": [{"kind": "py", "title": "Can finish courses?", "task": "<p>Return True if all <code>n<\/code> courses (0..n-1) can be finished given the <code>prereqs<\/code> pairs.<\/p>", "hint": "Build the graph and the in-degree counts, then run Kahn's algorithm. You can finish if you process all n nodes.", "solution": "from collections import deque\n\ndef can_finish(n, prereqs):\n    graph = {i: [] for i in range(n)}\n    indeg = [0] * n\n    for a, b in prereqs:\n        graph[b].append(a)\n        indeg[a] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    done = 0\n    while q:\n        node = q.popleft()\n        done += 1\n        for nxt in graph[node]:\n            indeg[nxt] -= 1\n            if indeg[nxt] == 0:\n                q.append(nxt)\n    return done == n", "starter": "from collections import deque\n\ndef can_finish(n, prereqs):\n    pass", "tests": ["can_finish(2, [[1, 0]])", "can_finish(2, [[1, 0], [0, 1]])", "can_finish(4, [[1, 0], [2, 1], [3, 2]])", "can_finish(3, [])"], "setup": ""}, {"kind": "py", "title": "Course order", "task": "<p>Return <strong>one valid order<\/strong> to take all n courses, or <code>[]<\/code> if it's impossible.<\/p>", "hint": "Same as can_finish, but record the order. Return [] if it's shorter than n.", "solution": "from collections import deque\n\ndef course_order(n, prereqs):\n    graph = {i: [] for i in range(n)}\n    indeg = [0] * n\n    for a, b in prereqs:\n        graph[b].append(a)\n        indeg[a] += 1\n    q = deque(i for i in range(n) if indeg[i] == 0)\n    order = []\n    while q:\n        node = q.popleft()\n        order.append(node)\n        for nxt in graph[node]:\n            indeg[nxt] -= 1\n            if indeg[nxt] == 0:\n                q.append(nxt)\n    return order if len(order) == n else []", "starter": "from collections import deque\n\ndef course_order(n, prereqs):\n    pass", "tests": ["_valid_order(course_order(4, [[1, 0], [2, 0], [3, 1], [3, 2]]), 4, [[1, 0], [2, 0], [3, 1], [3, 2]])", "course_order(2, [[0, 1], [1, 0]])", "_valid_order(course_order(3, []), 3, [])"], "setup": "def _valid_order(order, n, prereqs):\n    if sorted(order) != list(range(n)):\n        return False\n    pos = {c: i for i, c in enumerate(order)}\n    return all(pos[b] < pos[a] for a, b in prereqs)"}]}, {"n": 76, "week": 11, "track": "pd", "title": "Reading CSVs & reshaping (melt)", "learn": "<pre class=\"code\" data-lang=\"python\"><code>import io\ndf = pd.read_csv(io.StringIO(csv_text))                      # in real life: pd.read_csv(&quot;file.csv&quot;)\npd.read_csv(path, usecols=[&quot;a&quot;, &quot;b&quot;], dtype={&quot;id&quot;: str}, parse_dates=[&quot;d&quot;])\nfor chunk in pd.read_csv(path, chunksize=100_000): ...       # big files: process in pieces\ndf.to_csv(&quot;out.csv&quot;, index=False)\n\n# wide → long  (UNPIVOT)\nlong = wide.melt(id_vars=&quot;branch&quot;, var_name=&quot;month&quot;, value_name=&quot;sales&quot;)\n# long → wide  (PIVOT)\nlong.pivot(index=&quot;branch&quot;, columns=&quot;month&quot;, values=&quot;sales&quot;)<\/code><\/pre>", "stretch": null, "problems": [{"kind": "pd", "title": "Total debits from CSV text", "task": "<p>Write <code>debit_total(csv_text)<\/code> that reads CSV text (columns <code>txn_id,amount,txn_type<\/code>) and returns the total amount of DEBIT rows as a float.<\/p>", "hint": "pd.read_csv(io.StringIO(csv_text)), then filter and sum.", "solution": "import io\n\ndef debit_total(csv_text):\n    df = pd.read_csv(io.StringIO(csv_text))\n    return float(df.loc[df[\"txn_type\"] == \"DEBIT\", \"amount\"].sum())", "starter": "import io\n\ndef debit_total(csv_text):\n    pass", "tests": ["debit_total('txn_id,amount,txn_type\\n1,500,DEBIT\\n2,200,CREDIT\\n3,150.5,DEBIT\\n')", "debit_total('txn_id,amount,txn_type\\n1,10,CREDIT\\n')"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Wide to long", "task": "<p>Write <code>to_long(wide)<\/code> that melts <code>wide<\/code> (columns <code>branch, jan, feb, mar<\/code>) into columns <code>branch, month, sales<\/code>, sorted by branch then month (alphabetically), index reset.<\/p>", "hint": "Use melt(id_vars='branch', var_name='month', value_name='sales'), then sort and reset the index.", "solution": "def to_long(wide):\n    long = wide.melt(id_vars=\"branch\", var_name=\"month\", value_name=\"sales\")\n    return long.sort_values([\"branch\", \"month\"]).reset_index(drop=True)", "starter": "def to_long(wide):\n    pass", "tests": ["to_long(wide.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\nwide = pd.DataFrame({'branch': ['Hyderabad', 'Mumbai', 'Pune'], 'jan': [120, 340, 80], 'feb': [150, 310, 95], 'mar': [170, 360, 90]})"}]}, {"n": 77, "week": 11, "track": "sql", "title": "SQL: data quality & retention", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>Data engineers write these checks constantly: <strong>duplicates, orphans and retention<\/strong>.<\/p>\n<p>Also look into <code>EXPLAIN QUERY PLAN SELECT ...<\/code> in the Playground. It shows whether SQLite scans the whole table or uses an index. Try it before and after <code>CREATE INDEX idx_t_acct ON transactions(account_id)<\/code>.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Possible duplicate customers", "task": "<p>Customer names that appear more than once: <code>name, copies, keep_id<\/code> (the smallest customer_id).<\/p>", "hint": "GROUP BY name HAVING COUNT(*) &gt; 1.", "solution": "SELECT name, COUNT(*) AS copies, MIN(customer_id) AS keep_id\nFROM customers\nGROUP BY name\nHAVING COUNT(*) > 1;", "starter": "-- Write your query here\nSELECT ", "ordered": false}, {"kind": "sql", "title": "Retained Jan → Feb", "task": "<p>Accounts that transacted in <strong>both<\/strong> January and February 2026: <code>account_id<\/code>, <strong>ordered by<\/strong> account_id.<\/p>", "hint": "Use INTERSECT, or GROUP BY account_id HAVING COUNT(DISTINCT month) = 2 over a Jan–Feb filter.", "solution": "SELECT account_id FROM transactions WHERE strftime('%Y-%m', txn_date) = '2026-01'\nINTERSECT\nSELECT account_id FROM transactions WHERE strftime('%Y-%m', txn_date) = '2026-02'\nORDER BY account_id;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Orphan check", "task": "<p>Data-quality check: count the transactions whose account_id does <strong>not<\/strong> exist in accounts, as <code>orphans<\/code> (expect 0, which is a passing check!).<\/p>", "hint": "Use an anti-join and count it.", "solution": "SELECT COUNT(*) AS orphans\nFROM transactions t\nLEFT JOIN accounts a ON a.account_id = t.account_id\nWHERE a.account_id IS NULL;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}, {"n": 78, "week": 12, "track": "py", "title": "Dynamic programming 1: memoization", "learn": "<p><strong>DP = recursion + remembering answers.<\/strong> If the same subproblem gets solved again and again, cache it.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from functools import lru_cache\n\n@lru_cache(maxsize=None)        # memoize: the decorator idea from day 38!\ndef fib(n):\n    if n &lt; 2:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nfib(100)   # instant. Without the cache this would take longer than the age of the universe.<\/code><\/pre>\n<p>The DP recipe:<\/p>\n<ol><li><strong>State<\/strong>: what does <code>f(i)<\/code> mean? Say it in words.<\/li><li><strong>Recurrence<\/strong>: how does <code>f(i)<\/code> depend on smaller states?<\/li><li><strong>Base cases.<\/strong><\/li><li>Memoize (top-down), or fill in a table (bottom-up).<\/li><\/ol>", "stretch": null, "problems": [{"kind": "py", "title": "Climbing stairs", "task": "<p>You can climb 1 or 2 steps at a time. How many distinct ways are there to reach step <code>n<\/code>?<\/p>", "hint": "ways(n) = ways(n-1) + ways(n-2): your last move was either a 1-step or a 2-step. It's Fibonacci in disguise.", "solution": "def climb_stairs(n):\n    a, b = 1, 1          # ways to reach step 0 and step 1\n    for _ in range(n - 1):\n        a, b = b, a + b\n    return b if n > 0 else 1", "starter": "def climb_stairs(n):\n    pass", "tests": ["climb_stairs(1)", "climb_stairs(2)", "climb_stairs(3)", "climb_stairs(5)", "climb_stairs(45)"], "setup": ""}, {"kind": "py", "title": "Min cost climbing", "task": "<p><code>cost[i]<\/code> is the price of stepping on stair i. You can start at stair 0 or 1 and climb 1 or 2 at a time. Return the minimum cost to get past the top.<\/p>", "hint": "dp[i] = min(dp[i-1] + cost[i-1], dp[i-2] + cost[i-2]). The answer is dp[len(cost)].", "solution": "def min_cost_climb(cost):\n    a = b = 0       # cheapest cost to stand at i-2 and i-1\n    for i in range(2, len(cost) + 1):\n        a, b = b, min(b + cost[i - 1], a + cost[i - 2])\n    return b", "starter": "def min_cost_climb(cost):\n    pass", "tests": ["min_cost_climb([10, 15, 20])", "min_cost_climb([1, 100, 1, 1, 1, 100, 1, 1, 100, 1])", "min_cost_climb([0, 0])"], "setup": ""}]}, {"n": 79, "week": 12, "track": "py", "title": "Dynamic programming 2: take it or skip it", "learn": "<p>Many 1-D DP problems come down to this: <strong>at each item, either take it (and accept the consequence) or skip it.<\/strong><\/p>\n<p>House robber: you can't rob two neighbouring houses.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>best(i) = max( best(i-1),            # skip house i\n               best(i-2) + nums[i] ) # rob house i<\/code><\/pre>\n<p>You only need the last two values, so the memory is O(1):<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>prev2, prev1 = 0, 0\nfor x in nums:\n    prev2, prev1 = prev1, max(prev1, prev2 + x)<\/code><\/pre>", "stretch": null, "problems": [{"kind": "py", "title": "House robber", "task": "<p>Return the maximum amount you can rob without taking from two adjacent houses.<\/p>", "hint": "best = max(skip: previous best, take: best two houses back + this one).", "solution": "def rob(nums):\n    prev2 = prev1 = 0\n    for x in nums:\n        prev2, prev1 = prev1, max(prev1, prev2 + x)\n    return prev1", "starter": "def rob(nums):\n    pass", "tests": ["rob([1, 2, 3, 1])", "rob([2, 7, 9, 3, 1])", "rob([])", "rob([5])", "rob([2, 1, 1, 2])"], "setup": ""}, {"kind": "py", "title": "Maximum subarray (Kadane)", "task": "<p>Return the largest sum of a non-empty contiguous subarray.<\/p>", "hint": "At each x, either extend the current run (cur + x) or start fresh (x).", "solution": "def max_subarray(nums):\n    best = cur = nums[0]\n    for x in nums[1:]:\n        cur = max(x, cur + x)\n        best = max(best, cur)\n    return best", "starter": "def max_subarray(nums):\n    pass", "tests": ["max_subarray([-2, 1, -3, 4, -1, 2, 1, -5, 4])", "max_subarray([1])", "max_subarray([-3, -1, -2])", "max_subarray([5, 4, -1, 7, 8])"], "setup": ""}]}, {"n": 80, "week": 12, "track": "py", "title": "Dynamic programming 3: coin change", "learn": "<p><strong>Unbounded choices:<\/strong> you can use each coin as many times as you like.<\/p>\n<p>State: <code>dp[a]<\/code> = the fewest coins needed to make amount <code>a<\/code>.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>dp[0] = 0\ndp[a] = 1 + min(dp[a - c] for each coin c with c &lt;= a)<\/code><\/pre>\n<p>Fill the table from 0 up to <code>amount<\/code> (bottom-up). Use <code>float(&#x27;inf&#x27;)<\/code> to mean \"impossible\".<\/p>\n<div class=\"bridge\">Real-world bridge: the same structure shows up in cash-dispensing ATMs and in minimum-cost resource allocation.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Coin change", "task": "<p>Return the fewest coins needed to make <code>amount<\/code>, or -1 if it can't be made.<\/p>", "hint": "Use a dp list of size amount + 1, filled with inf except dp[0] = 0. Loop over the amounts, then over the coins.", "solution": "def coin_change(coins, amount):\n    INF = float(\"inf\")\n    dp = [0] + [INF] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a and dp[a - c] + 1 < dp[a]:\n                dp[a] = dp[a - c] + 1\n    return dp[amount] if dp[amount] != INF else -1", "starter": "def coin_change(coins, amount):\n    pass", "tests": ["coin_change([1, 2, 5], 11)", "coin_change([2], 3)", "coin_change([1], 0)", "coin_change([1, 5, 10, 20, 50, 100, 200, 500, 2000], 2763)"], "setup": ""}, {"kind": "py", "title": "Ways to make change", "task": "<p>Return the number of <strong>combinations<\/strong> of coins that sum to <code>amount<\/code> (order doesn't matter).<\/p>", "hint": "Put the coins in the OUTER loop, so each combination is counted once rather than once per ordering.", "solution": "def change_ways(amount, coins):\n    dp = [1] + [0] * amount\n    for c in coins:\n        for a in range(c, amount + 1):\n            dp[a] += dp[a - c]\n    return dp[amount]", "starter": "def change_ways(amount, coins):\n    pass", "tests": ["change_ways(5, [1, 2, 5])", "change_ways(3, [2])", "change_ways(10, [10])", "change_ways(0, [1, 2])"], "setup": ""}]}, {"n": 81, "week": 12, "track": "py", "title": "Dynamic programming 4: 2-D tables", "learn": "<p>For two sequences, the state is <code>dp[i][j]<\/code>: the answer for the <strong>first i characters of a<\/strong> and the <strong>first j characters of b<\/strong>.<\/p>\n<p>Longest common subsequence:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>if a[i-1] == b[j-1]:  dp[i][j] = dp[i-1][j-1] + 1\nelse:                 dp[i][j] = max(dp[i-1][j], dp[i][j-1])<\/code><\/pre>\n<p>Draw the table on paper for \"abcde\" vs \"ace\". Filling in a DP table by hand once makes the idea much easier to understand.<\/p>\n<div class=\"bridge\">Data bridge: edit distance (the stretch) is how fuzzy matching of customer names works. \"Ananya Rao\" vs \"Anaya Rao\" is 1 edit apart.<\/div>", "stretch": null, "problems": [{"kind": "py", "title": "Longest common subsequence", "task": "<p>Return the length of the longest common subsequence of strings <code>a<\/code> and <code>b<\/code>.<\/p>", "hint": "Make a (len(a)+1) × (len(b)+1) table of zeros, then fill it row by row using the rule in the lesson.", "solution": "def lcs(a, b):\n    dp = [[0] * (len(b) + 1) for _ in range(len(a) + 1)]\n    for i in range(1, len(a) + 1):\n        for j in range(1, len(b) + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            else:\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n    return dp[-1][-1]", "starter": "def lcs(a, b):\n    pass", "tests": ["lcs('abcde', 'ace')", "lcs('abc', 'abc')", "lcs('abc', 'def')", "lcs('', 'abc')", "lcs('ananya rao', 'anaya rao')"], "setup": ""}, {"kind": "py", "title": "Edit distance", "task": "<p>Return the minimum number of single-character inserts, deletes or replaces needed to turn <code>a<\/code> into <code>b<\/code>.<\/p>", "hint": "The first row and column are 0..n and 0..m. When the characters differ, take 1 + min(delete, insert, replace).", "solution": "def edit_distance(a, b):\n    m, n = len(a), len(b)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n    for i in range(m + 1):\n        dp[i][0] = i\n    for j in range(n + 1):\n        dp[0][j] = j\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            if a[i - 1] == b[j - 1]:\n                dp[i][j] = dp[i - 1][j - 1]\n            else:\n                dp[i][j] = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])\n    return dp[m][n]", "starter": "def edit_distance(a, b):\n    pass", "tests": ["edit_distance('horse', 'ros')", "edit_distance('intention', 'execution')", "edit_distance('', 'abc')", "edit_distance('Ananya Rao', 'Anaya Rao')"], "setup": ""}]}, {"n": 82, "week": 12, "track": "py", "title": "Capstone: LRU cache (OOP + DSA)", "learn": "<p>An <strong>LRU (least recently used) cache<\/strong> holds at most <code>capacity<\/code> items. When it's full, it evicts the one that was used longest ago. Caches in web servers, databases and CPUs all work this way.<\/p>\n<p>It needs <strong>O(1) get and put<\/strong>, and that takes two structures working together:<\/p>\n<ul><li>a <strong>dict<\/strong> for instant key lookup<\/li><li>an ordering of keys from least to most recently used<\/li><\/ul>\n<p><code>collections.OrderedDict<\/code> does both: <code>move_to_end(key)<\/code> marks a key as most recent, and <code>popitem(last=False)<\/code> evicts the oldest.<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>from collections import OrderedDict\nod = OrderedDict()\nod[&quot;a&quot;] = 1; od[&quot;b&quot;] = 2\nod.move_to_end(&quot;a&quot;)        # order is now b, a\nod.popitem(last=False)     # removes (&#x27;b&#x27;, 2)<\/code><\/pre>\n<p>This is a real interview favourite. Once it passes, try writing it again with a dict plus your own doubly linked list.<\/p>", "stretch": "Rebuild it with your own doubly linked list (head and tail sentinel nodes) plus a dict of key → node.", "problems": [{"kind": "py", "title": "LRU cache", "task": "<p>Implement <code>LRUCache(capacity)<\/code> with:<\/p>\n<ul><li><code>get(key)<\/code> → the value, or -1 if missing (marks the key as recently used)<\/li><li><code>put(key, value)<\/code> → insert or update; evict the least recently used key when over capacity<\/li><\/ul>", "hint": "get: if the key exists, move_to_end and return it. put: set the value, move_to_end, and popitem(last=False) if over capacity.", "solution": "from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.data = OrderedDict()\n\n    def get(self, key):\n        if key not in self.data:\n            return -1\n        self.data.move_to_end(key)\n        return self.data[key]\n\n    def put(self, key, value):\n        if key in self.data:\n            self.data.move_to_end(key)\n        self.data[key] = value\n        if len(self.data) > self.capacity:\n            self.data.popitem(last=False)", "starter": "from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity):\n        pass", "tests": ["(lambda c: (c.put(1, 1), c.put(2, 2), c.get(1), c.put(3, 3), c.get(2), c.put(4, 4), c.get(1), c.get(3), c.get(4))[2::2])(LRUCache(2))", "(lambda c: (c.put(1, 1), c.put(1, 10), c.get(1))[2])(LRUCache(1))", "(lambda c: (c.put(1, 1), c.put(2, 2), c.get(1))[2])(LRUCache(1))", "LRUCache(3).get(42)"], "setup": ""}]}, {"n": 83, "week": 12, "track": "pd", "title": "pandas capstone: monthly KPIs", "learn": "<p>Build the kind of metrics a bank's MIS report shows every month:<\/p>\n<pre class=\"code\" data-lang=\"python\"><code>df[&quot;month&quot;] = df[&quot;txn_date&quot;].dt.to_period(&quot;M&quot;).astype(str)    # &#x27;2026-01&#x27;\ndf.groupby(&quot;month&quot;)[&quot;account_id&quot;].nunique()                    # monthly active accounts\nmonthly = df[df.txn_type == &quot;CREDIT&quot;].groupby(&quot;month&quot;)[&quot;amount&quot;].sum()\nmonthly.pct_change() * 100                                      # month-over-month growth %\nmonthly.diff(), monthly.shift(1)                                # LAG-style comparisons<\/code><\/pre>\n<p>Next step after this plan: take one of your real SAS or SQL reports and rebuild it in pandas from start to finish.<\/p>", "stretch": null, "problems": [{"kind": "pd", "title": "Monthly active accounts", "task": "<p>Write <code>monthly_active(df)<\/code> returning a Series indexed by month <code>&#x27;YYYY-MM&#x27;<\/code> with the number of distinct accounts that transacted.<\/p>", "hint": "Group by a month string and use nunique().", "solution": "def monthly_active(df):\n    month = df[\"txn_date\"].dt.strftime(\"%Y-%m\")\n    return df.groupby(month)[\"account_id\"].nunique()", "starter": "def monthly_active(df):\n    pass", "tests": ["monthly_active(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}, {"kind": "pd", "title": "Month-over-month credit growth", "task": "<p>Write <code>mom_growth(df)<\/code> returning a Series indexed by <code>&#x27;YYYY-MM&#x27;<\/code>: the % change in total CREDIT amount versus the previous month, rounded to 2 (the first month is NaN).<\/p>", "hint": "Filter the credits, group by month, sum, then pct_change() * 100 and round(2).", "solution": "def mom_growth(df):\n    c = df[df[\"txn_type\"] == \"CREDIT\"]\n    monthly = c.groupby(c[\"txn_date\"].dt.strftime(\"%Y-%m\"))[\"amount\"].sum()\n    return (monthly.pct_change() * 100).round(2)", "starter": "def mom_growth(df):\n    pass", "tests": ["mom_growth(txns.copy())"], "setup": "import numpy as np\nimport pandas as pd\nbranches = pd.DataFrame({\n    'branch_id': [1, 2, 3, 4, 5],\n    'city': ['Hyderabad', 'Mumbai', 'Bengaluru', 'Chennai', 'Pune'],\n    'area': ['Banjara Hills', 'Andheri', 'Koramangala', 'T Nagar', 'Baner'],\n    'opened_year': [2015, 2012, 2018, 2020, 2022]})\ncustomers = pd.DataFrame({\n    'customer_id': list(range(1, 13)),\n    'name': ['Ananya Rao', 'Vikram Shah', 'Meera Iyer', 'Arjun Reddy', 'Kavya Nair', 'Rohan Gupta',\n             'Sneha Kulkarni', 'Farhan Ali', 'Divya Menon', 'Karthik Subramanian', 'Priya Sharma', 'Ananya Rao'],\n    'city': ['Hyderabad', 'Mumbai', 'Chennai', 'Hyderabad', 'Bengaluru', 'Pune', 'Pune', 'Mumbai',\n             'Bengaluru', 'Chennai', 'Hyderabad', 'Bengaluru'],\n    'join_date': pd.to_datetime(['2023-02-14', '2022-07-01', '2024-01-20', '2024-03-11', '2021-11-05',\n                                 '2024-06-30', '2023-09-17', '2022-12-02', '2024-08-08', '2023-05-25',\n                                 '2025-01-09', '2025-03-03']),\n    'segment': ['Retail', 'Premium', 'Retail', 'Premium', 'Retail', 'Retail', 'Premium', 'Retail',\n                'Retail', 'Premium', 'Retail', 'Retail']})\naccounts = pd.DataFrame({\n    'account_id': list(range(101, 116)),\n    'customer_id': [1, 1, 2, 3, 4, 4, 5, 6, 7, 7, 8, 9, 9, 10, 10],\n    'branch_id': [1, 1, 2, 4, 1, 3, 3, 5, 5, 5, 2, 3, 3, 4, 2],\n    'type': ['SAVINGS', 'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'SAVINGS', 'SAVINGS',\n             'CURRENT', 'SAVINGS', 'SAVINGS', 'SAVINGS', 'FD', 'CURRENT', 'SAVINGS'],\n    'balance': [52000.0, 180000.0, 410000.0, 23000.0, 98000.0, 500000.0, 67000.0, 15000.0,\n                220000.0, 45000.0, 8000.0, 31000.0, 150000.0, 275000.0, 61000.0]})\n_rows = []\nfor _n in range(1, 151):\n    _rows.append({'txn_id': _n, 'account_id': 101 + (_n * 7) % 15,\n                  'txn_date': pd.Timestamp('2026-01-01') + pd.Timedelta(days=(_n * 13) % 181),\n                  'amount': float(((_n * 37) % 50 + 1) * 100),\n                  'txn_type': 'DEBIT' if _n % 3 == 0 or _n % 7 == 0 else 'CREDIT',\n                  'channel': ['UPI', 'NEFT', 'ATM', 'CARD'][_n % 4]})\ntxns = pd.DataFrame(_rows)\ndel _rows, _n\n"}]}, {"n": 84, "week": 12, "track": "sql", "title": "SQL capstone: monthly leaders & growth", "learn": "<p>Sunday is SQL day. You already know SQL, so these sessions push into the areas interviews love: windows, CTEs, anti-joins, and data-quality checks. The database is <strong>SQLite<\/strong>, loaded with a small banking dataset (open the <strong>Tables<\/strong> panel to see it).<\/p>\n<p>SQLite notes: <code>strftime(&#x27;%Y-%m&#x27;, d)<\/code> for month, <code>julianday(d2) - julianday(d1)<\/code> for day differences, <code>||<\/code> to concatenate, <code>date(&#x27;2026-01-01&#x27;, &#x27;+1 day&#x27;)<\/code>. The checker compares your <strong>values<\/strong> (not your column names). Row order only matters when the task says \"ordered by\".<\/p>\n<p>Final day! Both of these combine CTEs, joins and window functions, which is the kind of query you'd write for a monthly MIS dashboard.<\/p>", "stretch": null, "problems": [{"kind": "sql", "title": "Top spender each month", "task": "<p>For each month, the customer(s) with the highest total <strong>DEBIT<\/strong> amount (keep ties): <code>month, name, spend<\/code>, <strong>ordered by<\/strong> month, name.<\/p>", "hint": "Use one CTE for spend per (month, customer), then RANK partitioned by month.", "solution": "WITH spend AS (\n    SELECT strftime('%Y-%m', t.txn_date) AS month, c.customer_id, c.name, SUM(t.amount) AS spend\n    FROM transactions t\n    JOIN accounts a ON a.account_id = t.account_id\n    JOIN customers c ON c.customer_id = a.customer_id\n    WHERE t.txn_type = 'DEBIT'\n    GROUP BY month, c.customer_id, c.name\n), ranked AS (\n    SELECT *, RANK() OVER (PARTITION BY month ORDER BY spend DESC) AS rk FROM spend\n)\nSELECT month, name, spend FROM ranked WHERE rk = 1\nORDER BY month, name;", "starter": "-- Write your query here\nSELECT ", "ordered": true}, {"kind": "sql", "title": "Month-over-month credit growth", "task": "<p><code>month, credits, prev_credits, growth_pct<\/code> (rounded 2, NULL for the first month), <strong>ordered by<\/strong> month.<\/p>", "hint": "LAG over the monthly totals. Compare your result with your pandas answer from yesterday!", "solution": "WITH m AS (\n    SELECT strftime('%Y-%m', txn_date) AS month, SUM(amount) AS credits\n    FROM transactions WHERE txn_type = 'CREDIT'\n    GROUP BY month\n)\nSELECT month, credits,\n       LAG(credits) OVER (ORDER BY month) AS prev_credits,\n       ROUND(100.0 * (credits - LAG(credits) OVER (ORDER BY month)) / LAG(credits) OVER (ORDER BY month), 2) AS growth_pct\nFROM m\nORDER BY month;", "starter": "-- Write your query here\nSELECT ", "ordered": true}]}], "weeks": [{"n": 1, "title": "Python foundations", "goal": "Variables, strings, conditions, loops and lists. Write small functions without help.", "res": [["Official Python tutorial", "https://docs.python.org/3/tutorial/introduction.html"], ["Python Tutor (visualise code)", "https://pythontutor.com/python-compiler.html"]]}, {"n": 2, "title": "Collections & functions", "goal": "Dicts, sets and tuples, function arguments, comprehensions and exceptions.", "res": [["Data structures (docs)", "https://docs.python.org/3/tutorial/datastructures.html"], ["Errors & exceptions (docs)", "https://docs.python.org/3/tutorial/errors.ht /* ------------------------------------------------------------------ state + sync */
const LS = "dailycode.v1";
let S = (() => { try { return JSON.parse(localStorage.getItem(LS)) || null; } catch (_) { return null; } })() || {};
S.solved = S.solved || {}; S.done = S.done || {}; S.notes = S.notes || {}; S.drafts = S.drafts || {}; S.active = S.active || {};
let remote = null;
function persistLocal() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (_) {} }
function writer(getRef, getData, delay) {
  let timer = null, inflight = null, dirty = false;
  function flush() {
    const ref = getRef(); if (!ref) return;
    if (inflight) { dirty = true; return; }
    inflight = ref.set(getData()).catch(e => { if (e && (e.code === "invalid_argument" || e.code === "revoked")) { remote = null; setSync("Saved on this device"); } })
      .finally(() => { inflight = null; if (dirty) { dirty = false; flush(); } });
  }
  return () => { clearTimeout(timer); timer = setTimeout(flush, delay); };
}
const pushProgress = writer(() => remote && remote.prog, () => ({ solved: S.solved, done: S.done, notes: S.notes, active: S.active, t: Date.now() }), 1200);
const pushDrafts = writer(() => remote && remote.drafts, () => ({ drafts: S.drafts, t: Date.now() }), 2500);
function saveProgress() { persistLocal(); pushProgress(); updateHeader(); }
function saveDraft() { persistLocal(); pushDrafts(); }
function setSync(t) { const el = $("#sync"); if (el) el.textContent = t; }
function mergeNewer(a, b) { const out = { ...a }; for (const k in b) { if (!out[k] || (b[k] && (b[k].t || 0) > (out[k].t || 0))) out[k] = b[k]; } return out; }
function mergeDates(a, b) { const out = { ...a }; for (const k in b) { if (!out[k] || b[k] < out[k]) out[k] = b[k]; } return out; }
async function connectRemote() {
  try {
    if (!window.claude || !window.claude.use) { setSync("Saved on this device"); return; }
    const db = await window.claude.use("db"); const user = await window.claude.use("user");
    if (!db || !user) { setSync("Saved on this device"); return; }
    const id = await user.id(); if (!id) { setSync("Saved on this device"); return; }
    const prog = db.doc("data/users/" + id + "/progress"), drafts = db.doc("data/users/" + id + "/drafts");
    let to; const timeout = new Promise((_, rej) => { to = setTimeout(() => rej("timeout"), 10000); });
    const [p, d] = await Promise.race([Promise.all([prog.get(), drafts.get()]), timeout]); clearTimeout(to);
    if (p.exists) { const r = p.data(); S.solved = mergeDates(S.solved, r.solved || {}); S.done = mergeDates(S.done, r.done || {}); S.notes = mergeNewer(S.notes, r.notes || {}); S.active = mergeDates(S.active, r.active || {}); }
    if (d.exists) S.drafts = mergeNewer(S.drafts, (d.data() || {}).drafts || {});
    remote = { prog, drafts }; persistLocal(); setSync("☁ Synced to your account");
    pushProgress(); pushDrafts(); updateHeader();
    if (!$(".ed-ta:focus")) route();
  } catch (e) { setSync("Saved on this device"); }
}

const pkey = (n, i) => n + "-" + i;
const isDone = n => !!S.done[n];

function markActive() { const t = todayStr(); if (!S.active[t]) { S.active[t] = t; } }
function streak() {
  const days = new Set(Object.keys(S.active));
  const d = new Date(); let n = 0;
  const fmt = x => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
  if (!days.has(fmt(d))) d.setDate(d.getDate() - 1);
  while (days.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function updateHeader() {
  $("#streak").textContent = "🔥 " + streak() + (streak() === 1 ? " day" : " days");
  $("#prog").textContent = Object.keys(S.done).length + " / 84 days";
}
function checkDayComplete(n) {
  const d = DAYS[n - 1];
  if (!S.done[n] && d.problems.every((_, i) => S.solved[pkey(n, i)])) { S.done[n] = todayStr(); return true; }
  return false;
}

/* ------------------------------------------------------------------ tiny markdown for tutor */
function mdLite(t) {
  const blocks = t.split(/```/);
  return blocks.map((b, i) => {
    if (i % 2) { const nl = b.indexOf("\n"); const lang = nl > -1 ? b.slice(0, nl).trim() : ""; const code = nl > -1 ? b.slice(nl + 1) : b; return '<pre><code>' + highlight(code.replace(/\n$/, ""), lang === "sql" ? "sql" : "python") + "</code></pre>"; }
    let h = esc(b).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    h = h.split(/\n{2,}/).map(p => {
      if (/^\s*([-*]|\d+\.) /m.test(p) && p.trim().split("\n").every(l => /^\s*([-*]|\d+\.) /.test(l))) return "<ul>" + p.trim().split("\n").map(l => "<li>" + l.replace(/^\s*([-*]|\d+\.) /, "") + "</li>").join("") + "</ul>";
      return p.trim() ? "<p>" + p.replace(/\n/g, "<br>") + "</p>" : "";
    }).join("");
    return h;
  }).join("");
}

      h += '<ul class="tests">' + r.tests.map((t, k) => {
        let li = "<li>" + (t.pass ? '<span class="pass">✓</span>' : '<span class="fail">✗</span>') + ' <span class="ex">' + esc(t.expr.length > 160 ? t.expr.slice(0, 157) + "…" : t.expr) + "</span>";
        if (!t.pass) li += '<div class="cmp">' + (t.err ? '<span>error</span><pre class="err">' + esc(t.err) + "</pre>" : '<span>got</span><pre>' + esc(t.got) + '</pre><span>expected</span><pre>' + esc(t.expected) + "</pre>") + (t.err && t.expected ? '<span>expected</span><pre>' + esc(t.expected) + "</pre>" : "") + "</div>";
        return li + "</li>";
      }).join("") + "</ul>";
      current.last = r.tests.map(t => (t.pass ? "PASS " : "FAIL ") + t.expr + (t.pass ? "" : t.err ? "\n   error: " + t.err : "\n   got: " + t.got + "\n   expected: " + t.expected)).join("\n");
    } else if (!r.error) current.last = "Ran without errors.";
    if (r.stdout) h += '<div style="margin-top:8px"><div class="muted" style="font-size:12px;margin-bottom:2px">printed output</div><pre>' + esc(r.stdout) + "</pre></div>";
    else if (!check && !r.error) h += '<div class="muted">Ran without errors. Nothing was printed, so use <code>print(...)</code> to see values, or click <b>Check</b> to run the tests.</div>';
    ob.innerHTML = h;
    bindGoto(ob);
    revealTutor();
  }
  function renderSql(r, check) {
    let h = "";
    if (r.error) { h = '<pre class="err">' + esc(r.error) + "</pre>"; current.last = "Error: " + r.error; ob.innerHTML = h; revealTutor(); return; }
    if (check && r.check) {
      h += r.check.pass ? solvedNow() : '<div class="banner bad">Not yet: ' + esc(r.check.msg) + "</div>";
      current.last = r.check.pass ? "Passed." : "Mismatch: " + r.check.msg;
    } else current.last = "Query ran, " + r.nrows + " rows.";
    h += resultTable(r.cols, r.rows, r.nrows);
    if (check && r.check && !r.check.pass) h += '<details style="margin-top:10px"><summary>Show expected result</summary>' + resultTable(r.check.ecols, r.check.erows, r.check.erows.length) + "</details>";
    ob.innerHTML = h; bindGoto(ob); revealTutor();
  }
  function bindGoto(root) { root.querySelectorAll("[data-goto]").forEach(a => a.onclick = e => { e.preventDefault(); const j = +a.dataset.goto; document.querySelectorAll(".ptab").forEach(x => x.classList.toggle("on", +x.dataset.p === j)); renderProblem(n, j); }); }
  $("#run").onclick = () => go(false);
  $("#check").onclick = () => go(true);
  $("#hintb").onclick = () => { $("#extra").innerHTML = '<div class="hint">💡 ' + p.hint + "</div>"; markActive(); revealTutor(); };
  let solStage = 0;
  $("#solb").onclick = () => {
    if (solStage === 0) { solStage = 1; $("#solb").textContent = "🔑 Sure? Struggling is how you learn. Click again"; return; }
    $("#extra").innerHTML = '<div class="sol"><div class="muted" style="font-size:13px;margin-top:8px">Reference solution. Read it, close it, then type it yourself from memory:</div><pre class="code" data-lang="' + (isSql ? "sql" : "python") + '"><code>' + esc(p.solution) + '</code></pre><button class="btn" id="hidesol">Hide</button></div>';
    paintCode($("#extra")); $("#hidesol").onclick = () => { $("#extra").innerHTML = ""; solStage = 0; $("#solb").textContent = "🔑 Solution"; };
  };
  let resetStage = 0;
  $("#reset").onclick = () => { if (!resetStage) { resetStage = 1; $("#reset").textContent = "↺ Click again to reset"; setTimeout(() => { resetStage = 0; const b = $("#reset"); if (b) b.textContent = "↺ Reset"; }, 3000); return; } ed.value = p.starter; resetStage = 0; $("#reset").textContent = "↺ Reset"; };
  setupTutor(d, p, ed);
  bindPeek(body);
}

/* ------------------------------------------------------------------ Claude tutor */
let samplerP = null;
function getSampler() { if (!samplerP) samplerP = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null); return samplerP; }
let tutorOK = null;
function revealTutor() { if (tutorOK) { const t = $("#tutor"); if (t) t.style.display = ""; } }
function setupTutor(d, p, ed) {
  getSampler().then(s => { tutorOK = !!s; });
  const ans = $("#ans");
  let ctrl = null;
  document.querySelectorAll("[data-ask]").forEach(b => b.onclick = async () => {
    const s = await getSampler(); if (!s) return;
    const mode = b.dataset.ask; const q = $("#askq").value.trim();
    if (mode === "q" && !q) { $("#askq").focus(); return; }
    const plain = h => h.replace(/<[^>]+>/g, "").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#39;/g, "'");
    const lang = p.kind === "sql" ? "SQL (SQLite)" : p.kind === "pd" ? "Python with pandas/NumPy" : "Python";
    const asks = {
      nudge: "Give ONE small, specific nudge (2–4 sentences) that helps them take the next step. Do NOT write the solution and do NOT show more than one line of code. Ask a guiding question if useful.",
      error: "Explain the error or failing test in plain English: what it means, which line causes it and why. Suggest what to check or try next. Don't write the full solution.",
      review: "Review their code like a friendly senior engineer: correctness and edge cases, time/space complexity (Big-O), and 1–2 ways to make it cleaner or more idiomatic. Under 170 words; short snippets only.",
      q: "Answer their question clearly and concretely. Don't give away the full solution unless they explicitly ask for it.",
    };
    const prompt = `You are a patient, encouraging coding tutor inside a daily practice website. The learner is a data engineer with 3 years of SQL who is new to Python, OOP and data structures & algorithms. Relate ideas to SQL when it genuinely helps.

Today's lesson: Day ${d.n}, "${d.title}"
Problem (${lang}): ${p.title}
${plain(p.task)}

Learner's current code:
\`\`\`
${ed.value}
\`\`\`

Latest result from running/checking it:
${current && current.last ? current.last.slice(0, 2500) : "(not run yet)"}

${mode === "q" ? "Learner's question: " + q + "\n\n" : ""}Task: ${asks[mode]}
Reply in concise Markdown.`;
    if (ctrl) ctrl.abort(); ctrl = new AbortController();
    ans.innerHTML = '<div class="muted">Thinking…</div>';
    document.querySelectorAll("[data-ask]").forEach(x => x.disabled = true);
    try {
      const r = await s(prompt, { signal: ctrl.signal, onText: ({ text }) => { ans.innerHTML = mdLite(text); } });
      ans.innerHTML = mdLite(r.text || "");
    } catch (e) {
      if (e && e.code === "not_granted") { $("#tutor").style.display = "none"; tutorOK = false; }
      else if (e && e.name !== "AbortError") ans.innerHTML = '<div class="err">' + (e && e.code === "rate_limited" ? "Too many questions in a row. Wait a minute and try again." : "Couldn't reach Claude right now.") + "</div>";
    } finally { document.querySelectorAll("[data-ask]").forEach(x => x.disabled = false); }
  });
  $("#askq").addEventListener("keydown", e => { if (e.key === "Enter") document.querySelector('[data-ask="q"]').click(); });
}

/* ------------------------------------------------------------------ playground */
function viewPlayground() {
  setNav("playground");
  $("#app").innerHTML = `
    <div class="dayhead"><h1>Playground</h1><span class="muted">Scratch space: run the lesson examples, experiment, break things.</span></div>
    <div class="pg">
      <div class="card">
        <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px">Python</h2>
        <label style="font-size:13.5px;display:flex;gap:6px;align-items:center;margin-bottom:8px"><input type="checkbox" id="pgpd"> Load pandas + NumPy and the bank DataFrames (<code>txns</code>, <code>accounts</code>, <code>customers</code>, <code>branches</code>)</label>
        <div id="pyed"></div>
        <div class="toolbar"><button class="btn primary" id="pyrun">▶ Run</button><span class="kbd">Ctrl/⌘ + Enter</span></div>
        <div class="out" style="display:none"><div class="out-h"><span>Output</span></div><div class="out-b" id="pyout"></div></div>
      </div>
      <div class="card">
        <h2 style="font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px">SQL (SQLite)</h2>
        <div id="sqled"></div>
        <div class="toolbar"><button class="btn primary" id="sqlrun">▶ Run</button><span class="kbd">One statement at a time · the database resets on every run</span></div>
        <div class="out" style="display:none"><div class="out-h"><span>Result</span></div><div class="out-b" id="sqlout"></div></div>
        <details style="margin-top:12px" open><summary>Tables</summary>${tablesPanel()}</details>
      </div>
    </div>`;
  const pyDraft = S.drafts["pg-py"] ? S.drafts["pg-py"].code : '# Try anything here\nnums = [5, 3, 8, 1]\nprint(sorted(nums))\nprint({n: n * n for n in nums})\n';
  const sqlDraft = S.drafts["pg-sql"] ? S.drafts["pg-sql"].code : "SELECT channel, COUNT(*) AS n, SUM(amount) AS total\nFROM transactions\nGROUP BY channel\nORDER BY total DESC;";
  const save = k => v => { S.drafts[k] = { code: v, t: Date.now() }; saveDraft(); };
  const pyed = makeEditor($("#pyed"), { value: pyDraft, minLines: 14, onChange: save("pg-py"), onRun: () => runPy(), onCheck: () => runPy() });
  const sqled = makeEditor($("#sqled"), { value: sqlDraft, lang: "sql", minLines: 8, onChange: save("pg-sql"), onRun: () => runSql(), onCheck: () => runSql() });
  async function runPy() {
    const o = $("#pyout"); o.closest(".out").style.display = ""; o.innerHTML = '<div class="muted">Running…</div>';
    const usePd = $("#pgpd").checked;
    const r = await Engine.run("py", { setup: usePd ? DAYS[12].problems[0].setup : "", code: pyed.value, check: false }, usePd ? ["numpy", "pandas"] : [], s => o.innerHTML = '<div class="muted">' + esc(s) + "</div>");
    o.innerHTML = (r.stdout ? "<pre>" + esc(r.stdout) + "</pre>" : "") + (r.error ? '<pre class="err">' + esc(r.error) + "</pre>" : "") + (!r.stdout && !r.error ? '<div class="muted">No output. Use print().</div>' : "");
  }
  async function runSql() {
    const o = $("#sqlout"); o.closest(".out").style.display = ""; o.innerHTML = '<div class="muted">Running…</div>';
    const r = await Engine.run("sql", { schema: C.schema, sql: sqled.value, check: false }, ["sqlite3"], s => o.innerHTML = '<div class="muted">' + esc(s) + "</div>");
    o.innerHTML = r.error ? '<pre class="err">' + esc(r.error) + "</pre>" : resultTable(r.cols, r.rows, r.nrows);
  }
  $("#pyrun").onclick = runPy; $("#sqlrun").onclick = runSql;
  bindPeek($("#app"));
}

/* ------------------------------------------------------------------ router */
function route() {
  const h = (location.hash || "").slice(1);
  let m;
  if (h === "plan") return viewPlan();
  if (h === "playground") return viewPlayground();
  if ((m = h.match(/^day-(\d+)$/))) return viewDay(Math.min(84, Math.max(1, +m[1])));
  if (h === "today") return viewDay(currentDay());
  return Object.keys(S.done).length || Object.keys(S.solved).length ? viewDay(currentDay()) : viewPlan();
}
window.addEventListener("hashchange", route);
updateHeader();
route();
Engine.start();
setTimeout(connectRemote, 0);
</script>
